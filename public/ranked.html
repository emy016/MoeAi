<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>EDUMOE · Ultimate Ranked</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* =============================================================
       EDUMOE V2 – ULTIMATE RANKED ARENA (FIXED)
       Full theme system, glass UI, 8 bots, tournaments, achievements
       ============================================================= */

    /* ─── THEMES ──────────────────────────────────────────────────── */
    :root {
      --bg1: #0a0a0f;
      --bg2: #111118;
      --bg3: #1a1a2a;
      --accent: #e11d48;
      --accent2: #f43f5e;
      --accent3: #fb7185;
      --accent-glow: rgba(225, 29, 72, 0.35);
      --glow: rgba(225, 29, 72, 0.28);
      --glow2: rgba(225, 29, 72, 0.12);
      --glass-border: rgba(225, 29, 72, 0.18);
      --glass-border2: rgba(225, 29, 72, 0.32);
      --txt1: #fff0f5;
      --txt2: rgba(255, 192, 208, 0.75);
      --txt3: rgba(192, 128, 144, 0.50);
      --tint: rgba(225, 29, 72, 0.05);
      --tint2: rgba(225, 29, 72, 0.10);
      --tint3: rgba(225, 29, 72, 0.18);
      --c-glass: #c8a0a8;
      --c-light: #ffe0e8;
      --c-dark: #300010;
      --reflex-l: 0.45;
      --reflex-d: 1.7;
      --sat: 190%;
      --glass-blur: 14px;
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-xl: 32px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      --transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      --ok: #4fff8f;
      --okbg: rgba(79, 255, 143, 0.12);
      --okbd: rgba(79, 255, 143, 0.35);
      --warn: #ffb347;
      --warnbg: rgba(255, 179, 71, 0.10);
      --no: #ff6b6b;
      --nobg: rgba(255, 107, 107, 0.10);
      --nobd: rgba(255, 107, 107, 0.35);
      --gold: #ffd700;
      --silver: #c0c0c0;
      --bronze: #cd7f32;
    }

    [data-theme="lava"] { --bg1: #0c0c0e; --bg2: #161618; --bg3: #202024; --accent: #ff5a1f; --accent2: #ff8c42; --accent3: #ffb347; --accent-glow: rgba(255,90,31,0.35); --glow: rgba(255,90,31,0.28); --glow2: rgba(255,90,31,0.12); --glass-border: rgba(255,90,31,0.18); --glass-border2: rgba(255,90,31,0.32); --txt1: #fff; --txt2: rgba(255,255,255,0.70); --txt3: rgba(255,255,255,0.40); --tint: rgba(255,255,255,0.05); --tint2: rgba(255,255,255,0.10); --tint3: rgba(255,255,255,0.18); --c-glass: #c8c8c9; --c-light: #fff; --c-dark: #000; --reflex-l:0.35; --reflex-d:1.8; --sat:180%; }
    [data-theme="space"] { --bg1: #000; --bg2: #0a0a14; --bg3: #141428; --accent: #7c3aed; --accent2: #a855f7; --accent3: #c084fc; --accent-glow: rgba(124,58,237,0.35); --glow: rgba(124,58,237,0.28); --glow2: rgba(124,58,237,0.12); --glass-border: rgba(124,58,237,0.18); --glass-border2: rgba(124,58,237,0.32); --txt1: #f0e8ff; --txt2: #c8b0ff; --txt3: #a080e0; --tint: rgba(124,58,237,0.05); --tint2: rgba(124,58,237,0.10); --tint3: rgba(124,58,237,0.18); --c-glass: #b0a0d0; --c-light: #e8d8ff; --c-dark: #1a0030; --reflex-l:0.50; --reflex-d:1.6; --sat:200%; }
    [data-theme="oxford"] { --bg1: #000510; --bg2: #020a18; --bg3: #081530; --accent: #00d4ff; --accent2: #00f0ff; --accent3: #80f8ff; --accent-glow: rgba(0,212,255,0.35); --glow: rgba(0,212,255,0.28); --glow2: rgba(0,212,255,0.12); --glass-border: rgba(0,212,255,0.18); --glass-border2: rgba(0,212,255,0.32); --txt1: #e0fcff; --txt2: #80d8f0; --txt3: #40b0d0; --tint: rgba(0,212,255,0.05); --tint2: rgba(0,212,255,0.10); --tint3: rgba(0,212,255,0.18); --c-glass: #80e8f8; --c-light: #e0fcff; --c-dark: #000810; --reflex-l:0.55; --reflex-d:1.5; --sat:200%; }
    [data-theme="gray"] { --bg1: #0f0f12; --bg2: #18181b; --bg3: #22222a; --accent: #6b7280; --accent2: #9ca3af; --accent3: #d1d5db; --accent-glow: rgba(107,114,128,0.35); --glow: rgba(107,114,128,0.28); --glow2: rgba(107,114,128,0.12); --glass-border: rgba(107,114,128,0.18); --glass-border2: rgba(107,114,128,0.32); --txt1: #f3f4f6; --txt2: #9ca3af; --txt3: #6b7280; --tint: rgba(107,114,128,0.05); --tint2: rgba(107,114,128,0.10); --tint3: rgba(107,114,128,0.18); --c-glass: #c8c8c9; --c-light: #fff; --c-dark: #000; --reflex-l:0.35; --reflex-d:1.8; --sat:120%; }
    [data-theme="light"] { --bg1: #fff; --bg2: #f4f4f6; --bg3: #e8e8ec; --accent: #111; --accent2: #333; --accent3: #555; --accent-glow: rgba(0,0,0,0.12); --glow: rgba(0,0,0,0.12); --glow2: rgba(0,0,0,0.06); --glass-border: rgba(0,0,0,0.10); --glass-border2: rgba(0,0,0,0.20); --txt1: #1a1a1a; --txt2: #555; --txt3: #888; --tint: rgba(0,0,0,0.03); --tint2: rgba(0,0,0,0.06); --tint3: rgba(0,0,0,0.12); --c-glass: #000; --c-light: #fff; --c-dark: #000; --reflex-l:0.06; --reflex-d:0.6; --sat:100%; }
    [data-theme="custom"] { --bg1: #0a0a0f; --bg2: #111118; --bg3: #1a1a2a; --accent: var(--custom-accent,#e11d48); --accent2: var(--custom-accent2,#f43f5e); --accent3: var(--custom-accent3,#fb7185); --accent-glow: var(--custom-glow,rgba(225,29,72,0.35)); --glow: var(--custom-glow,rgba(225,29,72,0.28)); --glow2: var(--custom-glow2,rgba(225,29,72,0.12)); --glass-border: var(--custom-border,rgba(225,29,72,0.18)); --glass-border2: var(--custom-border2,rgba(225,29,72,0.32)); --txt1:#fff0f5; --txt2:#ffc0d0; --txt3:#c08090; --tint: var(--custom-tint,rgba(225,29,72,0.05)); --tint2: var(--custom-tint2,rgba(225,29,72,0.10)); --tint3: var(--custom-tint3,rgba(225,29,72,0.18)); --c-glass:#c8a0a8; --c-light:#ffe0e8; --c-dark:#300010; --reflex-l:0.45; --reflex-d:1.7; --sat:190%; }

    [data-theme="terminal"] {
      --bg1: #050a05; --bg2: #071007; --bg3: #0a180a; --accent: #4fff8f; --accent2: #6effa0; --accent3: #9dffc0;
      --accent-glow: rgba(79,255,143,0.35); --glow: rgba(79,255,143,0.28); --glow2: rgba(79,255,143,0.10);
      --glass-border: rgba(79,255,143,0.18); --glass-border2: rgba(79,255,143,0.32);
      --txt1: #b8ffcf; --txt2: #4fff8f; --txt3: #2f8f57;
      --tint: rgba(79,255,143,0.04); --tint2: rgba(79,255,143,0.08); --tint3: rgba(79,255,143,0.14);
      --c-glass: #4fff8f; --c-light: #b8ffcf; --c-dark: #001a08; --reflex-l:0.20; --reflex-d:1.2; --sat:130%; --glass-blur:8px; --shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    [data-theme="terminal"] body,
    [data-theme="terminal"] .brand,
    [data-theme="terminal"] .rank-card,
    [data-theme="terminal"] .mode-tab {
      font-family: 'Fira Code', monospace !important;
      letter-spacing: 0 !important;
    }
    [data-theme="terminal"] .brand-mark { background: var(--accent) !important; color: #000 !important; }
    [data-theme="terminal"] .btn-primary { background: var(--accent) !important; color: #000 !important; }

    .crt-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 9998; pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.10) 0px, rgba(0,0,0,0.10) 1px, transparent 1px, transparent 3px);
      mix-blend-mode: multiply;
    }
    [data-theme="terminal"] .crt-overlay { display: block; }
    [data-theme="terminal"]:not(.no-crt) body { animation: crt-flicker 4s infinite; }
    @keyframes crt-flicker { 0%,95%,100%{opacity:1} 96%{opacity:0.94} 98%{opacity:0.98} }
    html.no-crt .crt-overlay { display: none !important; }
    html.no-crt [data-theme="terminal"] body { animation: none !important; }
    @media (prefers-reduced-motion: reduce) { [data-theme="terminal"] body { animation: none !important; } .crt-overlay { background: none; } }

    /* ─── BASE ───────────────────────────────────────────────────── */
    *,
    *::before,
    *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg1);
      color: var(--txt1);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.5s ease, color 0.4s ease;
      padding-bottom: 72px;
    }

    .ic {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1em; height: 1em;
      vertical-align: -0.125em;
    }
    .ic svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .ic.fill svg { fill: currentColor; stroke: none; }

    .lg {
      position: relative;
      isolation: isolate;
    }
    .lg-effect {
      position: absolute; inset: 0; z-index: 0; border-radius: inherit;
      backdrop-filter: blur(var(--glass-blur, 14px)) saturate(var(--sat));
      -webkit-backdrop-filter: blur(var(--glass-blur, 14px)) saturate(var(--sat));
      overflow: hidden;
    }
    .lg-tint {
      position: absolute; inset: 0; z-index: 1; border-radius: inherit;
      background: var(--tint);
      transition: background 0.4s ease;
    }
    .lg-shine {
      position: absolute; inset: 0; z-index: 2; border-radius: inherit;
      overflow: hidden;
      box-shadow:
        inset 2px 3px 0px -1.5px color-mix(in srgb, var(--c-light) calc(var(--reflex-l)*90%), transparent),
        inset 0 0 0 1px color-mix(in srgb, var(--c-light) calc(var(--reflex-l)*12%), transparent),
        inset -2px -2px 0px -1px color-mix(in srgb, var(--c-light) calc(var(--reflex-l)*70%), transparent),
        inset -2px -7px 1px -5px color-mix(in srgb, var(--c-light) calc(var(--reflex-l)*55%), transparent),
        inset 0 -1px 4px 0px color-mix(in srgb, var(--c-dark) calc(var(--reflex-d)*10%), transparent),
        inset -1.5px 2.5px 0px -2px color-mix(in srgb, var(--c-dark) calc(var(--reflex-d)*18%), transparent),
        inset 0px 3px 5px -2px color-mix(in srgb, var(--c-dark) calc(var(--reflex-d)*16%), transparent),
        inset 2px -6px 1px -4px color-mix(in srgb, var(--c-dark) calc(var(--reflex-d)*8%), transparent),
        0px 1px 6px 0px color-mix(in srgb, var(--c-dark) calc(var(--reflex-d)*10%), transparent),
        0px 8px 20px 0px color-mix(in srgb, var(--c-dark) calc(var(--reflex-d)*8%), transparent),
        0px 0px 40px -10px var(--glow2);
    }
    .lg > *:not(.lg-effect):not(.lg-tint):not(.lg-shine) { position: relative; z-index: 3; }
    .lg-pill { border-radius: 999px; }
    .lg-card { border-radius: var(--radius-lg); }
    .lg-panel { border-radius: var(--radius-xl); }

    /* ─── TOP BAR ────────────────────────────────────────────────── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 22px;
      border-bottom: 1px solid var(--glass-border);
      background: var(--bg2);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: -0.03em;
      text-decoration: none;
      color: var(--txt1);
      font-size: 18px;
    }
    .brand-mark {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: grid; place-items: center; color: #fff; font-size: 14px;
      box-shadow: 0 4px 12px var(--accent-glow);
    }
    .brand small { color: var(--txt3); font-weight: 500; font-size: 12px; }
    .topbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .theme-switcher {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 6px;
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      background: var(--tint);
      flex-wrap: wrap;
    }
    .theme-dot {
      width: 14px; height: 14px; border-radius: 50%;
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      flex-shrink: 0;
    }
    .theme-dot:hover { transform: scale(1.25); }
    .theme-dot.active { border-color: var(--txt1); transform: scale(1.1); }
    .td-ruby { background: #e11d48; }
    .td-lava { background: #ff5a1f; }
    .td-space { background: #7c3aed; }
    .td-oxford { background: #00d4ff; }
    .td-gray { background: #6b7280; }
    .td-light { background: #ddd; border: 1px solid #aaa; }
    .td-terminal { background: #4fff8f; box-shadow: 0 0 8px rgba(79,255,143,0.6); }
    .custom-color-wrap {
      position: relative; width: 20px; height: 20px; border-radius: 50%;
      overflow: hidden; border: 2px solid var(--glass-border);
      cursor: pointer; flex-shrink: 0; background: var(--accent);
    }
    .custom-color-wrap input[type="color"] {
      position: absolute; top: -4px; left: -4px; width: calc(100% + 8px); height: calc(100% + 8px);
      border: none; padding: 0; cursor: pointer; background: none;
    }
    .custom-color-wrap input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    .custom-color-wrap input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }
    .crt-toggle {
      display: none; width: 28px; height: 28px; border-radius: 999px;
      border: 1px solid var(--glass-border);
      background: var(--tint2); color: var(--txt2);
      cursor: pointer; font-size: 12px;
      align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .crt-toggle:hover { color: var(--txt1); border-color: var(--accent2); }
    [data-theme="terminal"] .crt-toggle { display: inline-flex; }
    .crt-toggle.off { opacity: 0.4; }
    .btn-back {
      padding: 7px 14px; border-radius: 999px;
      border: 1px solid var(--glass-border);
      background: var(--tint); color: var(--txt2);
      font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all 0.2s;
      text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-back:hover { background: var(--tint2); color: var(--txt1); border-color: var(--accent2); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--glass-border);
      background: var(--tint);
      color: var(--txt1);
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      transition: all 0.16s;
    }
    .btn:hover { border-color: var(--accent2); background: var(--tint2); transform: translateY(-1px); }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; color: #fff;
      box-shadow: 0 4px 14px var(--accent-glow);
    }
    .btn-primary:hover { box-shadow: 0 6px 24px var(--accent-glow); transform: translateY(-2px); }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .btn-lg { padding: 12px 24px; font-size: 15px; }

    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
    .page-head { margin-bottom: 26px; }
    .page-head h1 {
      font-size: 32px; font-weight: 900; letter-spacing: -0.03em;
      display: flex; align-items: center; gap: 12px;
      flex-wrap: wrap;
    }
    .page-head h1 .ic { color: var(--accent2); }
    .page-head p { color: var(--txt3); font-size: 14px; margin-top: 5px; }

    /* ─── STATS ROW ──────────────────────────────────────────────── */
    .stats-row {
      display: flex;
      gap: 16px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .stat-pill {
      padding: 4px 14px;
      border-radius: 999px;
      background: var(--tint2);
      border: 1px solid var(--glass-border);
      font-size: 12px;
      color: var(--txt2);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stat-pill .num {
      color: var(--accent2);
      font-weight: 700;
      font-family: 'Fira Code', monospace;
    }

    /* ─── MODE TABS ───────────────────────────────────────────────── */
    .mode-tabs {
      display: flex;
      gap: 4px;
      background: var(--tint);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      margin-bottom: 26px;
      flex-wrap: wrap;
    }
    .mode-tab {
      padding: 9px 18px;
      border-radius: 9px;
      font-size: 13.5px;
      font-weight: 600;
      border: none;
      background: none;
      color: var(--txt3);
      cursor: pointer;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.18s;
    }
    .mode-tab.active {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      box-shadow: 0 4px 12px var(--accent-glow);
    }
    .mode-tab:not(.active):hover { color: var(--txt1); background: var(--tint2); }
    .mode-tab .badge {
      background: rgba(255,255,255,0.15);
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
    }
    .mode-tab.active .badge { background: rgba(0,0,0,0.2); }

    /* ─── RANK CARDS (Bots) ──────────────────────────────────────── */
    .rank-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
    }
    .rank-card {
      position: relative;
      padding: 22px;
      border-radius: var(--radius-md);
      background: var(--tint);
      border: 1px solid var(--glass-border);
      transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
      overflow: hidden;
      animation: card-in 0.4s ease both;
      cursor: pointer;
    }
    .rank-card:nth-child(1) { animation-delay: 0.03s; }
    .rank-card:nth-child(2) { animation-delay: 0.06s; }
    .rank-card:nth-child(3) { animation-delay: 0.09s; }
    .rank-card:nth-child(4) { animation-delay: 0.12s; }
    .rank-card:nth-child(5) { animation-delay: 0.15s; }
    .rank-card:nth-child(6) { animation-delay: 0.18s; }
    .rank-card:nth-child(7) { animation-delay: 0.21s; }
    .rank-card:nth-child(8) { animation-delay: 0.24s; }
    @keyframes card-in {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .rank-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent3));
      opacity: 0.8;
    }
    .rank-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent2);
      box-shadow: 0 12px 40px rgba(0,0,0,0.25);
    }
    .rank-card .rank-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--tint2);
      border: 1px solid var(--glass-border);
      display: grid;
      place-items: center;
      color: var(--accent3);
      font-size: 20px;
      margin-bottom: 14px;
      transition: transform 0.3s;
    }
    .rank-card:hover .rank-icon { transform: rotate(-6deg) scale(1.08); }
    .rank-card h3 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .rank-card .rank-sub {
      font-size: 12px;
      color: var(--txt3);
      margin-top: 2px;
    }
    .rank-card .rank-meta {
      display: flex;
      gap: 14px;
      margin-top: 14px;
      font-size: 12px;
      color: var(--txt3);
      flex-wrap: wrap;
    }
    .rank-card .rank-meta span { display: flex; align-items: center; gap: 4px; }
    .rank-card .rank-badge {
      position: absolute;
      top: 16px;
      right: 16px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 3px 8px;
      border-radius: 999px;
    }
    .rank-card .rank-badge.active {
      background: var(--okbg);
      color: var(--ok);
      border: 1px solid var(--okbd);
    }
    .rank-card .rank-badge.completed {
      background: var(--warnbg);
      color: var(--warn);
      border: 1px solid rgba(255,179,71,0.3);
    }
    .rank-card .rank-progress {
      height: 3px;
      background: var(--tint2);
      border-radius: 2px;
      margin-top: 12px;
      overflow: hidden;
    }
    .rank-card .rank-progress-fill {
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent3));
      transition: width 0.8s ease;
    }

    /* ─── LEADERBOARD ────────────────────────────────────────────── */
    .lb-container {
      background: var(--tint);
      border-radius: var(--radius-lg);
      border: 1px solid var(--glass-border);
      overflow: hidden;
    }
    .lb-header {
      display: grid;
      grid-template-columns: 50px 1fr 100px 120px 80px;
      padding: 12px 18px;
      background: var(--tint2);
      border-bottom: 1px solid var(--glass-border);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--txt3);
    }
    .lb-row {
      display: grid;
      grid-template-columns: 50px 1fr 100px 120px 80px;
      padding: 10px 18px;
      border-bottom: 1px solid var(--glass-border);
      align-items: center;
      transition: background 0.15s;
      font-size: 13px;
    }
    .lb-row:hover { background: var(--tint2); }
    .lb-row:last-child { border-bottom: none; }
    .lb-rank {
      font-weight: 700;
      font-family: 'Fira Code', monospace;
      color: var(--txt3);
    }
    .lb-rank.gold { color: var(--gold); }
    .lb-rank.silver { color: var(--silver); }
    .lb-rank.bronze { color: var(--bronze); }
    .lb-name {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .lb-name .lb-badge {
      font-size: 9px;
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--tint2);
      color: var(--txt3);
    }
    .lb-name .lb-badge.bot {
      background: var(--tint3);
      color: var(--accent2);
    }
    .lb-elo {
      font-weight: 700;
      font-family: 'Fira Code', monospace;
      color: var(--accent2);
    }
    .lb-stats {
      font-size: 11px;
      color: var(--txt3);
      display: flex;
      gap: 6px;
    }
    .lb-streak {
      font-size: 11px;
      color: var(--warn);
    }
    .lb-filters {
      display: flex;
      gap: 8px;
      padding: 12px 18px;
      background: var(--tint);
      border-bottom: 1px solid var(--glass-border);
      flex-wrap: wrap;
    }
    .lb-filter {
      padding: 4px 14px;
      border-radius: 999px;
      border: 1px solid var(--glass-border);
      background: var(--tint);
      color: var(--txt2);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .lb-filter:hover { border-color: var(--accent2); color: var(--txt1); }
    .lb-filter.active { background: var(--tint3); border-color: var(--accent2); color: var(--txt1); }

    /* ─── MATCH HISTORY ──────────────────────────────────────────── */
    .match-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      background: var(--tint);
      border: 1px solid var(--glass-border);
      margin-bottom: 6px;
      font-size: 13px;
      flex-wrap: wrap;
      gap: 4px;
      animation: card-in 0.3s ease both;
    }
    .match-item .m-result {
      font-weight: 700;
      font-family: 'Fira Code', monospace;
    }
    .match-item .m-result.win { color: var(--ok); }
    .match-item .m-result.loss { color: var(--no); }
    .match-item .m-result.draw { color: var(--warn); }
    .match-item .m-elo {
      font-size: 12px;
      color: var(--txt3);
      font-family: 'Fira Code', monospace;
    }
    .match-item .m-date {
      font-size: 11px;
      color: var(--txt3);
    }
    .match-item .m-streak {
      font-size: 11px;
      color: var(--warn);
    }

    /* ─── TOURNAMENT ─────────────────────────────────────────────── */
    .tournament-bracket {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 20px;
      background: var(--tint);
      border-radius: var(--radius-lg);
      border: 1px solid var(--glass-border);
    }
    .bracket-round {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .bracket-match {
      background: var(--bg2);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      min-width: 160px;
      text-align: center;
    }
    .bracket-match .bm-players {
      font-size: 13px;
      font-weight: 600;
    }
    .bracket-match .bm-result {
      font-size: 11px;
      color: var(--txt3);
      margin-top: 4px;
    }
    .bracket-match .bm-winner {
      color: var(--ok);
      font-weight: 700;
    }
    .bracket-match .bm-bye {
      color: var(--txt3);
      font-style: italic;
    }

    /* ─── PROFILE ────────────────────────────────────────────────── */
    .profile-card {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 24px;
      padding: 28px;
      background: var(--tint);
      border-radius: var(--radius-lg);
      border: 1px solid var(--glass-border);
      align-items: start;
    }
    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: grid;
      place-items: center;
      font-size: 32px;
      color: #fff;
      flex-shrink: 0;
      box-shadow: 0 4px 20px var(--accent-glow);
    }
    .profile-info h2 {
      font-size: 22px;
      font-weight: 800;
    }
    .profile-info .p-elo {
      font-size: 32px;
      font-weight: 900;
      color: var(--accent2);
      font-family: 'Fira Code', monospace;
    }
    .profile-info .p-stats {
      display: flex;
      gap: 20px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .profile-info .p-stat {
      font-size: 13px;
      color: var(--txt3);
    }
    .profile-info .p-stat .num {
      font-weight: 700;
      color: var(--txt2);
    }
    .profile-info .p-rank-badge {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: var(--tint3);
      color: var(--accent2);
      margin-top: 6px;
    }

    /* ─── ACHIEVEMENTS ───────────────────────────────────────────── */
    .achievement-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    .achievement-item {
      padding: 14px;
      border-radius: var(--radius-sm);
      background: var(--tint);
      border: 1px solid var(--glass-border);
      text-align: center;
      transition: all 0.25s;
    }
    .achievement-item.unlocked {
      border-color: var(--okbd);
      background: var(--okbg);
    }
    .achievement-item.locked {
      opacity: 0.5;
    }
    .achievement-item .ach-icon {
      font-size: 28px;
      display: block;
      margin-bottom: 6px;
    }
    .achievement-item .ach-name {
      font-size: 12px;
      font-weight: 700;
    }
    .achievement-item .ach-desc {
      font-size: 10px;
      color: var(--txt3);
      margin-top: 2px;
    }
    .achievement-item .ach-progress {
      height: 3px;
      background: var(--tint2);
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
    }
    .achievement-item .ach-progress-fill {
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent3));
      transition: width 0.8s ease;
    }

    /* ─── EMPTY STATE ────────────────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--txt3);
    }
    .empty-state .ic {
      font-size: 40px;
      opacity: 0.3;
      display: block;
      margin-bottom: 12px;
    }

    /* ─── TOAST ──────────────────────────────────────────────────── */
    .toast {
      position: fixed; bottom: 80px; right: 24px; z-index: 9000;
      padding: 12px 24px; border-radius: 999px;
      background: var(--tint2); backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border2);
      transform: translateX(120%); opacity: 0;
      transition: transform 0.4s cubic-bezier(0.2,0.9,0.4,1.1), opacity 0.3s;
      font-size: 13px; font-weight: 500;
    }
    .toast.show { transform: translateX(0); opacity: 1; }

    /* ─── MODAL ───────────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 3000;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(12px);
      display: none; align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      max-width: 560px;
      width: 100%;
      padding: 32px;
      background: var(--bg2);
      border-radius: var(--radius-lg);
      border: 1px solid var(--glass-border2);
      animation: fade-up 0.3s ease;
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal-box h2 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .modal-box .close-modal {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--txt3);
      font-size: 20px;
      cursor: pointer;
      padding: 4px;
    }
    .modal-box .close-modal:hover { color: var(--txt1); }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ─── RESPONSIVE ─────────────────────────────────────────────── */
    @media (max-width: 700px) {
      .wrap { padding: 0 16px; }
      .page-head h1 { font-size: 24px; }
      .mode-tabs { width: 100%; justify-content: stretch; }
      .mode-tab { flex: 1; justify-content: center; font-size: 12px; padding: 8px 10px; }
      .mode-tab .ic { display: none; }
      .topbar { padding: 10px 14px; gap: 8px; }
      .brand small { display: none; }
      .theme-switcher { gap: 3px; padding: 3px 4px; }
      .theme-dot { width: 12px; height: 12px; }
      .custom-color-wrap { width: 16px; height: 16px; }
      .lb-header { grid-template-columns: 30px 1fr 60px 60px 50px; font-size: 10px; padding: 8px 10px; }
      .lb-row { grid-template-columns: 30px 1fr 60px 60px 50px; font-size: 11px; padding: 8px 10px; }
      .rank-grid { grid-template-columns: 1fr; }
      .profile-card { grid-template-columns: 1fr; text-align: center; }
      .profile-avatar { margin: 0 auto; }
      .profile-info .p-stats { justify-content: center; }
      .bracket-round { flex-direction: column; align-items: center; }
      .achievement-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 450px) {
      .topbar { padding: 8px 10px; }
      .brand { font-size: 15px; }
      .brand-mark { width: 28px; height: 28px; font-size: 12px; }
      .btn-back span { display: none; }
      .lb-header { grid-template-columns: 25px 1fr 50px 50px 40px; font-size: 9px; }
      .lb-row { grid-template-columns: 25px 1fr 50px 50px 40px; font-size: 10px; }
      .achievement-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="crt-overlay" id="crtOverlay"></div>

  <!-- ─── TOP BAR ───────────────────────────────────────────────── -->
  <div class="topbar">
    <a class="brand" href="#">
      <div class="brand-mark"><i class="ic" data-ic="trophy"></i></div>
      EDUMOE <small>· Ranked</small>
    </a>
    <div class="topbar-right">
      <div class="theme-switcher">
        <button class="theme-dot td-ruby active" id="td-ruby" onclick="setTheme('ruby', this)"></button>
        <button class="theme-dot td-lava" id="td-lava" onclick="setTheme('lava', this)"></button>
        <button class="theme-dot td-space" id="td-space" onclick="setTheme('space', this)"></button>
        <button class="theme-dot td-oxford" id="td-oxford" onclick="setTheme('oxford', this)"></button>
        <button class="theme-dot td-gray" id="td-gray" onclick="setTheme('gray', this)"></button>
        <button class="theme-dot td-light" id="td-light" onclick="setTheme('light', this)"></button>
        <div class="custom-color-wrap" id="customColorWrap">
          <input type="color" id="customColorPicker" value="#e11d48" />
        </div>
        <button class="theme-dot td-terminal" id="td-terminal" onclick="setTheme('terminal', this)"></button>
      </div>
      <button class="crt-toggle" id="crtToggle" onclick="toggleCRT()"><i class="ic" data-ic="tv"></i></button>
      <a href="index.html" class="btn-back"><i class="ic" data-ic="arrow-left"></i> <span>Back</span></a>
    </div>
  </div>

  <!-- ─── CONTENT ───────────────────────────────────────────────── -->
  <div class="wrap" id="app">
    <div class="page-head">
      <h1><i class="ic" data-ic="trophy"></i> Ultimate Ranked Arena</h1>
      <p>Compete against 8 unique bots, climb the Elo ladder, and prove your mastery.</p>
      <div class="stats-row" id="statsRow">
        <div class="stat-pill">🏆 <span class="num" id="statElo">1200</span> Elo</div>
        <div class="stat-pill">✅ <span class="num" id="statWins">0</span> wins</div>
        <div class="stat-pill">📊 <span class="num" id="statWR">0%</span> win rate</div>
        <div class="stat-pill">👾 <span class="num" id="statMatches">0</span> matches</div>
        <div class="stat-pill">🔥 <span class="num" id="statStreak">0</span> streak</div>
        <div class="stat-pill">🏅 <span class="num" id="statAchievements">0</span> achievements</div>
      </div>
    </div>

    <div class="mode-tabs" id="modeTabs">
      <button class="mode-tab active" data-mode="profile" onclick="showMode('profile')"><i class="ic" data-ic="user"></i> Profile</button>
      <button class="mode-tab" data-mode="play" onclick="showMode('play')"><i class="ic" data-ic="zap"></i> Play</button>
      <button class="mode-tab" data-mode="gauntlet" onclick="showMode('gauntlet')"><i class="ic" data-ic="fire"></i> Gauntlet</button>
      <button class="mode-tab" data-mode="tournament" onclick="showMode('tournament')"><i class="ic" data-ic="trophy"></i> Tournament</button>
      <button class="mode-tab" data-mode="leaderboard" onclick="showMode('leaderboard')"><i class="ic" data-ic="list"></i> Leaderboard</button>
      <button class="mode-tab" data-mode="history" onclick="showMode('history')"><i class="ic" data-ic="clock"></i> History</button>
      <button class="mode-tab" data-mode="achievements" onclick="showMode('achievements')"><i class="ic" data-ic="medal"></i> Achievements <span class="badge" id="achBadge">0</span></button>
    </div>

    <!-- Profile -->
    <div id="profileMode"><div id="profileContainer"></div></div>

    <!-- Play -->
    <div id="playMode" style="display:none;"><div class="rank-grid" id="playGrid"></div></div>

    <!-- Gauntlet -->
    <div id="gauntletMode" style="display:none;"><div id="gauntletContainer"></div></div>

    <!-- Tournament -->
    <div id="tournamentMode" style="display:none;"><div id="tournamentContainer"></div></div>

    <!-- Leaderboard -->
    <div id="leaderboardMode" style="display:none;">
      <div class="lb-filters" id="lbFilters">
        <button class="lb-filter active" data-period="all" onclick="setLeaderboardPeriod('all', this)">All Time</button>
        <button class="lb-filter" data-period="weekly" onclick="setLeaderboardPeriod('weekly', this)">This Week</button>
        <button class="lb-filter" data-period="monthly" onclick="setLeaderboardPeriod('monthly', this)">This Month</button>
        <button class="lb-filter" data-period="season" onclick="setLeaderboardPeriod('season', this)">Season 1</button>
      </div>
      <div class="lb-container" id="leaderboardContainer"></div>
    </div>

    <!-- History -->
    <div id="historyMode" style="display:none;"><div id="historyContainer"></div></div>

    <!-- Achievements -->
    <div id="achievementsMode" style="display:none;"><div id="achievementsContainer"></div></div>

    <!-- Match / Results -->
    <div id="matchContainer" style="display:none;"></div>
    <div id="resultsContainer" style="display:none;"></div>
  </div>

  <div class="toast" id="toast"><span id="toastMsg"></span></div>

  <div class="modal-overlay" id="tournamentModal">
    <div class="modal-box">
      <h2>🏆 Tournament <button class="close-modal" onclick="closeTournamentModal()">✕</button></h2>
      <div id="tournamentModalContent"></div>
    </div>
  </div>

  <script>
    // ============================================================
    //  ICONS
    // ============================================================
    const ICONS = {
      'trophy': '<path d="M6 4h12v4a6 6 0 0 1-12 0V4z"/><path d="M6 6H3v2a3 3 0 0 0 3 3M18 6h3v2a3 3 0 0 1-3 3"/><line x1="12" y1="14" x2="12" y2="18"/><path d="M8 21h8M9 18h6v3H9z"/>',
      'user': '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/>',
      'zap': '<polygon points="13 2 4 14 11 14 10 22 20 9 13 9 13 2" fill="currentColor" stroke="none"/>',
      'fire': '<path d="M12 2C10 6 6 8 8 12c2 4 0 8 4 10 4-2 2-6 4-10 2-4-2-6-4-10z" fill="currentColor" stroke="none"/>',
      'list': '<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1" fill="currentColor"/><circle cx="3.5" cy="12" r="1" fill="currentColor"/><circle cx="3.5" cy="18" r="1" fill="currentColor"/>',
      'clock': '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/>',
      'medal': '<circle cx="12" cy="12" r="9"/><polyline points="9 10 11 14 15 10"/>',
      'check': '<polyline points="20 6 9 17 4 12"/>',
      'x': '<line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>',
      'arrow-right': '<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>',
      'arrow-left': '<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
      'redo': '<path d="M21 7v6h-6"/><path d="M21 13a9 9 0 1 0-3 7.7L21 18"/>',
      'book': '<path d="M4 4a2 2 0 0 1 2-2h13v18H6a2 2 0 0 0-2 2V4z"/><line x1="8" y1="7" x2="15" y2="7"/>',
      'tv': '<rect x="2" y="5" width="20" height="13" rx="2"/><polyline points="8 21 12 18 16 21"/>',
      'clipboard': '<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12l2 2 4-4"/>',
      'play': '<polygon points="6 4 20 12 6 20 6 4" fill="currentColor" stroke="none"/>',
      'flag': '<path d="M5 21V3h14l-2 5 2 5H7v8"/>',
      'shield': '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
      'star': '<polygon points="12 2 15 9 22 9 16 14 19 21 12 17 5 21 8 14 2 9 9 9 12 2" fill="currentColor" stroke="none"/>',
    };

    function injectIcons(root) {
      (root || document).querySelectorAll('i.ic[data-ic]').forEach(el => {
        if (el.dataset.done) return;
        const p = ICONS[el.dataset.ic];
        if (p) { el.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + p + '</svg>'; el.dataset.done = '1'; }
      });
    }

    // ============================================================
    //  THEME SYSTEM
    // ============================================================
    function clearCustomInlineStyles() {
      const root = document.documentElement;
      ['--custom-accent','--custom-accent2','--custom-accent3','--custom-glow','--custom-glow2','--custom-border','--custom-border2','--custom-tint','--custom-tint2','--custom-tint3'].forEach(v => root.style.removeProperty(v));
      document.querySelectorAll('.theme-dot').forEach(el => { el.style.removeProperty('background'); el.style.removeProperty('box-shadow'); });
      document.getElementById('customColorWrap')?.style.removeProperty('box-shadow');
    }

    function setTheme(theme, el) {
      clearCustomInlineStyles();
      if (theme === 'terminal') {
        document.documentElement.setAttribute('data-theme', 'terminal');
        localStorage.setItem('edumoe-theme', 'terminal');
        localStorage.removeItem('edumoe-custom-color');
        showToast('$ mode --terminal');
        document.querySelectorAll('.theme-dot').forEach(d => d.classList.remove('active'));
        if (el) el.classList.add('active');
        updateCRTButton();
        return;
      }
      if (theme === 'ruby') {
        document.documentElement.removeAttribute('data-theme');
        document.getElementById('customColorPicker').value = '#e11d48';
        document.getElementById('customColorWrap').style.background = '#e11d48';
        localStorage.removeItem('edumoe-custom-color');
        localStorage.setItem('edumoe-theme', 'ruby');
        showToast('Theme: Ruby');
      } else {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('edumoe-theme', theme);
        localStorage.removeItem('edumoe-custom-color');
        const cm = { lava: '#ff5a1f', space: '#7c3aed', oxford: '#00d4ff', gray: '#6b7280', light: '#111111' };
        if (cm[theme]) { document.getElementById('customColorPicker').value = cm[theme]; document.getElementById('customColorWrap').style.background = cm[theme]; }
        showToast('Theme: ' + theme.charAt(0).toUpperCase() + theme.slice(1));
      }
      document.querySelectorAll('.theme-dot').forEach(d => d.classList.remove('active'));
      if (el) el.classList.add('active');

      const expected = expectedScore(winnerElo, loserElo);
      const change = Math.round(K_FACTOR * (1 - expected));
      return { winnerNew: winnerElo + change, loserNew: loserElo - change };
    }

    function getRandomQuestions(count) {
      const shuffled = [...RANKED_QUESTIONS];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled.slice(0, Math.min(count, shuffled.length));
    }

    function botAnswer(question, botId, questionIndex) {
      const bot = BOT_DIFFICULTIES.find(b => b.id === botId);
      if (!bot) return question.correct;
      const variance = (Math.random() - 0.5) * 0.08;
      const effectiveAccuracy = Math.min(0.99, Math.max(0.15, bot.accuracy + variance));
      if (Math.random() < effectiveAccuracy) {
        return question.correct;
      } else {
        let wrongIdx;
        do {
          wrongIdx = Math.floor(Math.random() * question.choices.length);
        } while (wrongIdx === question.correct);
        return wrongIdx;
      }
    }

            ${t > 0 ? `<div class="rank-progress"><div class="rank-progress-fill" style="width:${Math.min(100, wr2)}%"></div></div>` : ''}

              <button class="btn btn-primary btn-sm">⚔️ Battle (5 Qs)</button>
              <button class="btn btn-sm" onclick="event.stopPropagation();startMatch('${b.id}', 10)" style="margin-left:4px;">10 Qs</button>
            </div>
          </div>
        `;
      }).join('');

      grid.innerHTML += `
        <div class="rank-card" style="cursor:default;background:var(--tint2);border-color:var(--glass-border2);">
          <div class="rank-icon" style="background:var(--tint3);"><i class="ic" data-ic="zap"></i></div>
          <h3>Quick Match</h3>
          <div class="rank-sub">Random opponent, 3 questions</div>
          <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">

            <button class="btn btn-sm" onclick="quickMatch('medium')" style="border-color:var(--warn);">Medium</button>
            <button class="btn btn-sm" onclick="quickMatch('hard')" style="border-color:var(--no);">Hard</button>
            <button class="btn btn-sm" onclick="quickMatch('legend')" style="border-color:var(--accent3);">Legend</button>
          </div>
        </div>
      `;
      injectIcons(grid);
    }

    function quickMatch(diff) {
      const difficultyMap = {
        'easy': ['rookie', 'novice', 'adept'],
        'medium': ['adept', 'pro', 'expert'],
        'hard': ['expert', 'master', 'legend'],
        'legend': ['master', 'legend', 'moeai'],
      };
      const pool = difficultyMap[diff] || ['adept', 'pro', 'expert'];
      const botId = pool[Math.floor(Math.random() * pool.length)];
      startMatch(botId, 3);
    }

    // ============================================================
    //  MATCH SYSTEM
    // ============================================================
    function startMatch(botId, questionCount) {
      const bot = BOT_DIFFICULTIES.find(b => b.id === botId);
      if (!bot) { showToast('⚠️ Bot not found'); return; }

      const questions = getRandomQuestions(questionCount || 5);
      if (questions.length < 3) { showToast('⚠️ Not enough questions'); return; }

      matchState = {
        botId: botId,
        botName: bot.name,
        botElo: bot.elo,
        botIcon: bot.icon,
        questions: questions,
        total: questions.length,
        current: 0,
        playerCorrect: 0,
        botCorrect: 0,
        answered: false,
        results: [],
        startTime: Date.now(),
        isTournament: false,
        isGauntlet: false,
        questionTimers: [],
      };

      document.querySelectorAll('#profileMode, #playMode, #gauntletMode, #tournamentMode, #leaderboardMode, #historyMode, #achievementsMode')
        .forEach(el => el.style.display = 'none');
      document.getElementById('matchContainer').style.display = 'block';
      renderMatch();
    }

    function renderMatch() {
      const container = document.getElementById('matchContainer');
      const ms = matchState;
      const q = ms.questions[ms.current];
      const pct = Math.round(ms.current / ms.total * 100);

      container.innerHTML = `
        <div class="runner" style="max-width:760px;margin:0 auto;animation:card-in 0.3s ease;">
          <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap;">
            <span class="q-count" style="font-size:13px;color:var(--txt3);font-weight:600;">Q${ms.current+1}/${ms.total}</span>
            <div style="flex:1;height:6px;border-radius:99px;background:var(--tint2);overflow:hidden;min-width:40px;">
              <div style="height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent3));width:${pct}%;transition:width 0.5s ease;"></div>
            </div>
            <span style="font-size:13px;font-weight:700;font-family:'Fira Code',monospace;color:var(--txt2);">
              ${ms.playerCorrect} ✓ ${ms.botCorrect} 🤖
            </span>
            <span style="font-size:12px;color:var(--txt3);">
              vs ${ms.botIcon} ${ms.botName}
            </span>
          </div>
          <div class="lg lg-card" style="padding:28px;background:var(--bg2);border:1px solid var(--glass-border);">
            <div class="lg-effect"></div><div class="lg-tint"></div><div class="lg-shine"></div>
            <div style="font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent3);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
              <span>${q.diff || 'medium'}</span>
              <span style="opacity:0.5;">·</span>
              <span style="opacity:0.7;">${q.concept || 'General'}</span>
            </div>
            <div style="font-size:19px;font-weight:600;line-height:1.5;margin-bottom:22px;">${q.q}</div>
            <div class="options" id="opts" style="display:flex;flex-direction:column;gap:10px;">
              ${q.choices.map((c, i) => `
                <button class="btn" onclick="matchAnswer(${i})" data-idx="${i}" style="justify-content:flex-start;text-align:left;padding:12px 16px;border:1px solid var(--glass-border);background:var(--tint);">
                  <span style="width:26px;height:26px;border-radius:8px;background:var(--tint2);border:1px solid var(--glass-border);display:grid;place-items:center;font-size:13px;font-weight:700;flex-shrink:0;">${String.fromCharCode(65+i)}</span>
                  <span>${c}</span>
                  <span class="opt-check" style="margin-left:auto;opacity:0;transition:opacity 0.2s;"><i class="ic" data-ic="check"></i></span>
                </button>
              `).join('')}
            </div>
            <div class="feedback" id="fb" style="margin-top:16px;padding:14px 18px;border-radius:12px;display:none;font-size:14px;line-height:1.6;"></div>

              <span style="font-size:11px;color:var(--txt3);"><kbd style="background:var(--tint2);border:1px solid var(--glass-border);border-radius:4px;padding:1px 6px;font-size:10px;">1-4</kbd> select</span>

      const firstOpt = container.querySelector('#opts .btn');
      if (firstOpt && !ms.answered) setTimeout(() => firstOpt.focus(), 100);
    }

    function matchAnswer(playerIdx) {
      if (matchState.answered) return;
      matchState.answered = true;
      const q = matchState.questions[matchState.current];
      const playerCorrect = playerIdx === q.correct;

      const botIdx = botAnswer(q, matchState.botId, matchState.current);
      const botCorrect = botIdx === q.correct;

      if (playerCorrect) matchState.playerCorrect++;
      if (botCorrect) matchState.botCorrect++;

      matchState.results.push({ playerCorrect, botCorrect, playerIdx, botIdx, correct: q.correct });

      const opts = document.querySelectorAll('#opts .btn');
      opts.forEach((o, idx) => {
        o.disabled = true;
        if (idx === q.correct) {
          o.style.borderColor = 'var(--okbd)';
          o.style.background = 'var(--okbg)';
          const check = o.querySelector('.opt-check');
          if (check) { check.style.opacity = '1'; check.style.color = 'var(--ok)'; }
        } else if (idx === playerIdx && !playerCorrect) {
          o.style.borderColor = 'var(--nobd)';
          o.style.background = 'var(--nobg)';
          const check = o.querySelector('.opt-check');
          if (check) { check.style.opacity = '1'; check.style.color = 'var(--no)'; }
        } else if (idx === botIdx && botCorrect && idx !== q.correct) {
          o.style.borderColor = 'var(--warn)';
          o.style.background = 'var(--warnbg)';
        }
      });

      const fb = document.getElementById('fb');
      fb.style.display = 'block';
      fb.className = 'feedback ' + (playerCorrect ? 'right' : 'wrong');
      fb.style.border = playerCorrect ? '1px solid var(--okbd)' : '1px solid var(--nobd)';
      fb.style.background = playerCorrect ? 'var(--okbg)' : 'var(--nobg)';
      fb.innerHTML = `
        <div style="font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:6px;color:${playerCorrect ? 'var(--ok)' : 'var(--no)'};">
          <i class="ic" data-ic="${playerCorrect ? 'check' : 'x'}"></i> ${playerCorrect ? 'Correct!' : 'Not quite'}
        </div>
        <div style="color:var(--txt2);">${q.exp}</div>
        <div style="margin-top:6px;font-size:13px;color:var(--txt3);">
          ${matchState.botIcon} ${matchState.botName} ${botCorrect ? '✅ got it right' : '❌ missed it'}
        </div>
      `;
      injectIcons(fb);

      const last = matchState.current === matchState.total - 1;
      document.getElementById('ract').innerHTML = `
        <button class="btn btn-primary" onclick="matchNext()" id="nextBtn">
          ${last ? 'See results' : 'Next question'}
          <i class="ic" data-ic="arrow-right"></i>
        </button>
      `;
      injectIcons(document.getElementById('ract'));
      document.getElementById('nextBtn')?.focus();
    }

    function matchNext() {
      if (matchState.current < matchState.total - 1) {
        matchState.current++;
        matchState.answered = false;
        renderMatch();
      } else {
        finishMatch();
      }
    }

    function finishMatch() {
      const ms = matchState;
      const playerScore = ms.playerCorrect;
      const botScore = ms.botCorrect;
      const total = ms.total;

      let result;
      if (playerScore > botScore) result = 'win';
      else if (botScore > playerScore) result = 'loss';
      else result = 'draw';

      const bot = BOT_DIFFICULTIES.find(b => b.id === ms.botId);
      const botElo = bot ? bot.elo : 1200;

      let eloChange = 0;
      if (result === 'win') {
        const expected = expectedScore(player.elo, botElo);
        eloChange = Math.round(K_FACTOR * (1 - expected));
        player.elo += eloChange;
        player.wins++;
        player.streak++;
        if (player.streak > player.bestStreak) player.bestStreak = player.streak;
        if (!player.botStats[ms.botId]) player.botStats[ms.botId] = { wins: 0, losses: 0, draws: 0 };
        player.botStats[ms.botId].wins++;
        if (playerScore === total) { player.perfectGames = (player.perfectGames || 0) + 1; }
      } else if (result === 'loss') {
        const expected = expectedScore(player.elo, botElo);
        eloChange = Math.round(K_FACTOR * (expected - 0) || -16);
        player.elo = Math.max(100, player.elo - Math.abs(eloChange));
        player.losses++;
        player.streak = 0;
        if (!player.botStats[ms.botId]) player.botStats[ms.botId] = { wins: 0, losses: 0, draws: 0 };
        player.botStats[ms.botId].losses++;
      } else {
        player.draws++;
        if (!player.botStats[ms.botId]) player.botStats[ms.botId] = { wins: 0, losses: 0, draws: 0 };
        player.botStats[ms.botId].draws++;
        player.streak = 0;
      }

      player.totalQuestions += total;
      player.correctAnswers += playerScore;

      checkAchievements();

      const matchRecord = {
        opponent: ms.botName,
        opponentId: 'bot-' + ms.botId,
        opponentIcon: ms.botIcon,
        result: result,
        playerScore: playerScore,
        opponentScore: botScore,
        total: total,
        eloChange: eloChange,
        newElo: player.elo,
        date: new Date().toISOString(),
        isBot: true,
        accuracy: Math.round(playerScore / total * 100),
      };
      matchHistory.push(matchRecord);
      if (matchHistory.length > 200) matchHistory = matchHistory.slice(-200);

      const entry = ensurePlayerInLeaderboard();
      entry.elo = player.elo;
      entry.wins = player.wins;
      entry.losses = player.losses;
      entry.draws = player.draws;
      entry.matches = player.wins + player.losses + player.draws;
      entry.streak = player.streak;

      saveData();
      const matchResult = { ...matchRecord };
      matchState = null;

      document.getElementById('matchContainer').style.display = 'none';
      document.getElementById('resultsContainer').style.display = 'block';
      renderMatchResults(matchResult, playerScore, botScore, total, result, eloChange);
    }

      const emoji = result === 'win' ? '🎉' : result === 'loss' ? '💪' : '🤝';
      const accuracy = Math.round(pScore / total * 100);

      container.innerHTML = `
        <div class="results" style="max-width:560px;margin:40px auto;text-align:center;animation:card-in 0.5s ease;">
          <div style="font-size:64px;margin-bottom:8px;">${emoji}</div>
          <div class="result-verdict" style="font-size:28px;font-weight:800;color:${passed ? 'var(--ok)' : 'var(--no)'};">
            ${result === 'win' ? 'Victory!' : result === 'loss' ? 'Defeated' : 'Draw'}
          </div>
          <div style="color:var(--txt3);font-size:14px;margin-bottom:8px;">
            ${record.opponentIcon} ${record.opponent} · ${pScore} - ${bScore}
          </div>
          <div style="font-size:13px;color:var(--txt2);margin-bottom:16px;">
            Accuracy: <span style="font-weight:700;color:${accuracy >= 80 ? 'var(--ok)' : 'var(--warn)'};">${accuracy}%</span>
            ${accuracy === 100 ? ' 💯 Perfect!' : ''}
          </div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:400px;margin:0 auto 20px;">
            <div style="padding:12px;background:var(--tint);border-radius:8px;border:1px solid var(--glass-border);">
              <div style="font-size:20px;font-weight:800;color:var(--accent2);">${pScore}</div>
              <div style="font-size:10px;color:var(--txt3);">You</div>
            </div>
            <div style="padding:12px;background:var(--tint);border-radius:8px;border:1px solid var(--glass-border);">
              <div style="font-size:20px;font-weight:800;color:var(--txt3);">${bScore}</div>
              <div style="font-size:10px;color:var(--txt3);">${record.opponent}</div>
            </div>
            <div style="padding:12px;background:var(--tint);border-radius:8px;border:1px solid var(--glass-border);">
              <div style="font-size:20px;font-weight:800;color:${eloColor};">${eloChange > 0 ? '+' : ''}${eloChange}</div>
              <div style="font-size:10px;color:var(--txt3);">Elo</div>
            </div>
          </div>
          <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
            <button class="btn btn-primary" onclick="closeMatchResults()"><i class="ic" data-ic="redo"></i> Back</button>
            <button class="btn" onclick="rematch()"><i class="ic" data-ic="zap"></i> Rematch</button>
          </div>
          ${result === 'win' ? `<div style="margin-top:12px;padding:8px 14px;border-radius:999px;background:var(--okbg);border:1px solid var(--okbd);font-size:12px;color:var(--ok);display:inline-block;">🏅 +${Math.floor(eloChange)} Elo</div>` : ''}
        </div>
      `;
      injectIcons(container);
      updateStats();
    }

    function closeMatchResults() {
      document.getElementById('resultsContainer').style.display = 'none';
      showMode(currentMode);
      if (currentMode === 'play') renderPlay();
      else if (currentMode === 'gauntlet') renderGauntlet();
    }

    function rematch() {
      if (matchState) {
        const botId = matchState.botId;
        const count = matchState.total;
        document.getElementById('resultsContainer').style.display = 'none';
        startMatch(botId, count);
      } else {
        closeMatchResults();
      }
    }

    function cancelMatch() {
      matchState = null;
      document.getElementById('matchContainer').style.display = 'none';
      showMode(currentMode);
      if (currentMode === 'play') renderPlay();
      else if (currentMode === 'gauntlet') renderGauntlet();
      showToast('Match cancelled');
    }

    // ============================================================
    //  GAUNTLET
    // ============================================================
    function renderGauntlet() {
      const container = document.getElementById('gauntletContainer');
      if (!container) return;
      const completed = gauntletState ? gauntletState.completed : [];
      const currentIndex = gauntletState ? gauntletState.currentIndex : 0;

      let html = `
        <div style="background:var(--tint);border-radius:var(--radius-lg);border:1px solid var(--glass-border);padding:24px;margin-bottom:16px;">
          <h3 style="font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px;">
            <i class="ic" data-ic="fire"></i> The Gauntlet
          </h3>
          <p style="color:var(--txt3);font-size:13px;">Fight all 8 bots in order. Win streak bonuses apply. Complete it to unlock the Gauntlet achievement.</p>
          <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
            ${gauntletState && gauntletState.inProgress ? `
              <button class="btn btn-primary" onclick="gauntletNext()">Continue Gauntlet</button>
              <button class="btn" onclick="gauntletReset()">Reset</button>
            ` : `
              <button class="btn btn-primary" onclick="startGauntlet()">Start Gauntlet</button>
            `}
          </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;">
          ${BOT_DIFFICULTIES.map((b, i) => {
            const done = completed.includes(b.id);
            const isCurrent = gauntletState && gauntletState.inProgress && i === currentIndex && !done;
            const color = done ? 'var(--ok)' : isCurrent ? 'var(--accent2)' : 'var(--txt3)';
            return `
              <div style="padding:14px;border-radius:var(--radius-sm);background:${done ? 'var(--okbg)' : isCurrent ? 'var(--tint3)' : 'var(--tint)'};border:1px solid ${color};text-align:center;transition:all 0.3s;">
                <div style="font-size:28px;">${b.icon}</div>
                <div style="font-size:13px;font-weight:600;margin-top:4px;">${b.name}</div>
                <div style="font-size:10px;color:var(--txt3);">${done ? '✅ Complete' : isCurrent ? '⚔️ Current' : '⏳ Pending'}</div>
                ${done ? `<div style="font-size:10px;color:var(--ok);margin-top:2px;">🏆 ${gauntletState?.scores?.[b.id] || '0'}%</div>` : ''}
              </div>
            `;
          }).join('')}
        </div>
      `;
      container.innerHTML = html;
      injectIcons(container);
    }

    function startGauntlet() {
      gauntletState = {
        inProgress: true,
        currentIndex: 0,
        completed: [],
        scores: {},
        streak: 0,
        totalBonus: 0,
      };
      gauntletNext();
    }

    function gauntletNext() {
      if (!gauntletState) return;
      const nextBot = BOT_DIFFICULTIES[gauntletState.currentIndex];
      if (!nextBot) {
        player.gauntletComplete = true;
        checkAchievements();
        saveData();
        showToast('🏆 Gauntlet complete! You\'ve defeated all 8 bots!');
        gauntletState.inProgress = false;
        renderGauntlet();
        return;
      }
      showToast(`⚔️ Gauntlet: ${nextBot.name} (${gauntletState.currentIndex + 1}/8)`);
      startMatch(nextBot.id, 5);
      // Override match finish for gauntlet progression
      const originalFinish = finishMatch;
      finishMatch = function() {
        const ms = matchState;
        const playerScore = ms.playerCorrect;
        const botScore = ms.botCorrect;
        const total = ms.total;
        const result = playerScore > botScore ? 'win' : playerScore < botScore ? 'loss' : 'draw';

        if (result === 'win') {
          gauntletState.completed.push(ms.botId);
          gauntletState.scores[ms.botId] = Math.round(playerScore / total * 100);
          gauntletState.streak++;
          gauntletState.totalBonus += gauntletState.streak * 5;
          const bonus = 5 + gauntletState.streak * 2;
          player.elo += bonus;
          showToast(`🔥 Streak ${gauntletState.streak}! +${bonus} Elo bonus`);
        } else {
          gauntletState.streak = 0;
        }

        const bot = BOT_DIFFICULTIES.find(b => b.id === ms.botId);
        const botElo = bot ? bot.elo : 1200;
        let eloChange = 0;
        if (result === 'win') {
          const expected = expectedScore(player.elo, botElo);
          eloChange = Math.round(K_FACTOR * (1 - expected));
          player.elo += eloChange - (5 + gauntletState.streak * 2);
          player.wins++;
          if (player.streak > player.bestStreak) player.bestStreak = player.streak;
        } else if (result === 'loss') {
          const expected = expectedScore(player.elo, botElo);
          eloChange = Math.round(K_FACTOR * (expected - 0) || -16);
          player.elo = Math.max(100, player.elo - Math.abs(eloChange));
          player.losses++;
        } else {
          player.draws++;
        }
        player.totalQuestions += total;
        player.correctAnswers += playerScore;

        const matchRecord = {
          opponent: ms.botName,
          opponentId: 'bot-' + ms.botId,
          opponentIcon: ms.botIcon,
          result: result,
          playerScore: playerScore,
          opponentScore: botScore,
          total: total,
          eloChange: eloChange,
          newElo: player.elo,
          date: new Date().toISOString(),
          isBot: true,
          isGauntlet: true,
          accuracy: Math.round(playerScore / total * 100),
        };
        matchHistory.push(matchRecord);
        if (matchHistory.length > 200) matchHistory = matchHistory.slice(-200);

        const entry = ensurePlayerInLeaderboard();
        entry.elo = player.elo;
        entry.wins = player.wins;
        entry.losses = player.losses;
        entry.draws = player.draws;
        entry.matches = player.wins + player.losses + player.draws;
        entry.streak = player.streak;

        saveData();
        checkAchievements();
        matchState = null;

        gauntletState.currentIndex++;

        document.getElementById('matchContainer').style.display = 'none';
        document.getElementById('resultsContainer').style.display = 'block';
        renderMatchResults(matchRecord, playerScore, botScore, total, result, eloChange);

        const originalClose = closeMatchResults;
        closeMatchResults = function() {
          document.getElementById('resultsContainer').style.display = 'none';
          if (gauntletState && gauntletState.inProgress) {
            gauntletNext();
          } else {
            showMode('gauntlet');
            renderGauntlet();
          }
          closeMatchResults = originalClose;
        };
      };
    }

    function gauntletReset() {
      gauntletState = null;
      renderGauntlet();
    }
