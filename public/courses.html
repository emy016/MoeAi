<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>EDUMOE · Courses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* =============================================================
       EDUMOE V2 – ULTIMATE COURSES (IMPROVED)
       More features, real notes, search, continue learning, stats
       ============================================================= */

    /* ─── THEMES ──────────────────────────────────────────────────── */
    :root {
      --bg1: #0a0a0f;
      --bg2: #111118;
      --bg3: #1a1a2a;
      --accent: #e11d48;
      --accent2: #f43f5e;
      --accent3: #fb7185;
      --accent-glow: rgba(225, 29, 72, 0.35);
      --glow: rgba(225, 29, 72, 0.28);
      --glow2: rgba(225, 29, 72, 0.12);
      --glass-border: rgba(225, 29, 72, 0.18);
      --glass-border2: rgba(225, 29, 72, 0.32);
      --txt1: #fff0f5;
      --txt2: rgba(255, 192, 208, 0.75);
      --txt3: rgba(192, 128, 144, 0.50);
      --tint: rgba(225, 29, 72, 0.05);
      --tint2: rgba(225, 29, 72, 0.10);
      --tint3: rgba(225, 29, 72, 0.18);
      --c-glass: #c8a0a8;
      --c-light: #ffe0e8;
      --c-dark: #300010;
      --reflex-l: 0.45;
      --reflex-d: 1.7;
      --sat: 190%;
      --glass-blur: 14px;
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-xl: 32px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      --transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      --ok: #4fff8f;
      --okbg: rgba(79, 255, 143, 0.12);
      --okbd: rgba(79, 255, 143, 0.35);
    }

    [data-theme="lava"] { --bg1: #0c0c0e; --bg2: #161618; --bg3: #202024; --accent: #ff5a1f; --accent2: #ff8c42; --accent3: #ffb347; --accent-glow: rgba(255,90,31,0.35); --glow: rgba(255,90,31,0.28); --glow2: rgba(255,90,31,0.12); --glass-border: rgba(255,90,31,0.18); --glass-border2: rgba(255,90,31,0.32); --txt1: #fff; --txt2: rgba(255,255,255,0.70); --txt3: rgba(255,255,255,0.40); --tint: rgba(255,255,255,0.05); --tint2: rgba(255,255,255,0.10); --tint3: rgba(255,255,255,0.18); --c-glass: #c8c8c9; --c-light: #fff; --c-dark: #000; --reflex-l:0.35; --reflex-d:1.8; --sat:180%; }
    [data-theme="space"] { --bg1: #000; --bg2: #0a0a14; --bg3: #141428; --accent: #7c3aed; --accent2: #a855f7; --accent3: #c084fc; --accent-glow: rgba(124,58,237,0.35); --glow: rgba(124,58,237,0.28); --glow2: rgba(124,58,237,0.12); --glass-border: rgba(124,58,237,0.18); --glass-border2: rgba(124,58,237,0.32); --txt1: #f0e8ff; --txt2: #c8b0ff; --txt3: #a080e0; --tint: rgba(124,58,237,0.05); --tint2: rgba(124,58,237,0.10); --tint3: rgba(124,58,237,0.18); --c-glass: #b0a0d0; --c-light: #e8d8ff; --c-dark: #1a0030; --reflex-l:0.50; --reflex-d:1.6; --sat:200%; }
    [data-theme="oxford"] { --bg1: #000510; --bg2: #020a18; --bg3: #081530; --accent: #00d4ff; --accent2: #00f0ff; --accent3: #80f8ff; --accent-glow: rgba(0,212,255,0.35); --glow: rgba(0,212,255,0.28); --glow2: rgba(0,212,255,0.12); --glass-border: rgba(0,212,255,0.18); --glass-border2: rgba(0,212,255,0.32); --txt1: #e0fcff; --txt2: #80d8f0; --txt3: #40b0d0; --tint: rgba(0,212,255,0.05); --tint2: rgba(0,212,255,0.10); --tint3: rgba(0,212,255,0.18); --c-glass: #80e8f8; --c-light: #e0fcff; --c-dark: #000810; --reflex-l:0.55; --reflex-d:1.5; --sat:200%; }
    [data-theme="gray"] { --bg1: #0f0f12; --bg2: #18181b; --bg3: #22222a; --accent: #6b7280; --accent2: #9ca3af; --accent3: #d1d5db; --accent-glow: rgba(107,114,128,0.35); --glow: rgba(107,114,128,0.28); --glow2: rgba(107,114,128,0.12); --glass-border: rgba(107,114,128,0.18); --glass-border2: rgba(107,114,128,0.32); --txt1: #f3f4f6; --txt2: #9ca3af; --txt3: #6b7280; --tint: rgba(107,114,128,0.05); --tint2: rgba(107,114,128,0.10); --tint3: rgba(107,114,128,0.18); --c-glass: #c8c8c9; --c-light: #fff; --c-dark: #000; --reflex-l:0.35; --reflex-d:1.8; --sat:120%; }
    [data-theme="light"] { --bg1: #fff; --bg2: #f4f4f6; --bg3: #e8e8ec; --accent: #111; --accent2: #333; --accent3: #555; --accent-glow: rgba(0,0,0,0.12); --glow: rgba(0,0,0,0.12); --glow2: rgba(0,0,0,0.06); --glass-border: rgba(0,0,0,0.10); --glass-border2: rgba(0,0,0,0.20); --txt1: #1a1a1a; --txt2: #555; --txt3: #888; --tint: rgba(0,0,0,0.03); --tint2: rgba(0,0,0,0.06); --tint3: rgba(0,0,0,0.12); --c-glass: #000; --c-light: #fff; --c-dark: #000; --reflex-l:0.06; --reflex-d:0.6; --sat:100%; }
    [data-theme="custom"] { --bg1: #0a0a0f; --bg2: #111118; --bg3: #1a1a2a; --accent: var(--custom-accent,#e11d48); --accent2: var(--custom-accent2,#f43f5e); --accent3: var(--custom-accent3,#fb7185); --accent-glow: var(--custom-glow,rgba(225,29,72,0.35)); --glow: var(--custom-glow,rgba(225,29,72,0.28)); --glow2: var(--custom-glow2,rgba(225,29,72,0.12)); --glass-border: var(--custom-border,rgba(225,29,72,0.18)); --glass-border2: var(--custom-border2,rgba(225,29,72,0.32)); --txt1:#fff0f5; --txt2:#ffc0d0; --txt3:#c08090; --tint: var(--custom-tint,rgba(225,29,72,0.05)); --tint2: var(--custom-tint2,rgba(225,29,72,0.10)); --tint3: var(--custom-tint3,rgba(225,29,72,0.18)); --c-glass:#c8a0a8; --c-light:#ffe0e8; --c-dark:#300010; --reflex-l:0.45; --reflex-d:1.7; --sat:190%; }

    [data-theme="terminal"] {
      --bg1: #050a05; --bg2: #071007; --bg3: #0a180a; --accent: #4fff8f; --accent2: #6effa0; --accent3: #9dffc0;
      --accent-glow: rgba(79,255,143,0.35); --glow: rgba(79,255,143,0.28); --glow2: rgba(79,255,143,0.10);
      --glass-border: rgba(79,255,143,0.18); --glass-border2: rgba(79,255,143,0.32);
      --txt1: #b8ffcf; --txt2: #4fff8f; --txt3: #2f8f57;
      --tint: rgba(79,255,143,0.04); --tint2: rgba(79,255,143,0.08); --tint3: rgba(79,255,143,0.14);
      --c-glass: #4fff8f; --c-light: #b8ffcf; --c-dark: #001a08; --reflex-l:0.20; --reflex-d:1.2; --sat:130%; --glass-blur:8px; --shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    [data-theme="terminal"] body,
    [data-theme="terminal"] .brand,
    [data-theme="terminal"] .unit-title,
    [data-theme="terminal"] .lecture-item,
    [data-theme="terminal"] .course-card h3 {
      font-family: 'Fira Code', monospace !important;
      letter-spacing: 0 !important;
    }
    [data-theme="terminal"] .brand-mark { background: var(--accent) !important; color: #000 !important; }
    [data-theme="terminal"] .btn-primary { background: var(--accent) !important; color: #000 !important; }

    .crt-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9998;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.10) 0px, rgba(0,0,0,0.10) 1px, transparent 1px, transparent 3px);
      mix-blend-mode: multiply;
    }
    [data-theme="terminal"] .crt-overlay { display: block; }
    [data-theme="terminal"]:not(.no-crt) body { animation: crt-flicker 4s infinite; }
    @keyframes crt-flicker { 0%,95%,100%{opacity:1} 96%{opacity:0.94} 98%{opacity:0.98} }
    html.no-crt .crt-overlay { display: none !important; }
    html.no-crt [data-theme="terminal"] body { animation: none !important; }
    @media (prefers-reduced-motion: reduce) { [data-theme="terminal"] body { animation: none !important; } .crt-overlay { background: none; } }

    /* ─── BASE ───────────────────────────────────────────────────── */
    *,
    *::before,
    *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg1);
      color: var(--txt1);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.5s ease, color 0.4s ease;
      padding-bottom: 72px;
    }

    .ic {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1em;
      height: 1em;
      vertical-align: -0.125em;
    }
    .ic svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .ic.fill svg { fill: currentColor; stroke: none; }

    .lg {
      position: relative;
      isolation: isolate;
    }
    .lg-effect {
      position: absolute;
      inset: 0;
      z-index: 0;
      border-radius: inherit;
      backdrop-filter: blur(var(--glass-blur, 14px)) saturate(var(--sat));
      -webkit-backdrop-filter: blur(var(--glass-blur, 14px)) saturate(var(--sat));
      overflow: hidden;
    }
    .lg-tint {
      position: absolute;
      inset: 0;
      z-index: 1;
      border-radius: inherit;
      background: var(--tint);
      transition: background 0.4s ease;
    }
    .lg-shine {
      position: absolute;
      inset: 0;
      z-index: 2;
      border-radius: inherit;
      overflow: hidden;
      box-shadow:
        inset 2px 3px 0px -1.5px color-mix(in srgb, var(--c-light) calc(var(--reflex-l)*90%), transparent),
        inset 0 0 0 1px color-mix(in srgb, var(--c-light) calc(var(--reflex-l)*12%), transparent),
        inset -2px -2px 0px -1px color-mix(in srgb, var(--c-light) calc(var(--reflex-l)*70%), transparent),
        inset -2px -7px 1px -5px color-mix(in srgb, var(--c-light) calc(var(--reflex-l)*55%), transparent),
        inset 0 -1px 4px 0px color-mix(in srgb, var(--c-dark) calc(var(--reflex-d)*10%), transparent),
        inset -1.5px 2.5px 0px -2px color-mix(in srgb, var(--c-dark) calc(var(--reflex-d)*18%), transparent),
        inset 0px 3px 5px -2px color-mix(in srgb, var(--c-dark) calc(var(--reflex-d)*16%), transparent),
        inset 2px -6px 1px -4px color-mix(in srgb, var(--c-dark) calc(var(--reflex-d)*8%), transparent),
        0px 1px 6px 0px color-mix(in srgb, var(--c-dark) calc(var(--reflex-d)*10%), transparent),
        0px 8px 20px 0px color-mix(in srgb, var(--c-dark) calc(var(--reflex-d)*8%), transparent),
        0px 0px 40px -10px var(--glow2);
    }
    .lg > *:not(.lg-effect):not(.lg-tint):not(.lg-shine) { position: relative; z-index: 3; }
    .lg-pill { border-radius: 999px; }
    .lg-card { border-radius: var(--radius-lg); }
    .lg-panel { border-radius: var(--radius-xl); }

    /* ─── TOP BAR ────────────────────────────────────────────────── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 22px;
      border-bottom: 1px solid var(--glass-border);
      background: var(--bg2);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: -0.03em;
      text-decoration: none;
      color: var(--txt1);
      font-size: 18px;
    }
    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 14px;
      box-shadow: 0 4px 12px var(--accent-glow);
    }
    .brand small { color: var(--txt3); font-weight: 500; font-size: 12px; }
    .topbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .theme-switcher {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 6px;
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      background: var(--tint);
      flex-wrap: wrap;
    }
    .theme-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      flex-shrink: 0;
    }
    .theme-dot:hover { transform: scale(1.25); }
    .theme-dot.active { border-color: var(--txt1); transform: scale(1.1); }
    .td-ruby { background: #e11d48; }
    .td-lava { background: #ff5a1f; }
    .td-space { background: #7c3aed; }
    .td-oxford { background: #00d4ff; }
    .td-gray { background: #6b7280; }
    .td-light { background: #ddd; border: 1px solid #aaa; }
    .td-terminal { background: #4fff8f; box-shadow: 0 0 8px rgba(79,255,143,0.6); }
    .custom-color-wrap {
      position: relative;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--glass-border);
      cursor: pointer;
      flex-shrink: 0;
      background: var(--accent);
    }
    .custom-color-wrap input[type="color"] {
      position: absolute;
      top: -4px;
      left: -4px;
      width: calc(100% + 8px);
      height: calc(100% + 8px);
      border: none;
      padding: 0;
      cursor: pointer;
      background: none;
    }
    .custom-color-wrap input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    .custom-color-wrap input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }
    .crt-toggle {
      display: none;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 1px solid var(--glass-border);
      background: var(--tint2);
      color: var(--txt2);
      cursor: pointer;
      font-size: 12px;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .crt-toggle:hover { color: var(--txt1); border-color: var(--accent2); }
    [data-theme="terminal"] .crt-toggle { display: inline-flex; }
    .crt-toggle.off { opacity: 0.4; }
    .btn-back {
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid var(--glass-border);
      background: var(--tint);
      color: var(--txt2);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-back:hover { background: var(--tint2); color: var(--txt1); border-color: var(--accent2); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--glass-border);
      background: var(--tint);
      color: var(--txt1);
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      transition: all 0.16s;
    }
    .btn:hover { border-color: var(--accent2); background: var(--tint2); transform: translateY(-1px); }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      color: #fff;
      box-shadow: 0 4px 14px var(--accent-glow);
    }
    .btn-primary:hover { box-shadow: 0 6px 24px var(--accent-glow); transform: translateY(-2px); }
    .btn-sm { padding: 6px 12px; font-size: 12px; }

    /* ─── LAYOUT ─────────────────────────────────────────────────── */
    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

    /* ─── HERO SECTION (new) ────────────────────────────────────── */
    .courses-hero {
      padding: 40px 0 20px;
      text-align: center;
    }
    .courses-hero h1 {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: -0.03em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .courses-hero h1 .ic { color: var(--accent2); }
    .courses-hero p { color: var(--txt3); font-size: 15px; margin-top: 6px; }
    .courses-stats {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin: 20px 0 24px;
      flex-wrap: wrap;
    }
    .courses-stats .stat-item {
      text-align: center;
    }
    .courses-stats .stat-item .num {
      font-size: 28px;
      font-weight: 800;
      color: var(--accent2);
      font-family: 'Fira Code', monospace;
    }
    .courses-stats .stat-item .lbl {
      font-size: 12px;
      color: var(--txt3);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .search-wrap {
      max-width: 420px;
      margin: 0 auto 20px;
      position: relative;
    }
    .search-wrap input {
      width: 100%;
      padding: 12px 18px 12px 44px;
      border-radius: 999px;
      border: 1px solid var(--glass-border);
      background: var(--tint);
      color: var(--txt1);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    .search-wrap input:focus { border-color: var(--accent2); box-shadow: 0 0 0 3px var(--tint3); }
    .search-wrap input::placeholder { color: var(--txt3); }
    .search-wrap .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--txt3);
      font-size: 16px;
    }

    /* ─── CONTINUE LEARNING (new) ───────────────────────────────── */
    .continue-section {
      background: var(--tint2);
      border-radius: var(--radius-md);
      border: 1px solid var(--glass-border);
      padding: 16px 20px;
      margin: 0 0 24px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      transition: all 0.3s;
    }
    .continue-section.hidden { display: none; }
    .continue-section .left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .continue-section .left .label {
      font-size: 13px;
      color: var(--txt3);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .continue-section .left .course-name {
      font-weight: 700;
      color: var(--accent2);
    }
    .continue-section .left .lec-name {
      color: var(--txt2);
      font-size: 13px;
    }
    .continue-section .btn { flex-shrink: 0; }

    /* ─── COURSE GRID ───────────────────────────────────────────── */
    .course-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
    }
    .course-card {
      position: relative;
      padding: 22px;
      border-radius: var(--radius-md);
      background: var(--tint);
      border: 1px solid var(--glass-border);
      cursor: pointer;
      transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
      overflow: hidden;
      animation: card-in 0.4s ease both;
    }
    .course-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent3));
      opacity: 0.7;
    }
    .course-card:hover { transform: translateY(-4px); border-color: var(--accent2); box-shadow: 0 12px 40px rgba(0,0,0,0.25); }
    .course-card .card-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--tint2);
      border: 1px solid var(--glass-border);
      display: grid;
      place-items: center;
      color: var(--accent3);
      font-size: 20px;
      margin-bottom: 14px;
      transition: transform 0.3s;
    }
    .course-card:hover .card-icon { transform: rotate(-6deg) scale(1.08); }
    .course-card h3 { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
    .course-card .sub { font-size: 12px; color: var(--txt3); margin-top: 2px; }
    .course-card .meta {
      display: flex;
      gap: 14px;
      margin-top: 14px;
      font-size: 12px;
      color: var(--txt3);
      flex-wrap: wrap;
    }
    .course-card .meta span { display: flex; align-items: center; gap: 4px; }
    .course-card .progress-badge {
      position: absolute;
      top: 16px;
      right: 16px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 3px 8px;
      border-radius: 999px;
    }
    .course-card .progress-badge.complete { background: var(--okbg); color: var(--ok); border: 1px solid var(--okbd); }
    .course-card .progress-badge.started { background: var(--tint3); color: var(--accent2); border: 1px solid var(--glass-border2); }
    .course-card .prog-bar {
      height: 4px;
      background: var(--tint2);
      border-radius: 2px;
      margin-top: 12px;
      overflow: hidden;
    }
    .course-card .prog-bar-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--accent), var(--accent3)); transition: width 0.6s ease; }

    @keyframes card-in { from { opacity: 0; transform: translateY(16px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--txt3);
    }
    .no-results .ic { font-size: 40px; opacity: 0.3; display: block; margin-bottom: 12px; }

    /* ─── DETAIL VIEW ───────────────────────────────────────────── */
    .detail-view {
      display: none;
      flex-direction: column;
      min-height: 60vh;
    }
    .detail-view.active { display: flex; }

    .detail-top {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .detail-top h2 { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; }
    .detail-top .sub { color: var(--txt3); font-size: 14px; }

    .detail-layout {
      display: flex;
      gap: 20px;
      flex: 1;
      min-height: 400px;
    }

    /* ─── SIDEBAR (glassier) ────────────────────────────────────── */
    .sidebar {
      width: 320px;
      flex-shrink: 0;
      background: var(--bg2);
      border-radius: var(--radius-md);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      overflow-y: auto;
      max-height: 600px;
      position: sticky;
      top: 100px;
    }
    .sidebar-head {
      padding: 16px 18px;
      border-bottom: 1px solid var(--glass-border);
      background: var(--tint);
      border-radius: var(--radius-md) var(--radius-md) 0 0;
    }
    .sidebar-head h4 { font-size: 14px; font-weight: 700; }
    .sidebar-head .meta { font-size: 12px; color: var(--txt3); margin-top: 4px; }
    .sidebar-head .prog-bar { height: 5px; background: var(--tint2); border-radius: 3px; overflow: hidden; margin-top: 10px; }
    .sidebar-head .prog-bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--accent3)); width: 0%; transition: width 0.4s; }
    .sidebar-head .prog-label { font-size: 11px; color: var(--txt3); margin-top: 4px; display: flex; justify-content: space-between; }

    .unit-list { padding: 4px 0; }
    .unit-item {
      border-bottom: 1px solid var(--glass-border);
    }
    .unit-item:last-child { border-bottom: none; }
    .unit-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }
    .unit-head:hover { background: var(--tint); }
    .unit-head .chev { margin-left: auto; transition: transform 0.2s; color: var(--txt3); font-size: 12px; }
    .unit-item.open .chev { transform: rotate(90deg); }
    .unit-num {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: var(--tint2);
      border: 1px solid var(--glass-border);
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent3);
      flex-shrink: 0;
    }
    .unit-title { font-size: 13px; font-weight: 600; line-height: 1.3; }
    .unit-lectures {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }
    .unit-item.open .unit-lectures { max-height: 600px; }
    .lecture-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px 8px 32px;
      cursor: pointer;
      font-size: 13px;
      color: var(--txt2);
      transition: background 0.12s;
      border-left: 2px solid transparent;
    }
    .lecture-item:hover { background: var(--tint); }
    .lecture-item.active { background: var(--tint2); border-left-color: var(--accent2); color: var(--txt1); font-weight: 600; }
    .lec-check {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid var(--glass-border2);
      flex-shrink: 0;
      display: grid;
      place-items: center;
      font-size: 9px;
      color: transparent;
      transition: all 0.15s;
    }
    .lecture-item.done .lec-check { background: var(--ok); border-color: var(--ok); color: #04140a; }
    .lec-title { flex: 1; line-height: 1.3; }
    .lec-dur { font-size: 11px; color: var(--txt3); font-family: 'Fira Code', monospace; }

    /* ─── MAIN CONTENT ──────────────────────────────────────────── */
    .main-content {
      flex: 1;
      min-width: 0;
      padding: 0 4px;
    }
    .lec-header { margin-bottom: 20px; }
    .lec-eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--accent3); font-weight: 700; }
    .lec-header h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; margin: 4px 0 2px; line-height: 1.2; }
    .lec-header .sub { font-size: 13px; color: var(--txt3); }

    .video-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #000;
      border: 1px solid var(--glass-border);
      margin-bottom: 8px;
    }
    .video-wrap iframe { width: 100%; height: 100%; border: none; }
    .video-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, var(--bg2), var(--bg3));
      cursor: pointer;
    }
    .video-placeholder .play-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--accent);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 20px;
      box-shadow: 0 8px 30px -6px var(--accent-glow);
      transition: transform 0.2s;
    }
    .video-placeholder:hover .play-btn { transform: scale(1.08); }
    .video-placeholder .vp-note { font-size: 13px; color: var(--txt3); }

    .ai-strip {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      background: var(--tint);
      border: 1px solid var(--glass-border);
      margin: 14px 0 24px;
    }
    .ai-avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: grid;
      place-items: center;
      color: #fff;
      flex-shrink: 0;
    }
    .ai-strip .ai-text { flex: 1; font-size: 13px; color: var(--txt2); line-height: 1.4; }
    .ai-strip .ai-text b { color: var(--txt1); }

    .notes {
      font-size: 15px;
      line-height: 1.75;
      color: var(--txt2);
    }
    .notes h3 { font-size: 18px; font-weight: 700; color: var(--txt1); margin: 24px 0 10px; letter-spacing: -0.01em; }
    .notes p { margin: 12px 0; }
    .notes code { font-family: 'Fira Code', monospace; font-size: 13.5px; background: var(--tint2); padding: 2px 7px; border-radius: 5px; color: var(--txt1); }
    .notes pre {
      background: var(--bg2);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      padding: 16px 18px;
      overflow-x: auto;
      margin: 16px 0;
      font-family: 'Fira Code', monospace;
      font-size: 13.5px;
      line-height: 1.6;
      color: #abb2bf;
    }
    .notes pre .kw { color: var(--accent3); }
    .notes pre .st { color: var(--ok); }
    .notes pre .cm { color: var(--txt3); }
    .notes ul { margin: 12px 0 12px 22px; }
    .notes li { margin: 6px 0; }
    .callout {
      padding: 14px 18px;
      border-radius: var(--radius-sm);
      background: rgba(255, 180, 80, 0.08);
      border: 1px solid rgba(255, 180, 80, 0.25);
      margin: 18px 0;
      font-size: 14px;
      color: #ffd9a0;
    }
    .callout b { color: #ffe8c4; }

    .lec-nav {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px solid var(--glass-border);
    }
    .lec-nav button { flex: 1; max-width: 200px; }
    .lec-nav .nav-prev { text-align: left; }
    .lec-nav .nav-next { text-align: right; margin-left: auto; }
    .mark-done-btn { width: 100%; margin-top: 24px; padding: 14px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; }

    /* ─── MOBILE ─────────────────────────────────────────────────── */
    .sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 49; }
    .menu-toggle { display: none; }

    @media (max-width: 860px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 50;
        transform: translateX(-100%);
        transition: transform 0.25s;
        border-radius: 0;
        max-height: 100vh;
        width: 300px;
        box-shadow: 0 0 40px rgba(0,0,0,0.5);
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-backdrop.show { display: block; }
      .menu-toggle { display: inline-flex; }
      .detail-layout { flex-direction: column; }
      .main-content { padding: 0; }
      .lec-nav button { max-width: 100%; }
      .course-grid { grid-template-columns: 1fr; }
      .courses-stats { gap: 20px; }
    }
    @media (max-width: 450px) {
      .topbar { padding: 8px 10px; }
      .brand { font-size: 15px; }
      .brand-mark { width: 28px; height: 28px; font-size: 12px; }
      .btn-back span { display: none; }
      .theme-switcher { gap: 2px; padding: 2px 3px; }
      .theme-dot { width: 10px; height: 10px; }
      .custom-color-wrap { width: 14px; height: 14px; }
      .courses-hero h1 { font-size: 26px; }
      .detail-top h2 { font-size: 20px; }
    }

    /* ─── ACCESSIBILITY ────────────────────────────────────────── */
    a:focus-visible, button:focus-visible, .unit-head:focus-visible, .lecture-item:focus-visible {
      outline: 2px solid var(--accent2);
      outline-offset: 3px;
      border-radius: 6px;
    }
    .btn:active, .btn-primary:active { transform: scale(0.96); }
    html.reduce-motion * {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }

    .toast {
      position: fixed;
      bottom: 80px;
      right: 24px;
      z-index: 9000;
      padding: 12px 24px;
      border-radius: 999px;
      background: var(--tint2);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border2);
      transform: translateX(120%);
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.2,0.9,0.4,1.1), opacity 0.3s;
      font-size: 13px;
      font-weight: 500;
    }
    .toast.show { transform: translateX(0); opacity: 1; }
  </style>
</head>
<body>

  <!-- ─── CRT OVERLAY ──────────────────────────────────────────── -->
  <div class="crt-overlay" id="crtOverlay"></div>

  <!-- ─── TOP BAR ───────────────────────────────────────────────── -->
  <div class="topbar">
    <a class="brand" href="#">
      <div class="brand-mark"><i class="ic" data-ic="book"></i></div>
      EDUMOE <small>· Courses</small>
    </a>
    <div class="topbar-right">
      <div class="theme-switcher">
        <button class="theme-dot td-ruby active" id="td-ruby" onclick="setTheme('ruby', this)"></button>
        <button class="theme-dot td-lava" id="td-lava" onclick="setTheme('lava', this)"></button>
        <button class="theme-dot td-space" id="td-space" onclick="setTheme('space', this)"></button>
        <button class="theme-dot td-oxford" id="td-oxford" onclick="setTheme('oxford', this)"></button>
        <button class="theme-dot td-gray" id="td-gray" onclick="setTheme('gray', this)"></button>
        <button class="theme-dot td-light" id="td-light" onclick="setTheme('light', this)"></button>
        <div class="custom-color-wrap" id="customColorWrap">
          <input type="color" id="customColorPicker" value="#e11d48" />
        </div>
        <button class="theme-dot td-terminal" id="td-terminal" onclick="setTheme('terminal', this)"></button>
      </div>
      <button class="crt-toggle" id="crtToggle" onclick="toggleCRT()"><i class="ic" data-ic="tv"></i></button>
      <a href="index.html" class="btn-back"><i class="ic" data-ic="arrow-left"></i> <span>Back</span></a>
    </div>
  </div>

  <!-- ─── OVERVIEW ───────────────────────────────────────────────── -->
  <div class="wrap" id="overviewView">
    <!-- Hero -->
    <div class="courses-hero">
      <h1><i class="ic" data-ic="book"></i> Courses</h1>
      <p>All 8 core CS subjects — with real lecture structures, progress tracking, and AI companion.</p>
      <div class="courses-stats" id="overviewStats">
        <div class="stat-item"><div class="num" id="statTotal">0</div><div class="lbl">Lectures</div></div>
        <div class="stat-item"><div class="num" id="statDone">0</div><div class="lbl">Completed</div></div>
        <div class="stat-item"><div class="num" id="statPct">0%</div><div class="lbl">Progress</div></div>
      </div>
      <div class="search-wrap">
        <span class="search-icon"><i class="ic" data-ic="search"></i></span>
        <input type="text" id="courseSearch" placeholder="Search courses..." oninput="filterCourses(this.value)" />
      </div>
    </div>

    <!-- Continue Learning -->
    <div class="continue-section hidden" id="continueSection">
      <div class="left">
        <span class="label">↻ Continue</span>
        <span class="course-name" id="continueCourse">—</span>
        <span class="lec-name" id="continueLecture">—</span>
      </div>
      <button class="btn btn-sm btn-primary" id="continueBtn" onclick="resumeLearning()">Resume</button>
    </div>

    <div class="course-grid" id="courseGrid"></div>
  </div>

  <!-- ─── DETAIL VIEW ───────────────────────────────────────────── -->
  <div class="wrap detail-view" id="detailView">
    <div class="detail-top">
      <button class="btn btn-sm" onclick="goBack()"><i class="ic" data-ic="arrow-left"></i> Back</button>
      <h2 id="detailTitle">Course</h2>
      <span class="sub" id="detailSub">Term · Units</span>
    </div>
    <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar()"></div>
    <div class="detail-layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <h4 id="sideTitle">Units</h4>
          <div class="meta" id="sideMeta">0 units · 0 lectures</div>
          <div class="prog-bar"><div class="prog-bar-fill" id="sideProgFill"></div></div>
          <div class="prog-label"><span id="sideProgText">0 of 0 done</span><span id="sideProgPct">0%</span></div>
        </div>
        <div class="unit-list" id="unitList"></div>
      </aside>
      <main class="main-content" id="mainContent">
        <!-- filled by JS -->
      </main>
    </div>
  </div>

  <!-- ─── TOAST ──────────────────────────────────────────────────── -->
  <div class="toast" id="toast"><span id="toastMsg"></span></div>

  <script>
    // ============================================================
    //  ICONS
    // ============================================================
    const ICONS = {
      'book': '<path d="M4 4a2 2 0 0 1 2-2h13v18H6a2 2 0 0 0-2 2V4z"/><line x1="8" y1="7" x2="15" y2="7"/>',
      'terminal': '<polyline points="5 8 9 12 5 16"/><line x1="12" y1="16" x2="18" y2="16"/><rect x="2" y="4" width="20" height="16" rx="2"/>',
      'microchip': '<rect x="6" y="6" width="12" height="12" rx="1"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
      'dice': '<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/>',
      'infinity': '<path d="M6 8a4 4 0 1 0 0 8c3 0 4-4 6-4s3 4 6 4a4 4 0 1 0 0-8c-3 0-4 4-6 4S9 8 6 8z"/>',
      'code': '<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>',
      'bolt': '<polygon points="13 2 4 14 11 14 10 22 20 9 13 9 13 2" fill="currentColor" stroke="none"/>',
      'project-diagram': '<rect x="2" y="4" width="6" height="5" rx="1"/><rect x="16" y="4" width="6" height="5" rx="1"/><rect x="9" y="15" width="6" height="5" rx="1"/><path d="M5 9v2a2 2 0 0 0 2 2h3M19 9v2a2 2 0 0 1-2 2h-3"/>',
      'binary': '<rect x="4" y="3" width="7" height="8" rx="1"/><rect x="13" y="13" width="7" height="8" rx="1"/><path d="M6 21h4M8 21v-6M18 3l-2 1"/>',
      'tv': '<rect x="2" y="5" width="20" height="13" rx="2"/><polyline points="8 21 12 18 16 21"/>',
      'arrow-left': '<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
      'arrow-right': '<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>',
      'check': '<polyline points="20 6 9 17 4 12"/>',
      'chevron': '<polyline points="9 6 15 12 9 18"/>',
      'play': '<polygon points="6 4 20 12 6 20 6 4" fill="currentColor" stroke="none"/>',
      'brain': '<path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-1 5.8V15a3 3 0 0 0 4 2.8A2.5 2.5 0 0 0 12 20V5a2.5 2.5 0 0 0-3-1z"/><path d="M15 4a3 3 0 0 1 3 3 3 3 0 0 1 1 5.8V15a3 3 0 0 1-4 2.8A2.5 2.5 0 0 1 12 20"/>',
      'clock': '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/>',
      'search': '<circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/>',
    };

    function injectIcons(root) {
      (root || document).querySelectorAll('i.ic[data-ic]').forEach(el => {
        if (el.dataset.done) return;
        const p = ICONS[el.dataset.ic];
        if (p) { el.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + p + '</svg>'; el.dataset.done = '1'; }
      });
    }

    // ============================================================
    //  THEME SYSTEM (same as homepage)
    // ============================================================
    function clearCustomInlineStyles() {
      const root = document.documentElement;
      ['--custom-accent','--custom-accent2','--custom-accent3','--custom-glow',
       '--custom-glow2','--custom-border','--custom-border2','--custom-tint',
       '--custom-tint2','--custom-tint3'].forEach(v => root.style.removeProperty(v));
      document.querySelectorAll('.td-ruby,.td-lava,.td-space,.td-oxford,.td-gray,.td-light,.td-terminal')
        .forEach(el => { el.style.removeProperty('background'); el.style.removeProperty('box-shadow'); });
      document.getElementById('customColorWrap')?.style.removeProperty('box-shadow');
    }

    function setTheme(theme, el) {
      clearCustomInlineStyles();
      if (theme === 'terminal') {
        document.documentElement.setAttribute('data-theme', 'terminal');
        localStorage.setItem('edumoe-theme', 'terminal');
        localStorage.removeItem('edumoe-custom-color');
        showToast('$ mode --terminal');
        document.querySelectorAll('.theme-dot').forEach(d => d.classList.remove('active'));
        if (el) el.classList.add('active');
        updateCRTButton();
        return;
      }
      if (theme === 'ruby') {
        document.documentElement.removeAttribute('data-theme');
        document.getElementById('customColorPicker').value = '#e11d48';
        document.getElementById('customColorWrap').style.background = '#e11d48';
        localStorage.removeItem('edumoe-custom-color');
        localStorage.setItem('edumoe-theme', 'ruby');
        showToast('Theme: Ruby');
      } else {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('edumoe-theme', theme);
        localStorage.removeItem('edumoe-custom-color');
        const cm = { lava: '#ff5a1f', space: '#7c3aed', oxford: '#00d4ff', gray: '#6b7280', light: '#111111' };
        if (cm[theme]) { document.getElementById('customColorPicker').value = cm[theme]; document.getElementById('customColorWrap').style.background = cm[theme]; }
        showToast('Theme: ' + theme.charAt(0).toUpperCase() + theme.slice(1));
      }
      document.querySelectorAll('.theme-dot').forEach(d => d.classList.remove('active'));
      if (el) el.classList.add('active');
      updateCRTButton();
    }

    function setCustomTheme(color) {
      clearCustomInlineStyles();
      const r = parseInt(color.slice(1,3),16), g = parseInt(color.slice(3,5),16), b = parseInt(color.slice(5,7),16);
      document.documentElement.setAttribute('data-theme', 'custom');
      const root = document.documentElement;
      root.style.setProperty('--custom-accent', color);
      root.style.setProperty('--custom-accent2', `rgb(${Math.min(r+40,255)}, ${Math.min(g+40,255)}, ${Math.min(b+40,255)})`);
      root.style.setProperty('--custom-accent3', `rgb(${Math.min(r+80,255)}, ${Math.min(g+80,255)}, ${Math.min(b+80,255)})`);
      root.style.setProperty('--custom-glow', `rgba(${r},${g},${b},0.35)`);
      root.style.setProperty('--custom-glow2', `rgba(${r},${g},${b},0.14)`);
      root.style.setProperty('--custom-border', `rgba(${r},${g},${b},0.18)`);
      root.style.setProperty('--custom-border2', `rgba(${r},${g},${b},0.32)`);
      root.style.setProperty('--custom-tint', `rgba(${r},${g},${b},0.05)`);
      root.style.setProperty('--custom-tint2', `rgba(${r},${g},${b},0.10)`);

        <p>Every C++ program starts from a fixed skeleton. Understanding each piece is the foundation for everything else in this course.</p>
        <h3>The Minimal Program</h3>
        <pre><span class="cm">// include the input/output library</span>
  <span class="kw">#include</span> &lt;iostream&gt;
  <span class="kw">using namespace</span> std;

  <span class="kw">int</span> main() {
      cout &lt;&lt; <span class="st">"Hello, EduMoe!"</span>;
      <span class="kw">return</span> 0;
  }</pre>
        <h3>Breaking It Down</h3>
        <ul>
          <li><code>#include &lt;iostream&gt;</code> — pulls in the library that gives you <code>cout</code> and <code>cin</code>.</li>
          <li><code>using namespace std;</code> — lets you write <code>cout</code> instead of <code>std::cout</code>.</li>
          <li><code>int main()</code> — every program starts executing here. Exactly one <code>main</code>.</li>
          <li><code>cout &lt;&lt; ...</code> — sends output to the screen. The <code>&lt;&lt;</code> is the insertion operator.</li>
          <li><code>return 0;</code> — tells the OS the program finished successfully.</li>
        </ul>
        <div class="callout"><b>Exam trap:</b> forgetting the semicolon <code>;</code> at the end of a statement is the #1 cause of compile errors. Every statement ends with one — but <code>#include</code> lines and function headers do <b>not</b>.</div>
        <p>Open the compiler tab and run the program above. Change the text inside the quotes and re-run it — that's the fastest way to build intuition.</p>

    // Get notes for a lecture
    function getNotes(courseId, unitIdx, lecIdx) {
      const key = `${courseId}_${unitIdx}_${lecIdx}`;
      return REAL_NOTES[key] || '';
    }

    // Flat list of all lectures
    let allLectures = [];
    COURSES.forEach(c => {
      c.units.forEach((u, ui) => {
        u.lectures.forEach((l, li) => {
          allLectures.push({ ...l, courseId: c.id, unitIdx: ui, lecIdx: li, unitTitle: u.title });
        });
      });
    });

    // ============================================================
    //  STATE
    // ============================================================
    let currentCourseId = null;
    let currentLecIdx = 0;
    let progress = {}; // { courseId: { unitIdx: { lecIdx: true } } }
    let lastVisited = null; // { courseId, lecIdx }

    // Load progress from localStorage
    try {
      const saved = localStorage.getItem('edumoe_course_progress');
      if (saved) progress = JSON.parse(saved);
      const lv = localStorage.getItem('edumoe_last_visited');
      if (lv) lastVisited = JSON.parse(lv);
    } catch (e) {}

    function saveProgress() {
      localStorage.setItem('edumoe_course_progress', JSON.stringify(progress));
    }

    function saveLastVisited(courseId, lecIdx) {
      lastVisited = { courseId, lecIdx };
      localStorage.setItem('edumoe_last_visited', JSON.stringify(lastVisited));
    }

    function getCourse(id) { return COURSES.find(c => c.id === id); }

    function getFlatLectures(courseId) {
      const c = getCourse(courseId);
      if (!c) return [];
      const flat = [];
      c.units.forEach((u, ui) => {
        u.lectures.forEach((l, li) => {
          flat.push({ ...l, courseId, unitIdx: ui, lecIdx: li, unitTitle: u.title });
        });
      });
      return flat;
    }

    function isDone(courseId, unitIdx, lecIdx) {
      return !!(progress[courseId] && progress[courseId][unitIdx] && progress[courseId][unitIdx][lecIdx]);
    }

    function toggleDone(courseId, unitIdx, lecIdx) {
      if (!progress[courseId]) progress[courseId] = {};
      if (!progress[courseId][unitIdx]) progress[courseId][unitIdx] = {};
      const key = String(lecIdx);
      progress[courseId][unitIdx][key] = !progress[courseId][unitIdx][key];
      saveProgress();
    }

    function getCourseProgress(courseId) {
      const flat = getFlatLectures(courseId);
      let done = 0;
      flat.forEach(l => { if (isDone(courseId, l.unitIdx, l.lecIdx)) done++; });
      return { done, total: flat.length, pct: flat.length ? Math.round(done / flat.length * 100) : 0 };
    }

    function getGlobalStats() {
      let total = 0, done = 0;
      COURSES.forEach(c => {
        const p = getCourseProgress(c.id);
        total += p.total;
        done += p.done;
      });
      return { total, done, pct: total ? Math.round(done / total * 100) : 0 };
    }

    // ============================================================
    //  RENDER OVERVIEW
    // ============================================================
    function renderOverview(filter = '') {
      const grid = document.getElementById('courseGrid');
      const stats = getGlobalStats();
      document.getElementById('statTotal').textContent = stats.total;
      document.getElementById('statDone').textContent = stats.done;
      document.getElementById('statPct').textContent = stats.pct + '%';

      let filtered = COURSES;
      if (filter.trim()) {
        const q = filter.trim().toLowerCase();
        filtered = COURSES.filter(c => c.title.toLowerCase().includes(q) || c.term.toLowerCase().includes(q));
      }

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="no-results"><i class="ic" data-ic="search"></i>No courses match "${filter}"</div>`;
        return;
      }

      grid.innerHTML = filtered.map(c => {
        const p = getCourseProgress(c.id);
        const badge = p.total === 0 ? 'Not started' :
                      p.pct === 100 ? 'Complete' :
                      'In progress';
        const badgeClass = p.pct === 100 ? 'complete' : 'started';
        return `
          <div class="course-card" onclick="openCourse('${c.id}')">
            <div class="progress-badge ${badgeClass}">${p.pct === 100 ? '✓' : ''} ${badge}</div>
            <div class="card-icon"><i class="ic" data-ic="${c.icon}"></i></div>
            <h3>${c.title}</h3>
            <div class="sub">${c.term} · ${c.units.length} units</div>
            <div class="meta">
              <span><i class="ic" data-ic="clock"></i> ${p.total} lectures</span>
              <span><i class="ic" data-ic="check"></i> ${p.done} done</span>
            </div>
            <div class="prog-bar"><div class="prog-bar-fill" style="width:${p.pct}%"></div></div>
          </div>
        `;
      }).join('');
      injectIcons(grid);

      // Show Continue Learning section
      updateContinueSection();
    }

    function filterCourses(q) { renderOverview(q); }

    function updateContinueSection() {
      const section = document.getElementById('continueSection');
      if (!lastVisited) { section.classList.add('hidden'); return; }
      const c = getCourse(lastVisited.courseId);
      if (!c) { section.classList.add('hidden'); return; }
      const flat = getFlatLectures(lastVisited.courseId);
      if (lastVisited.lecIdx >= flat.length) { section.classList.add('hidden'); return; }
      const lec = flat[lastVisited.lecIdx];
      section.classList.remove('hidden');
      document.getElementById('continueCourse').textContent = c.title;
      document.getElementById('continueLecture').textContent = lec.title;
    }

    function resumeLearning() {
      if (!lastVisited) return;
      openCourse(lastVisited.courseId);
      // openLecture will be called inside renderDetail, but we need to jump to the saved index
      // We'll store the intended index and use it after render
      window._resumeIdx = lastVisited.lecIdx;
    }

    function openCourse(id) {
      currentCourseId = id;
      currentLecIdx = 0;
      document.getElementById('overviewView').style.display = 'none';
      document.getElementById('detailView').classList.add('active');
      renderDetail();

      // If we have a resume index, jump to it
      if (window._resumeIdx !== undefined && window._resumeIdx !== null) {
        const flat = getFlatLectures(id);
        if (window._resumeIdx < flat.length) {
          currentLecIdx = window._resumeIdx;
          renderDetail();
        }
        window._resumeIdx = null;
      }
    }

      document.getElementById('detailTitle').textContent = c.title;

      list.innerHTML = c.units.map((u, ui) => {

              ${u.lectures.map((l, li) => {
                const idx = flat.findIndex(f => f.unitIdx === ui && f.lecIdx === li);
                const done = isDone(c.id, ui, li);
                return `
                  <div class="lecture-item ${done ? 'done' : ''} ${idx === currentLecIdx ? 'active' : ''}" onclick="openLecture(${idx})">

        </div>
        <div class="notes">
          ${hasNotes ? notes : '<p style="color:var(--txt3)">Written notes for this lecture are coming soon. The unit structure and video will be added by the EduMoe team.</p>'}
        </div>
        <button class="btn ${done ? '' : 'btn-primary'} mark-done-btn" onclick="toggleDoneLec(${L.unitIdx}, ${L.lecIdx})">
          <i class="ic" data-ic="check"></i> ${done ? 'Completed ✓ — click to undo' : 'Mark as complete'}
        </button>
        <div class="lec-nav">
          ${idx > 0 ? `<button class="btn nav-prev" onclick="openLecture(${idx-1})"><i class="ic" data-ic="arrow-left"></i> Previous</button>` : '<span></span>'}
          ${idx < flat.length-1 ? `<button class="btn nav-next" onclick="openLecture(${idx+1})">Next <i class="ic" data-ic="arrow-right"></i></button>` : '<span></span>'}
        </div>
      `;
      injectIcons(main);
      document.getElementById('mainContent').scrollTop = 0;
      if (window.innerWidth <= 860) closeSidebar();
    }

    function toggleDoneLec(unitIdx, lecIdx) {
      toggleDone(currentCourseId, unitIdx, lecIdx);
      renderDetail();
      // Re-render overview stats in background
      const stats = getGlobalStats();
      document.getElementById('statTotal').textContent = stats.total;
      document.getElementById('statDone').textContent = stats.done;
      document.getElementById('statPct').textContent = stats.pct + '%';
    }

    // ============================================================
    //  SIDEBAR TOGGLE (mobile)
    // ============================================================
    function toggleSidebar() {
      const s = document.getElementById('sidebar');
      const b = document.getElementById('sidebarBackdrop');
      s.classList.toggle('open');
      b.classList.toggle('show');
    }
    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarBackdrop').classList.remove('show');
    }

    // ============================================================
    //  KEYBOARD SHORTCUTS
    // ============================================================
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (document.getElementById('detailView').classList.contains('active')) {
          goBack();
        }
      }
      if (e.key === 'ArrowRight' && document.getElementById('detailView').classList.contains('active')) {
        const flat = getFlatLectures(currentCourseId);
        if (currentLecIdx < flat.length - 1) openLecture(currentLecIdx + 1);
      }
      if (e.key === 'ArrowLeft' && document.getElementById('detailView').classList.contains('active')) {
        if (currentLecIdx > 0) openLecture(currentLecIdx - 1);
      }
    });

    // ============================================================
    //  TOAST
    // ============================================================
    let toastTimer;
    function showToast(msg) {
      const t = document.getElementById('toast'), m = document.getElementById('toastMsg');
      if (!t || !m) return;
      m.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
    }

    // ============================================================
    //  INIT
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
      renderOverview();
      injectIcons();
      // Menu toggle for mobile
      const detailTop = document.querySelector('.detail-top');
      const menuBtn = document.createElement('button');
      menuBtn.className = 'btn btn-sm menu-toggle';
      menuBtn.innerHTML = '<i class="ic" data-ic="book"></i> Units';
      menuBtn.onclick = toggleSidebar;
      detailTop.insertBefore(menuBtn, detailTop.firstChild);
    });

    // Expose functions globally
    window.openCourse = openCourse;
    window.goBack = goBack;
    window.toggleUnit = toggleUnit;
    window.openLecture = openLecture;
    window.toggleDoneLec = toggleDoneLec;
    window.toggleSidebar = toggleSidebar;
    window.closeSidebar = closeSidebar;
    window.showToast = showToast;
    window.setTheme = setTheme;
    window.setCustomTheme = setCustomTheme;
    window.toggleCRT = toggleCRT;
    window.filterCourses = filterCourses;
    window.resumeLearning = resumeLearning;

    console.log('🎓 EDUMOE Ultimate Courses (Improved) loaded.');
  </script>
</body>
</html>
