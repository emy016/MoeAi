<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>EDUMOE · Lecture</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- KaTeX for math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <style>
    /* =============================================================
       EDUMOE V3 – ULTIMATE LECTURE PAGE
       The Core Learning Experience
       ============================================================= */

    /* ─── THEMES ──────────────────────────────────────────────────── */
    :root {
      --bg1: #0a0a0f;
      --bg2: #111118;
      --bg3: #1a1a2a;
      --accent: #e11d48;
      --accent2: #f43f5e;
      --accent3: #fb7185;
      --accent-glow: rgba(225, 29, 72, 0.35);
      --glow: rgba(225, 29, 72, 0.28);
      --glow2: rgba(225, 29, 72, 0.12);
      --glass-border: rgba(225, 29, 72, 0.18);
      --glass-border2: rgba(225, 29, 72, 0.32);
      --txt1: #fff0f5;
      --txt2: rgba(255, 192, 208, 0.75);
      --txt3: rgba(192, 128, 144, 0.50);
      --tint: rgba(225, 29, 72, 0.05);
      --tint2: rgba(225, 29, 72, 0.10);
      --tint3: rgba(225, 29, 72, 0.18);
      --c-glass: #c8a0a8;
      --c-light: #ffe0e8;
      --c-dark: #300010;
      --reflex-l: 0.45;
      --reflex-d: 1.7;
      --sat: 190%;
      --glass-blur: 14px;
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-xl: 32px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      --transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      --ok: #4fff8f;
      --okbg: rgba(79, 255, 143, 0.12);
      --okbd: rgba(79, 255, 143, 0.35);
      --warn: #ffb347;
      --no: #ff6b6b;
    }

    [data-theme="lava"] { --bg1: #0c0c0e; --bg2: #161618; --bg3: #202024; --accent: #ff5a1f; --accent2: #ff8c42; --accent3: #ffb347; --accent-glow: rgba(255,90,31,0.35); --glow: rgba(255,90,31,0.28); --glow2: rgba(255,90,31,0.12); --glass-border: rgba(255,90,31,0.18); --glass-border2: rgba(255,90,31,0.32); --txt1: #fff; --txt2: rgba(255,255,255,0.70); --txt3: rgba(255,255,255,0.40); --tint: rgba(255,255,255,0.05); --tint2: rgba(255,255,255,0.10); --tint3: rgba(255,255,255,0.18); --c-glass: #c8c8c9; --c-light: #fff; --c-dark: #000; --reflex-l:0.35; --reflex-d:1.8; --sat:180%; }
    [data-theme="space"] { --bg1: #000; --bg2: #0a0a14; --bg3: #141428; --accent: #7c3aed; --accent2: #a855f7; --accent3: #c084fc; --accent-glow: rgba(124,58,237,0.35); --glow: rgba(124,58,237,0.28); --glow2: rgba(124,58,237,0.12); --glass-border: rgba(124,58,237,0.18); --glass-border2: rgba(124,58,237,0.32); --txt1: #f0e8ff; --txt2: #c8b0ff; --txt3: #a080e0; --tint: rgba(124,58,237,0.05); --tint2: rgba(124,58,237,0.10); --tint3: rgba(124,58,237,0.18); --c-glass: #b0a0d0; --c-light: #e8d8ff; --c-dark: #1a0030; --reflex-l:0.50; --reflex-d:1.6; --sat:200%; }
    [data-theme="oxford"] { --bg1: #000510; --bg2: #020a18; --bg3: #081530; --accent: #00d4ff; --accent2: #00f0ff; --accent3: #80f8ff; --accent-glow: rgba(0,212,255,0.35); --glow: rgba(0,212,255,0.28); --glow2: rgba(0,212,255,0.12); --glass-border: rgba(0,212,255,0.18); --glass-border2: rgba(0,212,255,0.32); --txt1: #e0fcff; --txt2: #80d8f0; --txt3: #40b0d0; --tint: rgba(0,212,255,0.05); --tint2: rgba(0,212,255,0.10); --tint3: rgba(0,212,255,0.18); --c-glass: #80e8f8; --c-light: #e0fcff; --c-dark: #000810; --reflex-l:0.55; --reflex-d:1.5; --sat:200%; }
    [data-theme="gray"] { --bg1: #0f0f12; --bg2: #18181b; --bg3: #22222a; --accent: #6b7280; --accent2: #9ca3af; --accent3: #d1d5db; --accent-glow: rgba(107,114,128,0.35); --glow: rgba(107,114,128,0.28); --glow2: rgba(107,114,128,0.12); --glass-border: rgba(107,114,128,0.18); --glass-border2: rgba(107,114,128,0.32); --txt1: #f3f4f6; --txt2: #9ca3af; --txt3: #6b7280; --tint: rgba(107,114,128,0.05); --tint2: rgba(107,114,128,0.10); --tint3: rgba(107,114,128,0.18); --c-glass: #c8c8c9; --c-light: #fff; --c-dark: #000; --reflex-l:0.35; --reflex-d:1.8; --sat:120%; }
    [data-theme="light"] { --bg1: #fff; --bg2: #f4f4f6; --bg3: #e8e8ec; --accent: #111; --accent2: #333; --accent3: #555; --accent-glow: rgba(0,0,0,0.12); --glow: rgba(0,0,0,0.12); --glow2: rgba(0,0,0,0.06); --glass-border: rgba(0,0,0,0.10); --glass-border2: rgba(0,0,0,0.20); --txt1: #1a1a1a; --txt2: #555; --txt3: #888; --tint: rgba(0,0,0,0.03); --tint2: rgba(0,0,0,0.06); --tint3: rgba(0,0,0,0.12); --c-glass: #000; --c-light: #fff; --c-dark: #000; --reflex-l:0.06; --reflex-d:0.6; --sat:100%; }
    [data-theme="custom"] { --bg1: #0a0a0f; --bg2: #111118; --bg3: #1a1a2a; --accent: var(--custom-accent,#e11d48); --accent2: var(--custom-accent2,#f43f5e); --accent3: var(--custom-accent3,#fb7185); --accent-glow: var(--custom-glow,rgba(225,29,72,0.35)); --glow: var(--custom-glow,rgba(225,29,72,0.28)); --glow2: var(--custom-glow2,rgba(225,29,72,0.12)); --glass-border: var(--custom-border,rgba(225,29,72,0.18)); --glass-border2: var(--custom-border2,rgba(225,29,72,0.32)); --txt1:#fff0f5; --txt2:#ffc0d0; --txt3:#c08090; --tint: var(--custom-tint,rgba(225,29,72,0.05)); --tint2: var(--custom-tint2,rgba(225,29,72,0.10)); --tint3: var(--custom-tint3,rgba(225,29,72,0.18)); --c-glass:#c8a0a8; --c-light:#ffe0e8; --c-dark:#300010; --reflex-l:0.45; --reflex-d:1.7; --sat:190%; }

    [data-theme="terminal"] {
      --bg1: #050a05; --bg2: #071007; --bg3: #0a180a; --accent: #4fff8f; --accent2: #6effa0; --accent3: #9dffc0;
      --accent-glow: rgba(79,255,143,0.35); --glow: rgba(79,255,143,0.28); --glow2: rgba(79,255,143,0.10);
      --glass-border: rgba(79,255,143,0.18); --glass-border2: rgba(79,255,143,0.32);
      --txt1: #b8ffcf; --txt2: #4fff8f; --txt3: #2f8f57;
      --tint: rgba(79,255,143,0.04); --tint2: rgba(79,255,143,0.08); --tint3: rgba(79,255,143,0.14);
      --c-glass: #4fff8f; --c-light: #b8ffcf; --c-dark: #001a08; --reflex-l:0.20; --reflex-d:1.2; --sat:130%; --glass-blur:8px; --shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    [data-theme="terminal"] body,
    [data-theme="terminal"] .brand,
    [data-theme="terminal"] .sidebar-unit,
    [data-theme="terminal"] .tab-btn {
      font-family: 'Fira Code', monospace !important;
      letter-spacing: 0 !important;
    }
    [data-theme="terminal"] .brand-mark { background: var(--accent) !important; color: #000 !important; }

    .crt-overlay {
      display: none; position: fixed; inset: 0; z-index: 9998; pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.10) 0px, rgba(0,0,0,0.10) 1px, transparent 1px, transparent 3px);
      mix-blend-mode: multiply;
    }
    [data-theme="terminal"] .crt-overlay { display: block; }
    [data-theme="terminal"]:not(.no-crt) body { animation: crt-flicker 4s infinite; }
    @keyframes crt-flicker { 0%,95%,100%{opacity:1} 96%{opacity:0.94} 98%{opacity:0.98} }
    html.no-crt .crt-overlay { display: none !important; }
    html.no-crt [data-theme="terminal"] body { animation: none !important; }
    @media (prefers-reduced-motion: reduce) { [data-theme="terminal"] body { animation: none !important; } .crt-overlay { background: none; } }

    /* ─── BASE ───────────────────────────────────────────────────── */
    *,
    *::before,
    *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg1);
      color: var(--txt1);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.5s ease, color 0.4s ease;
      padding-bottom: 72px;
    }

    .ic {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1em; height: 1em;
      vertical-align: -0.125em;
    }
    .ic svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .ic.fill svg { fill: currentColor; stroke: none; }

    .lg {
      position: relative;
      isolation: isolate;
    }
    .lg-effect {
      position: absolute; inset: 0; z-index: 0; border-radius: inherit;
      backdrop-filter: blur(var(--glass-blur, 14px)) saturate(var(--sat));
      -webkit-backdrop-filter: blur(var(--glass-blur, 14px)) saturate(var(--sat));
      overflow: hidden;
    }
    .lg-tint {
      position: absolute; inset: 0; z-index: 1; border-radius: inherit;
      background: var(--tint);
      transition: background 0.4s ease;
    }
    .lg-shine {
      position: absolute; inset: 0; z-index: 2; border-radius: inherit;
      overflow: hidden;
      box-shadow:
        inset 2px 3px 0px -1.5px color-mix(in srgb, var(--c-light) calc(var(--reflex-l)*90%), transparent),
        inset 0 0 0 1px color-mix(in srgb, var(--c-light) calc(var(--reflex-l)*12%), transparent),
        inset -2px -2px 0px -1px color-mix(in srgb, var(--c-light) calc(var(--reflex-l)*70%), transparent),
        inset -2px -7px 1px -5px color-mix(in srgb, var(--c-light) calc(var(--reflex-l)*55%), transparent),
        inset 0 -1px 4px 0px color-mix(in srgb, var(--c-dark) calc(var(--reflex-d)*10%), transparent),
        inset -1.5px 2.5px 0px -2px color-mix(in srgb, var(--c-dark) calc(var(--reflex-d)*18%), transparent),
        inset 0px 3px 5px -2px color-mix(in srgb, var(--c-dark) calc(var(--reflex-d)*16%), transparent),
        inset 2px -6px 1px -4px color-mix(in srgb, var(--c-dark) calc(var(--reflex-d)*8%), transparent),
        0px 1px 6px 0px color-mix(in srgb, var(--c-dark) calc(var(--reflex-d)*10%), transparent),
        0px 8px 20px 0px color-mix(in srgb, var(--c-dark) calc(var(--reflex-d)*8%), transparent),
        0px 0px 40px -10px var(--glow2);
    }
    .lg > *:not(.lg-effect):not(.lg-tint):not(.lg-shine) { position: relative; z-index: 3; }
    .lg-pill { border-radius: 999px; }
    .lg-card { border-radius: var(--radius-lg); }
    .lg-panel { border-radius: var(--radius-xl); }

    /* ─── TOP BAR ────────────────────────────────────────────────── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 22px;
      border-bottom: 1px solid var(--glass-border);
      background: var(--bg2);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: -0.03em;
      text-decoration: none;
      color: var(--txt1);
      font-size: 18px;
    }
    .brand-mark {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: grid; place-items: center; color: #fff; font-size: 14px;
      box-shadow: 0 4px 12px var(--accent-glow);
    }
    .brand small { color: var(--txt3); font-weight: 500; font-size: 12px; }
    .breadcrumb {
      font-size: 12px;
      color: var(--txt3);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .breadcrumb a { color: var(--txt2); text-decoration: none; transition: color 0.2s; }
    .breadcrumb a:hover { color: var(--accent2); }
    .topbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .theme-switcher {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 6px;
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      background: var(--tint);
      flex-wrap: wrap;
    }
    .theme-dot {
      width: 14px; height: 14px; border-radius: 50%;
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      flex-shrink: 0;
    }
    .theme-dot:hover { transform: scale(1.25); }
    .theme-dot.active { border-color: var(--txt1); transform: scale(1.1); }
    .td-ruby { background: #e11d48; }
    .td-lava { background: #ff5a1f; }
    .td-space { background: #7c3aed; }
    .td-oxford { background: #00d4ff; }
    .td-gray { background: #6b7280; }
    .td-light { background: #ddd; border: 1px solid #aaa; }
    .td-terminal { background: #4fff8f; box-shadow: 0 0 8px rgba(79,255,143,0.6); }
    .custom-color-wrap {
      position: relative; width: 20px; height: 20px; border-radius: 50%;
      overflow: hidden; border: 2px solid var(--glass-border);
      cursor: pointer; flex-shrink: 0; background: var(--accent);
    }
    .custom-color-wrap input[type="color"] {
      position: absolute; top: -4px; left: -4px; width: calc(100% + 8px); height: calc(100% + 8px);
      border: none; padding: 0; cursor: pointer; background: none;
    }
    .custom-color-wrap input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    .custom-color-wrap input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }
    .crt-toggle {
      display: none; width: 28px; height: 28px; border-radius: 999px;
      border: 1px solid var(--glass-border);
      background: var(--tint2); color: var(--txt2);
      cursor: pointer; font-size: 12px;
      align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .crt-toggle:hover { color: var(--txt1); border-color: var(--accent2); }
    [data-theme="terminal"] .crt-toggle { display: inline-flex; }
    .crt-toggle.off { opacity: 0.4; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--glass-border);
      background: var(--tint);
      color: var(--txt1);
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      transition: all 0.16s;
    }
    .btn:hover { border-color: var(--accent2); background: var(--tint2); transform: translateY(-1px); }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; color: #fff;
      box-shadow: 0 4px 14px var(--accent-glow);
    }
    .btn-primary:hover { box-shadow: 0 6px 24px var(--accent-glow); transform: translateY(-2px); }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .btn-success { background: var(--okbg); color: var(--ok); border-color: var(--okbd); }
    .btn-success:hover { background: var(--ok); color: #000; border-color: var(--ok); }

    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; height: 100%; }

    /* ─── LECTURE LAYOUT ────────────────────────────────────────── */
    .lecture-layout {
      display: flex;
      gap: 24px;
      padding: 24px 0 40px;
      min-height: 70vh;
    }

    /* ─── SIDEBAR ────────────────────────────────────────────────── */
    .sidebar {
      width: 300px;
      flex-shrink: 0;
      background: var(--bg2);
      border-radius: var(--radius-md);
      border: 1px solid var(--glass-border);
      overflow-y: auto;
      max-height: calc(100vh - 160px);
      position: sticky;
      top: 90px;
    }
    .sidebar-head {
      padding: 16px 18px;
      border-bottom: 1px solid var(--glass-border);
      background: var(--tint);
      border-radius: var(--radius-md) var(--radius-md) 0 0;
    }
    .sidebar-head h4 {
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sidebar-head .meta {
      font-size: 11px;
      color: var(--txt3);
      margin-top: 4px;
    }
    .sidebar-head .prog-bar {
      height: 4px;
      background: var(--tint2);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 10px;
    }
    .sidebar-head .prog-bar .fill {
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent3));
      transition: width 0.4s;
    }
    .sidebar-head .prog-label {
      font-size: 10px;
      color: var(--txt3);
      margin-top: 4px;
      display: flex;
      justify-content: space-between;
    }

    .unit-list { padding: 4px 0; }
    .unit-item {
      border-bottom: 1px solid var(--glass-border);
    }
    .unit-item:last-child { border-bottom: none; }
    .unit-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 16px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }
    .unit-head:hover { background: var(--tint); }
    .unit-head .chev {
      margin-left: auto;
      transition: transform 0.2s;
      color: var(--txt3);
      font-size: 11px;
    }
    .unit-item.open .chev { transform: rotate(90deg); }
    .unit-num {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: var(--tint2);
      border: 1px solid var(--glass-border);
      display: grid;
      place-items: center;
      font-size: 10px;
      font-weight: 700;
      color: var(--accent3);
      flex-shrink: 0;
    }
    .unit-title { font-size: 12.5px; font-weight: 600; line-height: 1.3; }
    .unit-lectures {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }
    .unit-item.open .unit-lectures { max-height: 800px; }
    .lecture-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px 8px 30px;
      cursor: pointer;
      font-size: 12.5px;
      color: var(--txt2);
      transition: background 0.12s;
      border-left: 2px solid transparent;
    }
    .lecture-item:hover { background: var(--tint); }
    .lecture-item.active {
      background: var(--tint2);
      border-left-color: var(--accent2);
      color: var(--txt1);
      font-weight: 600;
    }
    .lec-check {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1.5px solid var(--glass-border2);
      flex-shrink: 0;
      display: grid;
      place-items: center;
      font-size: 8px;
      color: transparent;
      transition: all 0.15s;
    }
    .lecture-item.done .lec-check {
      background: var(--ok);
      border-color: var(--ok);
      color: #04140a;
    }
    .lec-title { flex: 1; line-height: 1.3; }
    .lec-dur {
      font-size: 10px;
      color: var(--txt3);
      font-family: 'Fira Code', monospace;
    }

    /* ─── MAIN CONTENT ───────────────────────────────────────────── */
    .main-content {
      flex: 1;
      min-width: 0;
    }

    /* ─── LECTURE HEADER ────────────────────────────────────────── */
    .lec-header {
      margin-bottom: 20px;
    }
    .lec-eyebrow {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--accent3);
      font-weight: 700;
    }
    .lec-header h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 4px 0 2px;
      line-height: 1.2;
    }
    .lec-header .sub {
      font-size: 13px;
      color: var(--txt3);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .lec-header .sub .lec-tag {
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      background: var(--tint2);
      color: var(--txt2);
    }

    /* ─── VIDEO PLAYER ───────────────────────────────────────────── */
    .video-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #000;
      border: 1px solid var(--glass-border);
      margin-bottom: 8px;
    }
    .video-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .video-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, var(--bg2), var(--bg3));
      cursor: pointer;
    }
    .video-placeholder .play-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--accent);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 18px;
      box-shadow: 0 8px 30px -6px var(--accent-glow);
      transition: transform 0.2s;
    }
    .video-placeholder:hover .play-btn { transform: scale(1.08); }
    .video-placeholder .vp-note { font-size: 12px; color: var(--txt3); }
    .video-controls {
      display: flex;
      gap: 8px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .video-controls .btn { font-size: 11px; padding: 5px 12px; }

    /* ─── TABS ────────────────────────────────────────────────────── */
    .tabs {
      display: flex;
      gap: 4px;
      background: var(--tint);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      margin: 14px 0 18px;
      flex-wrap: wrap;
    }
    .tab-btn {
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      border: none;
      background: none;
      color: var(--txt3);
      cursor: pointer;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.18s;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      box-shadow: 0 3px 10px var(--accent-glow);
    }
    .tab-btn:not(.active):hover { color: var(--txt1); background: var(--tint2); }
    .tab-btn .badge {
      font-size: 9px;
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(255,255,255,0.15);
      font-weight: 700;
    }
    .tab-btn.active .badge { background: rgba(0,0,0,0.2); }

    .tab-content {
      display: none;
      animation: fade-up 0.3s ease;
    }
    .tab-content.active { display: block; }
    @keyframes fade-up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    /* ─── NOTES ──────────────────────────────────────────────────── */
    .notes-content {
      font-size: 15px;
      line-height: 1.75;
      color: var(--txt2);
    }
    .notes-content h3 {
      font-size: 18px;
      font-weight: 700;
      color: var(--txt1);
      margin: 24px 0 10px;
      letter-spacing: -0.01em;
    }
    .notes-content p { margin: 12px 0; }
    .notes-content code {
      font-family: 'Fira Code', monospace;
      font-size: 13px;
      background: var(--tint2);
      padding: 2px 7px;
      border-radius: 4px;
      color: var(--txt1);
    }
    .notes-content pre {
      background: var(--bg2);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      overflow-x: auto;
      margin: 14px 0;
      font-family: 'Fira Code', monospace;
      font-size: 13px;
      line-height: 1.6;
      color: #abb2bf;
    }
    .notes-content pre .kw { color: var(--accent3); }
    .notes-content pre .st { color: var(--ok); }
    .notes-content pre .cm { color: var(--txt3); }
    .notes-content ul { margin: 12px 0 12px 22px; }
    .notes-content li { margin: 6px 0; }
    .notes-content .callout {
      padding: 14px 18px;
      border-radius: var(--radius-sm);
      background: rgba(255, 180, 80, 0.08);
      border: 1px solid rgba(255, 180, 80, 0.25);
      margin: 18px 0;
      font-size: 14px;
      color: #ffd9a0;
    }
    .notes-content .callout b { color: #ffe8c4; }
    .notes-content .katex { font-size: 1.1em; }

    /* ─── TRANSCRIPT ────────────────────────────────────────────── */
    .transcript-content {
      max-height: 400px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.8;
      color: var(--txt2);
      padding-right: 8px;
    }
    .transcript-content .timestamp {
      color: var(--accent3);
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
      width: 56px;
    }
    .transcript-content .line {
      padding: 3px 0;
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      gap: 8px;
    }
    .transcript-content .line:hover { background: var(--tint); }

    /* ─── SUMMARY (AI-generated) ────────────────────────────────── */
    .summary-content {
      font-size: 14px;
      line-height: 1.7;
      color: var(--txt2);
    }
    .summary-content .key-point {
      padding: 8px 12px;
      margin: 6px 0;
      background: var(--tint);
      border-left: 2px solid var(--accent2);
      border-radius: 4px;
    }
    .summary-content .key-point strong { color: var(--txt1); }

    /* ─── MOEAI CHAT (embedded) ─────────────────────────────────── */
    .moeai-chat-embedded {
      background: var(--bg2);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin: 14px 0 20px;
    }
    .moeai-chat-embedded .chat-header {
      padding: 10px 16px;
      border-bottom: 1px solid var(--glass-border);
      background: var(--tint);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
    }
    .moeai-chat-embedded .chat-header .ic { color: var(--accent2); }
    .moeai-chat-embedded .chat-messages {
      padding: 12px 16px;
      max-height: 180px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.5;
    }
    .moeai-chat-embedded .chat-messages .msg {
      margin-bottom: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      max-width: 90%;
    }
    .moeai-chat-embedded .chat-messages .msg.user {
      background: var(--tint2);
      margin-left: auto;
      color: var(--txt2);
    }
    .moeai-chat-embedded .chat-messages .msg.ai {
      background: var(--tint);
      border-left: 2px solid var(--accent2);
      color: var(--txt1);
    }
    .moeai-chat-embedded .chat-input {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      border-top: 1px solid var(--glass-border);
      background: var(--tint);
    }
    .moeai-chat-embedded .chat-input input {
      flex: 1;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid var(--glass-border);
      background: var(--bg1);
      color: var(--txt1);
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }
    .moeai-chat-embedded .chat-input input:focus { border-color: var(--accent2); }
    .moeai-chat-embedded .chat-input button {
      padding: 7px 16px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }

    /* ─── QUIZ SECTION ───────────────────────────────────────────── */
    .quiz-section {
      background: var(--bg2);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 20px;
      margin: 20px 0;
    }
    .quiz-section .quiz-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .quiz-section .quiz-header h4 {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .quiz-section .quiz-header .q-count {
      font-size: 12px;
      color: var(--txt3);
    }
    .quiz-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--glass-border);
      background: var(--tint);
      cursor: pointer;
      font-size: 14px;
      transition: all 0.15s;
      font-family: inherit;
      color: var(--txt1);
      width: 100%;
      text-align: left;
      margin-bottom: 6px;
    }
    .quiz-option:hover:not(.disabled) {
      border-color: var(--accent2);
      background: var(--tint2);
      transform: translateX(4px);
    }
    .quiz-option.disabled { cursor: default; opacity: 0.7; }
    .quiz-option .q-letter {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--tint2);
      border: 1px solid var(--glass-border);
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .quiz-option.correct {
      border-color: var(--okbd);
      background: var(--okbg);
    }
    .quiz-option.correct .q-letter {
      background: var(--ok);
      border-color: var(--ok);
      color: #04140a;
    }
    .quiz-option.wrong {
      border-color: var(--nobd);
      background: var(--nobg);
    }
    .quiz-option.wrong .q-letter {
      background: var(--no);
      border-color: var(--no);
      color: #160404;
    }
    .quiz-feedback {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      margin: 10px 0 0;
      font-size: 13px;
      line-height: 1.5;
      display: none;
    }
    .quiz-feedback.show { display: block; }
    .quiz-feedback.right { background: var(--okbg); border: 1px solid var(--okbd); color: var(--ok); }
    .quiz-feedback.wrong { background: var(--nobg); border: 1px solid var(--nobd); color: var(--no); }
    .quiz-feedback .fb-title { font-weight: 700; display: flex; align-items: center; gap: 6px; }

    /* ─── SIMULATOR LAUNCH ───────────────────────────────────────── */
    .sim-launch {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      background: var(--tint);
      border-radius: var(--radius-md);
      border: 1px solid var(--glass-border);
      margin: 16px 0 20px;
      flex-wrap: wrap;
    }
    .sim-launch .sim-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 20px;
    }
    .sim-launch .sim-text { flex: 1; }
    .sim-launch .sim-text h5 { font-size: 14px; font-weight: 700; }
    .sim-launch .sim-text p { font-size: 12px; color: var(--txt3); }

    /* ─── LECTURE NAV ────────────────────────────────────────────── */
    .lec-nav {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--glass-border);
      flex-wrap: wrap;
    }
    .lec-nav .left { display: flex; gap: 8px; }
    .lec-nav .right { display: flex; gap: 8px; }

    /* ─── TOAST ──────────────────────────────────────────────────── */
    .toast {
      position: fixed; bottom: 80px; right: 24px; z-index: 9000;
      padding: 10px 20px; border-radius: 999px;
      background: var(--tint2); backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border2);
      transform: translateX(120%); opacity: 0;
      transition: transform 0.4s cubic-bezier(0.2,0.9,0.4,1.1), opacity 0.3s;
      font-size: 12px; font-weight: 500;
    }
    .toast.show { transform: translateX(0); opacity: 1; }

    /* ─── MOBILE ─────────────────────────────────────────────────── */
    .sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 49; }
    .menu-toggle { display: none; }

    @media (max-width: 860px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 50;
        transform: translateX(-100%);
        transition: transform 0.25s;
        border-radius: 0;
        max-height: 100vh;
        width: 280px;
        box-shadow: 0 0 40px rgba(0,0,0,0.5);
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-backdrop.show { display: block; }
      .menu-toggle { display: inline-flex; }
      .lecture-layout { flex-direction: column; }
      .topbar { padding: 8px 12px; gap: 6px; }
      .brand small { display: none; }
      .theme-switcher { gap: 2px; padding: 2px 3px; }
      .theme-dot { width: 10px; height: 10px; }
      .custom-color-wrap { width: 14px; height: 14px; }
      .lec-header h1 { font-size: 20px; }
      .wrap { padding: 0 12px; }
      .lec-nav { flex-direction: column; align-items: stretch; }
      .lec-nav .left, .lec-nav .right { justify-content: center; }
    }
    @media (max-width: 450px) {
      .topbar { padding: 6px 8px; }
      .brand { font-size: 13px; }
      .brand-mark { width: 24px; height: 24px; font-size: 11px; }
      .theme-switcher { gap: 1px; padding: 1px 2px; }
      .theme-dot { width: 8px; height: 8px; }
      .custom-color-wrap { width: 12px; height: 12px; }
      .tabs .tab-btn .ic { display: none; }
      .tabs .tab-btn { font-size: 11px; padding: 5px 10px; }
    }
  </style>
</head>
<body>

  <div class="crt-overlay" id="crtOverlay"></div>

  <!-- ─── TOP BAR ────────────────────────────────────────────────── -->
  <div class="topbar">
    <a class="brand" href="#">
      <div class="brand-mark"><i class="ic" data-ic="book"></i></div>
      EDUMOE <small>· Lecture</small>
    </a>
    <div class="breadcrumb">
      <a href="#" onclick="showToast('📚 Back to courses')">Courses</a>
      <span>›</span>
      <a href="#" onclick="showToast('📐 Back to Differential Equations')">Differential Equations</a>
      <span>›</span>
      <span style="color:var(--txt2);">Lecture 3</span>
    </div>
    <div class="topbar-right">
      <div class="theme-switcher">
        <button class="theme-dot td-ruby active" id="td-ruby" onclick="setTheme('ruby', this)"></button>
        <button class="theme-dot td-lava" id="td-lava" onclick="setTheme('lava', this)"></button>
        <button class="theme-dot td-space" id="td-space" onclick="setTheme('space', this)"></button>
        <button class="theme-dot td-oxford" id="td-oxford" onclick="setTheme('oxford', this)"></button>
        <button class="theme-dot td-gray" id="td-gray" onclick="setTheme('gray', this)"></button>
        <button class="theme-dot td-light" id="td-light" onclick="setTheme('light', this)"></button>
        <div class="custom-color-wrap" id="customColorWrap"><input type="color" id="customColorPicker" value="#e11d48"/></div>
        <button class="theme-dot td-terminal" id="td-terminal" onclick="setTheme('terminal', this)"></button>
      </div>
      <button class="crt-toggle" id="crtToggle" onclick="toggleCRT()"><i class="ic" data-ic="tv"></i></button>
      <button class="btn btn-sm menu-toggle" onclick="toggleSidebar()"><i class="ic" data-ic="menu"></i> Units</button>
      <a href="dashboard.html" class="btn btn-sm"><i class="ic" data-ic="arrow-left"></i> Dashboard</a>
    </div>
  </div>

  <!-- ─── LECTURE CONTENT ────────────────────────────────────────── -->
  <div class="wrap">
    <div class="lecture-layout">
      <!-- ─── SIDEBAR ────────────────────────────────────────────── -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <h4><i class="ic" data-ic="list"></i> Units</h4>
          <div class="meta" id="sideMeta">8 units · 32 lectures</div>
          <div class="prog-bar"><div class="fill" id="sideProgFill" style="width:0%"></div></div>
          <div class="prog-label"><span id="sideProgText">0 of 0 done</span><span id="sideProgPct">0%</span></div>
        </div>
        <div class="unit-list" id="unitList"></div>
      </aside>

      <!-- ─── MAIN CONTENT ────────────────────────────────────────── -->
      <main class="main-content" id="mainContent">
        <!-- Filled by JavaScript -->
      </main>
    </div>
  </div>

  <!-- ─── TOAST ──────────────────────────────────────────────────── -->
  <div class="toast" id="toast"><span id="toastMsg"></span></div>

  <script>
    // ============================================================
    // ICONS (additional ones for lecture page)
    // ============================================================
    const ICONS = {
      'book': '<path d="M4 4a2 2 0 0 1 2-2h13v18H6a2 2 0 0 0-2 2V4z"/><line x1="8" y1="7" x2="15" y2="7"/>',
      'arrow-left': '<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
      'tv': '<rect x="2" y="5" width="20" height="13" rx="2"/><polyline points="8 21 12 18 16 21"/>',
      'list': '<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="3.5" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="3.5" cy="18" r="1" fill="currentColor" stroke="none"/>',
      'play': '<polygon points="6 4 20 12 6 20 6 4" fill="currentColor" stroke="none"/>',
      'check': '<polyline points="20 6 9 17 4 12"/>',
      'chevron': '<polyline points="9 6 15 12 9 18"/>',
      'arrow-right': '<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>',
      'brain': '<path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-1 5.8V15a3 3 0 0 0 4 2.8A2.5 2.5 0 0 0 12 20V5a2.5 2.5 0 0 0-3-1z"/><path d="M15 4a3 3 0 0 1 3 3 3 3 0 0 1 1 5.8V15a3 3 0 0 1-4 2.8A2.5 2.5 0 0 1 12 20"/>',
      'file-alt': '<path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9l-7-7z"/><polyline points="13 2 13 9 20 9"/>',
      'microchip': '<rect x="6" y="6" width="12" height="12" rx="1"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
      'menu': '<line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>',
      'clock': '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/>',
      'rocket': '<path d="M4.5 16.5c-1.5 1.3-2 5-2 5s3.7-.5 5-2c.7-.8.7-2 0-2.8a2 2 0 0 0-3 0z"/><path d="M12 15l-3-3a12 12 0 0 1 3-8c2.5-2.5 5-3 7-3 0 2-.5 4.5-3 7a12 12 0 0 1-4 3z"/><path d="M9 12H4s.5-3 2-4 5 0 5 0"/><path d="M12 15v5s3-.5 4-2 0-5 0-5"/>',
      'terminal': '<polyline points="5 8 9 12 5 16"/><line x1="12" y1="16" x2="18" y2="16"/><rect x="2" y="4" width="20" height="16" rx="2"/>',
    };

    function injectIcons(root) {
      (root || document).querySelectorAll('i.ic[data-ic]').forEach(el => {
        if (el.dataset.done) return;
        const p = ICONS[el.dataset.ic];
        if (p) { el.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + p + '</svg>'; el.dataset.done = '1'; }
      });
    }

    // ============================================================
    // THEME SYSTEM (simplified – same as dashboard)
    // ============================================================
    function clearCustomInlineStyles() {
      const root = document.documentElement;
      ['--custom-accent','--custom-accent2','--custom-accent3','--custom-glow','--custom-glow2','--custom-border','--custom-border2','--custom-tint','--custom-tint2','--custom-tint3'].forEach(v => root.style.removeProperty(v));
      document.querySelectorAll('.theme-dot').forEach(el => { el.style.removeProperty('background'); el.style.removeProperty('box-shadow'); });
      document.getElementById('customColorWrap')?.style.removeProperty('box-shadow');
    }

    function setTheme(theme, el) {
      clearCustomInlineStyles();
      if (theme === 'terminal') {
        document.documentElement.setAttribute('data-theme', 'terminal');
        localStorage.setItem('edumoe-theme', 'terminal');
        localStorage.removeItem('edumoe-custom-color');
        showToast('$ mode --terminal');
        document.querySelectorAll('.theme-dot').forEach(d => d.classList.remove('active'));
        if (el) el.classList.add('active');
        updateCRTButton();
        return;
      }
      if (theme === 'ruby') {
        document.documentElement.removeAttribute('data-theme');
        document.getElementById('customColorPicker').value = '#e11d48';
        document.getElementById('customColorWrap').style.background = '#e11d48';
        localStorage.removeItem('edumoe-custom-color');
        localStorage.setItem('edumoe-theme', 'ruby');
        showToast('Theme: Ruby');
      } else {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('edumoe-theme', theme);
        localStorage.removeItem('edumoe-custom-color');
        const cm = { lava: '#ff5a1f', space: '#7c3aed', oxford: '#00d4ff', gray: '#6b7280', light: '#111111' };
        if (cm[theme]) { document.getElementById('customColorPicker').value = cm[theme]; document.getElementById('customColorWrap').style.background = cm[theme]; }
        showToast('Theme: ' + theme.charAt(0).toUpperCase() + theme.slice(1));
      }
      document.querySelectorAll('.theme-dot').forEach(d => d.classList.remove('active'));
      if (el) el.classList.add('active');
      updateCRTButton();
    }

    function setCustomTheme(color) {
      clearCustomInlineStyles();
      const r = parseInt(color.slice(1,3),16), g = parseInt(color.slice(3,5),16), b = parseInt(color.slice(5,7),16);
      document.documentElement.setAttribute('data-theme', 'custom');
      const root = document.documentElement;

    // ============================================================

    const COURSE = {

              notes: '<p>An <b>ordinary differential equation (ODE)</b> contains derivatives with respect to a single independent variable. A <b>partial differential equation (PDE)</b> has derivatives with respect to multiple variables.</p><p><b>Order:</b> The order of the highest derivative in the equation.</p><p><b>Degree:</b> The power of the highest derivative (after clearing radicals).</p><p><b>Linear vs nonlinear:</b> An ODE is linear if the dependent variable and its derivatives appear to the first power and are not multiplied together. If <code>y</code> appears as <code>y²</code>, <code>sin(y)</code>, or <code>y·y\'</code>, it is nonlinear.</p><div class="callout"><b>Exam trap:</b> <code>y\'\' + sin(y) = 0</code> is <b>nonlinear</b> because of <code>sin(y)</code>, even though it has no higher powers of derivatives.</div>',

            { title: 'Linear First-Order ODEs', dur: '22:10', done: false, video: '',
              notes: '<p>Standard form: <code>dy/dx + P(x)y = Q(x)</code>.</p><p><b>Integrating factor:</b> <code>μ = e^{∫P(x)dx}</code>.</p><p>Multiply through by μ, then the left side becomes <code>(μy)\'</code>, integrate both sides, solve for y.</p><div class="callout"><b>Exam trap:</b> Don\'t forget to divide by the coefficient of <code>dy/dx</code> <b>before</b> finding the integrating factor. The equation must be in standard form <code>dy/dx + P(x)y = Q(x)</code>.</div>' },

        },

              notes: '<p>When an equation is not exact, we can sometimes multiply by an integrating factor to make it exact.</p><p><b>Type 1:</b> If <code>(∂M/∂y - ∂N/∂x)/N</code> is a function of x only, then <code>μ = e^{∫f(x)dx}</code>.</p><p><b>Type 2:</b> If <code>(∂M/∂y - ∂N/∂x)/M</code> is a function of y only, then <code>μ = e^{∫g(y)dy}</code>.</p><div class="callout"><b>Exam trap:</b> The formulas for Type 1 and Type 2 use different numerators. Type 1 uses <code>My - Nx</code>, Type 2 uses <code>Nx - My</code> (opposite signs!).</div>' },

    // ============================================================
    // QUIZ ENGINE
    // ============================================================
    function generateQuiz(lecture) {
      // Auto-generate 3 questions from lecture content
      // For demo, we use a template based on the lecture title
      const title = lecture.title.toLowerCase();
      let questions = [];

      if (title.includes('ode') || title.includes('differential')) {
        questions = [
          { q: 'What is the order of the ODE: y\'\' + 2y\' + 5y = 0?', choices: ['1', '2', '3', '4'], correct: 1,
            exp: 'The highest derivative is y\'\' (second derivative).' },
          { q: 'When is an ODE considered linear?', choices: ['When y appears to the first power only',
              'When y and derivatives are not multiplied together', 'Both A and B', 'None of the above'
            ], correct: 2, exp: 'Linear means y and its derivatives appear to the first power and are not multiplied together.' },
          { q: 'What is the characteristic equation for y\'\' + 3y\' + 2y = 0?', choices: ['r²+3r+2=0', 'r²-3r+2=0',
              'r²+3r-2=0', 'r²-3r-2=0'
            ], correct: 0, exp: 'Substitute y=e^(rx) to get r²+3r+2=0.' },
        ];
      } else if (title.includes('separable')) {
        questions = [
          { q: 'Which equation is separable?', choices: ['dy/dx = x + y', 'dy/dx = x/y', 'dy/dx = x² + y²',
              'dy/dx = sin(x+y)'
            ], correct: 1, exp: 'dy/dx = x/y → y dy = x dx, which separates variables.' },
          { q: 'After separating dy/dx = 2xy, what is the next step?', choices: ['Integrate both sides',
              'Divide by y', 'Multiply by dx', 'Both B and C'
            ], correct: 3, exp: 'dy/y = 2x dx → then integrate both sides.' },
          { q: 'What is the solution to dy/dx = 2xy?', choices: ['y = Ce^{x²}', 'y = Ce^{-x²}', 'y = C sin(x²)',
              'y = C cos(x²)'
            ], correct: 0, exp: 'dy/y = 2x dx → ln|y| = x² + C → y = Ce^{x²}.' },
        ];
      } else if (title.includes('exact')) {
        questions = [
          { q: 'What is the exactness test for M dx + N dy = 0?', choices: ['∂M/∂x = ∂N/∂y', '∂M/∂y = ∂N/∂x',
              '∂M/∂x = ∂N/∂x', '∂M/∂y = ∂N/∂y'
            ], correct: 1, exp: 'The exactness test is ∂M/∂y = ∂N/∂x.' },
          { q: 'If an equation is exact, the solution is of the form…', choices: ['F(x,y) = 0', 'F(x,y) = C',
              'dy/dx = F(x,y)', 'M dx + N dy = C'
            ], correct: 1, exp: 'Exact equations have solutions F(x,y) = C.' },
          { q: 'What is the integrating factor for a non-exact equation?', choices: ['A function that makes it exact',
              'A function that makes it linear', 'A function that makes it separable', 'A constant'
            ], correct: 0, exp: 'An integrating factor is a function that, when multiplied by the equation, makes it exact.' },
        ];
      } else {
        // Default questions
        questions = [
          { q: 'What is the order of an ODE?', choices: ['The highest derivative present', 'The power of the highest derivative',
              'The number of terms', 'The degree of the equation'
            ], correct: 0, exp: 'Order = the highest derivative in the equation.' },
          { q: 'What is the degree of an ODE?', choices: ['The power of the highest derivative',
              'The highest derivative present', 'The number of terms', 'The order of the equation'
            ], correct: 0, exp: 'Degree = the power of the highest derivative (after clearing radicals).' },
          { q: 'What makes an ODE linear?', choices: ['y appears to the first power', 'Derivatives are not multiplied',
              'Both A and B', 'None of the above'
            ], correct: 2, exp: 'Linear means y and its derivatives appear to the first power and are not multiplied together.' },
        ];
      }

      return questions;
    }

    let quizAnswered = {};

    function answerQuiz(qi, ci) {
      const key = 'q' + qi;
      if (quizAnswered[key]) return;
      quizAnswered[key] = true;

      const container = document.getElementById('quizContainer');
      const opts = container.querySelectorAll(`[data-q="${qi}"]`);
      const correct = parseInt(opts[0].dataset.correct);
      const fb = document.getElementById('quizFb' + qi);

      opts.forEach((o, idx) => {
        o.classList.add('disabled');
        if (idx === correct) o.classList.add('correct');
        else if (idx === ci && ci !== correct) o.classList.add('wrong');
      });

      const isCorrect = ci === correct;
      fb.className = 'quiz-feedback show ' + (isCorrect ? 'right' : 'wrong');
      fb.innerHTML = `<div class="fb-title"><i class="ic" data-ic="${isCorrect ? 'check' : 'x'}"></i> ${isCorrect ? 'Correct!' : 'Not quite'}</div>${isCorrect ? 'Great job!' : 'The correct answer was ' + String.fromCharCode(65 + correct)}`;

      if (isCorrect) {
        // Unlock simulator if all questions answered correctly
        const allAnswered = container.querySelectorAll('.quiz-option.disabled').length === opts.length;
        if (allAnswered) {
          // Could trigger a special state here
        }
      }

      injectIcons(fb);
    }

    function toggleDoneLec(idx) {
      toggleDone(idx);
      openLecture(idx);
    }

    // ============================================================
    // TAB SWITCHING
    // ============================================================
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.toggle('active', t.id === 'tab-' + tab));
    }

    // ============================================================
    // MOEAI CHAT (embedded)
    // ============================================================
    function sendChatMessage() {
      const input = document.getElementById('chatInput');
      const msg = input.value.trim();
      if (!msg) return;
      const container = document.getElementById('chatMessages');
      container.innerHTML += `<div class="msg user">${msg}</div>`;
      input.value = '';
      container.scrollTop = container.scrollHeight;

      setTimeout(() => {
        const responses = [
          "That's a great question about this lecture! Let me explain...",
          "According to the course notes, the key idea here is...",
          "I can help with that. Would you like a step-by-step example?",
          "This is covered in the section you just watched. The main takeaway is...",
          "Let me break that down for you. First, recall that..."
        ];
        const reply = responses[Math.floor(Math.random() * responses.length)];
        container.innerHTML += `<div class="msg ai">${reply}</div>`;
        container.scrollTop = container.scrollHeight;
      }, 500);
    }

    // ============================================================
    // SIDEBAR TOGGLE (mobile)
    // ============================================================
    function toggleSidebar() {
      const s = document.getElementById('sidebar');
      const b = document.querySelector('.sidebar-backdrop');
      s.classList.toggle('open');
      if (b) b.classList.toggle('show');
    }

    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      const b = document.querySelector('.sidebar-backdrop');
      if (b) b.classList.remove('show');
    }

    // ============================================================
    // KEYBOARD SHORTCUTS
    // ============================================================
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' && !e.ctrlKey && !e.metaKey) {
        if (currentLecIdx < FLAT.length - 1) {
          e.preventDefault();
          openLecture(currentLecIdx + 1);
        }
      }
      if (e.key === 'ArrowLeft' && !e.ctrlKey && !e.metaKey) {
        if (currentLecIdx > 0) {
          e.preventDefault();
          openLecture(currentLecIdx - 1);
        }
      }
      if (e.key === 'c' || e.key === 'C') {
        if (!e.ctrlKey && !e.metaKey) {
          toggleDoneLec(currentLecIdx);
        }
      }
    });

    // ============================================================
    // UPDATE PROGRESS
    // ============================================================
    function updateProgress() {
      const p = getProgress();
      document.getElementById('sideProgFill').style.width = p.pct + '%';
      document.getElementById('sideProgText').textContent = p.done + ' of ' + p.total + ' done';
      document.getElementById('sideProgPct').textContent = p.pct + '%';
    }

    // ============================================================
    // INIT
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
      // Create sidebar backdrop for mobile
      const backdrop = document.createElement('div');
      backdrop.className = 'sidebar-backdrop';
      backdrop.onclick = closeSidebar;
      document.querySelector('.lecture-layout').prepend(backdrop);

      renderSidebar();
      openLecture(0);
      injectIcons();

      // Render KaTeX on the whole page after initial load
      if (typeof renderMathInElement === 'function') {
        setTimeout(() => {
          try {
            renderMathInElement(document.body, {
              delimiters: [
                { left: '$$', right: '$$', display: true },
                { left: '\\[', right: '\\]', display: true },
                { left: '\\(', right: '\\)', display: false }
              ],
              throwOnError: false
            });
          } catch (e) {}
        }, 500);
      }

      console.log('📚 EDUMOE Ultimate Lecture Page loaded.');
    });

    // Expose functions globally
    window.openLecture = openLecture;
    window.toggleUnit = toggleUnit;
    window.switchTab = switchTab;
    window.toggleDoneLec = toggleDoneLec;
    window.toggleSidebar = toggleSidebar;
    window.closeSidebar = closeSidebar;
    window.sendChatMessage = sendChatMessage;
    window.answerQuiz = answerQuiz;
    window.showToast = showToast;
    window.setTheme = setTheme;
    window.setCustomTheme = setCustomTheme;
    window.toggleCRT = toggleCRT;
  </script>
</body>
</html>
