<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>EDUMOE · Ultimate Quizzes</title>

  <!-- Fonts & KaTeX -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <style>
    /* =============================================================
       EDUMOE V2 – ULTIMATE QUIZZES (FIXED KATEX)
       350+ questions, proper math rendering, full glass UI
       ============================================================= */
    :root {
      --bg1: #0a0a0f;
      --bg2: #111118;
      --bg3: #1a1a2a;
      --accent: #e11d48;
      --accent2: #f43f5e;
      --accent3: #fb7185;
      --accent-glow: rgba(225, 29, 72, 0.35);
      --glow: rgba(225, 29, 72, 0.28);
      --glow2: rgba(225, 29, 72, 0.12);
      --glass-border: rgba(225, 29, 72, 0.18);
      --glass-border2: rgba(225, 29, 72, 0.32);
      --txt1: #fff0f5;
      --txt2: rgba(255, 192, 208, 0.75);
      --txt3: rgba(192, 128, 144, 0.50);
      --tint: rgba(225, 29, 72, 0.05);
      --tint2: rgba(225, 29, 72, 0.10);
      --tint3: rgba(225, 29, 72, 0.18);
      --c-glass: #c8a0a8;
      --c-light: #ffe0e8;
      --c-dark: #300010;
      --reflex-l: 0.45;
      --reflex-d: 1.7;
      --sat: 190%;
      --glass-blur: 14px;
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-xl: 32px;
      --shadow: 0 8px 32px rgba(0,0,0,0.3);
      --ok: #4fff8f;
      --okbg: rgba(79,255,143,0.12);
      --okbd: rgba(79,255,143,0.35);
      --no: #ff6b6b;
      --nobg: rgba(255,107,107,0.10);
      --nobd: rgba(255,107,107,0.30);
      --warn: #ffb347;
      --warnbg: rgba(255,179,71,0.10);
    }

    [data-theme="lava"] { --bg1:#0c0c0e;--bg2:#161618;--bg3:#202024;--accent:#ff5a1f;--accent2:#ff8c42;--accent3:#ffb347;--accent-glow:rgba(255,90,31,0.35);--glow:rgba(255,90,31,0.28);--glow2:rgba(255,90,31,0.12);--glass-border:rgba(255,90,31,0.18);--glass-border2:rgba(255,90,31,0.32);--txt1:#fff;--txt2:rgba(255,255,255,0.70);--txt3:rgba(255,255,255,0.40);--tint:rgba(255,255,255,0.05);--tint2:rgba(255,255,255,0.10);--tint3:rgba(255,255,255,0.18);--c-glass:#c8c8c9;--c-light:#fff;--c-dark:#000;--reflex-l:0.35;--reflex-d:1.8;--sat:180%; }
    [data-theme="space"] { --bg1:#000;--bg2:#0a0a14;--bg3:#141428;--accent:#7c3aed;--accent2:#a855f7;--accent3:#c084fc;--accent-glow:rgba(124,58,237,0.35);--glow:rgba(124,58,237,0.28);--glow2:rgba(124,58,237,0.12);--glass-border:rgba(124,58,237,0.18);--glass-border2:rgba(124,58,237,0.32);--txt1:#f0e8ff;--txt2:#c8b0ff;--txt3:#a080e0;--tint:rgba(124,58,237,0.05);--tint2:rgba(124,58,237,0.10);--tint3:rgba(124,58,237,0.18);--c-glass:#b0a0d0;--c-light:#e8d8ff;--c-dark:#1a0030;--reflex-l:0.50;--reflex-d:1.6;--sat:200%; }
    [data-theme="oxford"] { --bg1:#000510;--bg2:#020a18;--bg3:#081530;--accent:#00d4ff;--accent2:#00f0ff;--accent3:#80f8ff;--accent-glow:rgba(0,212,255,0.35);--glow:rgba(0,212,255,0.28);--glow2:rgba(0,212,255,0.12);--glass-border:rgba(0,212,255,0.18);--glass-border2:rgba(0,212,255,0.32);--txt1:#e0fcff;--txt2:#80d8f0;--txt3:#40b0d0;--tint:rgba(0,212,255,0.05);--tint2:rgba(0,212,255,0.10);--tint3:rgba(0,212,255,0.18);--c-glass:#80e8f8;--c-light:#e0fcff;--c-dark:#000810;--reflex-l:0.55;--reflex-d:1.5;--sat:200%; }
    [data-theme="gray"] { --bg1:#0f0f12;--bg2:#18181b;--bg3:#22222a;--accent:#6b7280;--accent2:#9ca3af;--accent3:#d1d5db;--accent-glow:rgba(107,114,128,0.35);--glow:rgba(107,114,128,0.28);--glow2:rgba(107,114,128,0.12);--glass-border:rgba(107,114,128,0.18);--glass-border2:rgba(107,114,128,0.32);--txt1:#f3f4f6;--txt2:#9ca3af;--txt3:#6b7280;--tint:rgba(107,114,128,0.05);--tint2:rgba(107,114,128,0.10);--tint3:rgba(107,114,128,0.18);--c-glass:#c8c8c9;--c-light:#fff;--c-dark:#000;--reflex-l:0.35;--reflex-d:1.8;--sat:120%; }
    [data-theme="light"] { --bg1:#fff;--bg2:#f4f4f6;--bg3:#e8e8ec;--accent:#111;--accent2:#333;--accent3:#555;--accent-glow:rgba(0,0,0,0.12);--glow:rgba(0,0,0,0.12);--glow2:rgba(0,0,0,0.06);--glass-border:rgba(0,0,0,0.10);--glass-border2:rgba(0,0,0,0.20);--txt1:#1a1a1a;--txt2:#555;--txt3:#888;--tint:rgba(0,0,0,0.03);--tint2:rgba(0,0,0,0.06);--tint3:rgba(0,0,0,0.12);--c-glass:#000;--c-light:#fff;--c-dark:#000;--reflex-l:0.06;--reflex-d:0.6;--sat:100%; }
    [data-theme="custom"] { --bg1:#0a0a0f;--bg2:#111118;--bg3:#1a1a2a;--accent:var(--custom-accent,#e11d48);--accent2:var(--custom-accent2,#f43f5e);--accent3:var(--custom-accent3,#fb7185);--accent-glow:var(--custom-glow,rgba(225,29,72,0.35));--glow:var(--custom-glow,rgba(225,29,72,0.28));--glow2:var(--custom-glow2,rgba(225,29,72,0.12));--glass-border:var(--custom-border,rgba(225,29,72,0.18));--glass-border2:var(--custom-border2,rgba(225,29,72,0.32));--txt1:#fff0f5;--txt2:#ffc0d0;--txt3:#c08090;--tint:var(--custom-tint,rgba(225,29,72,0.05));--tint2:var(--custom-tint2,rgba(225,29,72,0.10));--tint3:var(--custom-tint3,rgba(225,29,72,0.16));--c-glass:#c8a0a8;--c-light:#ffe0e8;--c-dark:#300010;--reflex-l:0.45;--reflex-d:1.7;--sat:190%; }
    [data-theme="terminal"] { --bg1:#050a05;--bg2:#071007;--bg3:#0a180a;--accent:#4fff8f;--accent2:#6effa0;--accent3:#9dffc0;--accent-glow:rgba(79,255,143,0.35);--glow:rgba(79,255,143,0.28);--glow2:rgba(79,255,143,0.10);--glass-border:rgba(79,255,143,0.18);--glass-border2:rgba(79,255,143,0.32);--txt1:#b8ffcf;--txt2:#4fff8f;--txt3:#2f8f57;--tint:rgba(79,255,143,0.04);--tint2:rgba(79,255,143,0.08);--tint3:rgba(79,255,143,0.14);--c-glass:#4fff8f;--c-light:#b8ffcf;--c-dark:#001a08;--reflex-l:0.20;--reflex-d:1.2;--sat:130%;--glass-blur:8px;--shadow:0 8px 32px rgba(0,0,0,0.6); }
    [data-theme="terminal"] body,.brand,.mode-tab{font-family:'Fira Code',monospace !important;letter-spacing:0 !important;}
    [data-theme="terminal"] .brand-mark{background:var(--accent)!important;color:#000!important;}

    .crt-overlay{display:none;position:fixed;inset:0;z-index:9998;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,0.10)0px,rgba(0,0,0,0.10)1px,transparent 1px,transparent 3px);mix-blend-mode:multiply;}
    [data-theme="terminal"] .crt-overlay{display:block;}
    [data-theme="terminal"]:not(.no-crt) body{animation:crt-flicker 4s infinite;}
    @keyframes crt-flicker{0%,95%,100%{opacity:1}96%{opacity:0.94}98%{opacity:0.98}}
    html.no-crt .crt-overlay{display:none!important;}
    html.no-crt [data-theme="terminal"] body{animation:none!important;}
    @media(prefers-reduced-motion:reduce){[data-theme="terminal"] body{animation:none!important}.crt-overlay{background:none}}

    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%}
    body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg1);color:var(--txt1);min-height:100vh;overflow-x:hidden;transition:background .5s ease,color .4s ease;padding-bottom:72px}
    .ic{display:inline-flex;align-items:center;justify-content:center;width:1em;height:1em;vertical-align:-.125em}
    .ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .ic.fill svg{fill:currentColor;stroke:none}
    .lg{position:relative;isolation:isolate}
    .lg-effect{position:absolute;inset:0;z-index:0;border-radius:inherit;backdrop-filter:blur(var(--glass-blur,14px)) saturate(var(--sat));-webkit-backdrop-filter:blur(var(--glass-blur,14px)) saturate(var(--sat));overflow:hidden}
    .lg-tint{position:absolute;inset:0;z-index:1;border-radius:inherit;background:var(--tint);transition:background .4s ease}
    .lg-shine{position:absolute;inset:0;z-index:2;border-radius:inherit;overflow:hidden;box-shadow:inset 2px 3px 0 -1.5px color-mix(in srgb,var(--c-light) calc(var(--reflex-l)*90%),transparent),inset 0 0 0 1px color-mix(in srgb,var(--c-light) calc(var(--reflex-l)*12%),transparent),inset -2px -2px 0 -1px color-mix(in srgb,var(--c-light) calc(var(--reflex-l)*70%),transparent),inset -2px -7px 1px -5px color-mix(in srgb,var(--c-light) calc(var(--reflex-l)*55%),transparent),inset 0 -1px 4px 0 color-mix(in srgb,var(--c-dark) calc(var(--reflex-d)*10%),transparent),inset -1.5px 2.5px 0 -2px color-mix(in srgb,var(--c-dark) calc(var(--reflex-d)*18%),transparent),inset 0 3px 5px -2px color-mix(in srgb,var(--c-dark) calc(var(--reflex-d)*16%),transparent),inset 2px -6px 1px -4px color-mix(in srgb,var(--c-dark) calc(var(--reflex-d)*8%),transparent),0 1px 6px 0 color-mix(in srgb,var(--c-dark) calc(var(--reflex-d)*10%),transparent),0 8px 20px 0 color-mix(in srgb,var(--c-dark) calc(var(--reflex-d)*8%),transparent),0 0 40px -10px var(--glow2)}
    .lg>:not(.lg-effect):not(.lg-tint):not(.lg-shine){position:relative;z-index:3}
    .lg-pill{border-radius:999px}
    .lg-card{border-radius:var(--radius-lg)}
    .lg-panel{border-radius:var(--radius-xl)}

    .topbar{display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid var(--glass-border);background:var(--bg2);position:sticky;top:0;z-index:100;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);flex-wrap:wrap}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.03em;text-decoration:none;color:var(--txt1);font-size:18px}
    .brand-mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font-size:14px;box-shadow:0 4px 12px var(--accent-glow)}
    .brand small{color:var(--txt3);font-weight:500;font-size:12px}
    .topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .theme-switcher{display:flex;align-items:center;gap:4px;padding:4px 6px;border:1px solid var(--glass-border);border-radius:999px;background:var(--tint);flex-wrap:wrap}
    .theme-dot{width:14px;height:14px;border-radius:50%;border:1.5px solid transparent;cursor:pointer;transition:transform .2s,border-color .2s;flex-shrink:0}
    .theme-dot:hover{transform:scale(1.25)}
    .theme-dot.active{border-color:var(--txt1);transform:scale(1.1)}
    .td-ruby{background:#e11d48}.td-lava{background:#ff5a1f}.td-space{background:#7c3aed}.td-oxford{background:#00d4ff}.td-gray{background:#6b7280}.td-light{background:#ddd;border:1px solid #aaa}.td-terminal{background:#4fff8f;box-shadow:0 0 8px rgba(79,255,143,0.6)}
    .custom-color-wrap{position:relative;width:20px;height:20px;border-radius:50%;overflow:hidden;border:2px solid var(--glass-border);cursor:pointer;flex-shrink:0;background:var(--accent)}
    .custom-color-wrap input[type=color]{position:absolute;top:-4px;left:-4px;width:calc(100%+8px);height:calc(100%+8px);border:none;padding:0;cursor:pointer;background:none}
    .custom-color-wrap input[type=color]::-webkit-color-swatch-wrapper{padding:0}
    .custom-color-wrap input[type=color]::-webkit-color-swatch{border:none;border-radius:50%}
    .crt-toggle{display:none;width:28px;height:28px;border-radius:999px;border:1px solid var(--glass-border);background:var(--tint2);color:var(--txt2);cursor:pointer;font-size:12px;align-items:center;justify-content:center;transition:all .2s}
    .crt-toggle:hover{color:var(--txt1);border-color:var(--accent2)}
    [data-theme="terminal"] .crt-toggle{display:inline-flex}
    .crt-toggle.off{opacity:.4}
    .btn-back{padding:7px 14px;border-radius:999px;border:1px solid var(--glass-border);background:var(--tint);color:var(--txt2);font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
    .btn-back:hover{background:var(--tint2);color:var(--txt1);border-color:var(--accent2)}
    .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;border:1px solid var(--glass-border);background:var(--tint);color:var(--txt1);cursor:pointer;font-family:inherit;text-decoration:none;transition:all .16s}
    .btn:hover{border-color:var(--accent2);background:var(--tint2);transform:translateY(-1px)}
    .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;box-shadow:0 4px 14px var(--accent-glow)}
    .btn-primary:hover{box-shadow:0 6px 24px var(--accent-glow);transform:translateY(-2px)}
    .btn-sm{padding:6px 12px;font-size:12px}
    .btn-danger{border-color:rgba(239,68,68,0.3);color:#f87171}
    .btn-danger:hover{background:rgba(239,68,68,0.12);border-color:#ef4444}

    .wrap{max-width:1200px;margin:0 auto;padding:0 24px;height:100%;display:flex;flex-direction:column}
    .page-head{flex-shrink:0;margin-bottom:26px}
    .page-head h1{font-size:32px;font-weight:900;letter-spacing:-.03em;display:flex;align-items:center;gap:12px}
    .page-head h1 .ic{color:var(--accent2)}
    .page-head p{color:var(--txt3);font-size:14px;margin-top:5px}
    .page-head .kbd-hint{font-size:11px;color:var(--txt3);margin-top:6px;opacity:.7}
    .page-head .kbd-hint kbd{padding:1px 6px;border-radius:4px;background:var(--tint2);border:1px solid var(--glass-border);font-family:'Fira Code',monospace;font-size:10px}
    .stats-row{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
    .stat-pill{padding:4px 14px;border-radius:999px;background:var(--tint2);border:1px solid var(--glass-border);font-size:11px;color:var(--txt2);display:flex;align-items:center;gap:6px}
    .stat-pill .num{color:var(--accent2);font-weight:700;font-family:'Fira Code',monospace}

    .tabs{display:flex;gap:4px;background:var(--tint);padding:4px;border-radius:12px;border:1px solid var(--glass-border);margin-bottom:26px;flex-wrap:wrap;flex-shrink:0}
    .mode-tab{padding:9px 18px;border-radius:9px;font-size:13.5px;font-weight:600;border:none;background:none;color:var(--txt3);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:7px;transition:all .18s}
    .mode-tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 12px var(--accent-glow)}
    .mode-tab:not(.active):hover{color:var(--txt1);background:var(--tint2)}
    .mode-tab .badge{background:rgba(255,255,255,0.15);padding:1px 6px;border-radius:999px;font-size:9px;font-weight:700}
    .mode-tab.active .badge{background:rgba(0,0,0,0.2)}
    .view{display:none;flex-direction:column;flex:1;min-height:50vh}
    .view.active{display:flex}

    .quiz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
    .quiz-card{position:relative;padding:20px;border-radius:var(--radius-md);background:var(--tint);border:1px solid var(--glass-border);cursor:pointer;transition:transform .25s,border-color .25s,box-shadow .25s;overflow:hidden;animation:card-in .4s ease both}
    .quiz-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent3));opacity:.7}
    .quiz-card:hover{transform:translateY(-4px);border-color:var(--accent2);box-shadow:0 12px 40px rgba(0,0,0,0.25)}
    .quiz-card .qc-icon{width:42px;height:42px;border-radius:11px;background:var(--tint2);border:1px solid var(--glass-border);display:grid;place-items:center;color:var(--accent3);font-size:18px;margin-bottom:12px;transition:transform .3s}
    .quiz-card:hover .qc-icon{transform:rotate(-6deg) scale(1.08)}
    .quiz-card h3{font-size:16px;font-weight:700;letter-spacing:-.01em}
    .quiz-card .qc-sub{font-size:12px;color:var(--txt3);margin-top:2px}
    .quiz-card .qc-meta{display:flex;gap:14px;margin-top:12px;font-size:11px;color:var(--txt3);flex-wrap:wrap}
    .quiz-card .qc-meta span{display:flex;align-items:center;gap:4px}
    .quiz-card .qc-badge{position:absolute;top:14px;right:14px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:999px;animation:badge-pop .4s ease}
    @keyframes badge-pop{from{transform:scale(0)}to{transform:scale(1)}}
    .quiz-card .qc-badge.passed{background:var(--okbg);color:var(--ok);border:1px solid var(--okbd)}
    .quiz-card .qc-badge.attempted{background:var(--warnbg);color:var(--warn);border:1px solid rgba(255,179,71,0.3)}
    .quiz-card .qc-progress{height:3px;background:var(--tint2);border-radius:2px;margin-top:10px;overflow:hidden}
    .quiz-card .qc-progress-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent3));transition:width .8s ease}
    .quiz-card .qc-tag{font-size:9px;padding:1px 8px;border-radius:999px;background:var(--tint2);color:var(--txt3);display:inline-block;margin-top:4px}
    @keyframes card-in{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}

    .qp-setup{max-width:560px}
    .qp-setup .field{margin-bottom:14px}
    .qp-setup label{display:block;font-size:12px;font-weight:600;color:var(--txt2);margin-bottom:6px}
    .chip-row{display:flex;gap:6px;flex-wrap:wrap}
    .chip{padding:7px 14px;border-radius:999px;border:1px solid var(--glass-border);background:var(--tint);color:var(--txt2);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;user-select:none}
    .chip:hover{border-color:var(--accent2);color:var(--txt1)}
    .chip.active{background:var(--tint3);border-color:var(--accent2);color:var(--txt1)}
    .qp-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px;background:var(--tint);border-radius:var(--radius-md);border:1px solid var(--glass-border);margin:12px 0}
    .qp-stat{text-align:center}
    .qp-stat .num{font-size:20px;font-weight:800;color:var(--accent2);font-family:'Fira Code',monospace}
    .qp-stat .lbl{font-size:10px;color:var(--txt3);margin-top:2px}

    .runner{max-width:740px;margin:0 auto;width:100%}
    .runner-top{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
    .runner-top .q-count{font-size:12px;color:var(--txt3);font-weight:600;font-family:'Fira Code',monospace}
    .runner-bar{flex:1;height:5px;border-radius:99px;background:var(--tint2);overflow:hidden;min-width:40px}
    .runner-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent3));transition:width .4s ease}
    .q-scorechip{font-size:13px;font-weight:700;font-family:'Fira Code',monospace;color:var(--txt2);display:flex;align-items:center;gap:6px}
    .q-scorechip .streak{color:var(--warn);font-size:12px}
    .q-timer{font-size:13px;font-family:'Fira Code',monospace;color:var(--txt3);display:flex;align-items:center;gap:4px}
    .q-timer.warning{color:var(--warn)}
    .q-timer.danger{color:var(--no);animation:pulse .8s ease infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

    .q-card{padding:24px;border-radius:var(--radius-lg);background:var(--bg2);border:1px solid var(--glass-border);position:relative}
    .q-topic{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent3);font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .q-topic .q-diff{font-size:8px;text-transform:none;padding:1px 6px;border-radius:999px;background:var(--tint2);font-weight:600}
    .q-topic .q-diff.easy{color:var(--ok)}
    .q-topic .q-diff.medium{color:var(--warn)}
    .q-topic .q-diff.hard{color:var(--no)}
    .q-text{font-size:18px;font-weight:600;line-height:1.5;margin-bottom:18px}
    .q-text .katex{font-size:1.1em}
    .q-text code{font-family:'Fira Code',monospace;font-size:15px;background:var(--tint2);padding:2px 7px;border-radius:4px;color:var(--accent2)}
    .q-text pre{font-family:'Fira Code',monospace;font-size:13px;background:var(--bg1);border:1px solid var(--glass-border);border-radius:8px;padding:12px;margin:10px 0;overflow-x:auto;line-height:1.5;color:#abb2bf}
    .q-bookmark{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--txt3);cursor:pointer;font-size:17px;transition:all .2s;padding:4px;border-radius:999px;z-index:5}
    .q-bookmark:hover{color:var(--accent2);background:var(--tint)}
    .q-bookmark.bookmarked{color:var(--warn)}
    .q-bookmark.bookmarked:hover{color:var(--warn)}

    .options{display:flex;flex-direction:column;gap:8px}
    .option{display:flex;align-items:center;gap:11px;padding:12px 16px;border-radius:10px;border:1px solid var(--glass-border);background:var(--tint);cursor:pointer;font-size:14px;transition:all .15s;text-align:left;font-family:inherit;color:var(--txt1)}
    .option:hover:not(:disabled){border-color:var(--accent2);background:var(--tint2);transform:translateX(4px)}
    .option:disabled{cursor:default;opacity:.7}
    .option .opt-letter{width:26px;height:26px;border-radius:7px;background:var(--tint2);border:1px solid var(--glass-border);display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0;transition:all .15s}
    .option.correct{border-color:var(--okbd);background:var(--okbg)}
    .option.correct .opt-letter{background:var(--ok);border-color:var(--ok);color:#04140a}
    .option.wrong{border-color:var(--nobd);background:var(--nobg)}
    .option.wrong .opt-letter{background:var(--no);border-color:var(--no);color:#160404}
    .option .opt-check{margin-left:auto;opacity:0;transition:opacity .2s;color:var(--ok)}
    .option.correct .opt-check,.option.wrong .opt-check{opacity:1}
    .option.wrong .opt-check{color:var(--no)}

    .feedback{margin-top:16px;padding:14px 16px;border-radius:10px;font-size:13px;line-height:1.6;display:none;animation:fade-up .3s ease}
    .feedback.show{display:block}
    .feedback.right{background:var(--okbg);border:1px solid var(--okbd)}
    .feedback.wrong{background:var(--nobg);border:1px solid var(--nobd)}
    .feedback .fb-title{font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:6px;font-size:14px}
    .feedback.right .fb-title{color:var(--ok)}
    .feedback.wrong .fb-title{color:var(--no)}
    .feedback .fb-exp{color:var(--txt2)}
    @keyframes fade-up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

    .runner-actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px;flex-wrap:wrap;gap:8px}
    .runner-actions .left{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
    .runner-actions .right{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
    .kb-hint{font-size:10px;color:var(--txt3);display:flex;align-items:center;gap:5px;opacity:.6}
    .kb-hint kbd{padding:1px 5px;border-radius:3px;background:var(--tint2);border:1px solid var(--glass-border);font-size:9px;font-family:'Fira Code',monospace}

    .results{max-width:560px;margin:30px auto;text-align:center}
    .result-ring{width:140px;height:140px;margin:0 auto 16px;position:relative}
    .result-ring svg{transform:rotate(-90deg)}
    .result-ring .ring-bg{stroke:var(--tint2)}
    .result-ring .ring-fg{stroke-linecap:round;transition:stroke-dashoffset 1.2s ease}
    .result-pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .result-pct .big{font-size:34px;font-weight:900;letter-spacing:-.03em}
    .result-pct .lbl{font-size:11px;color:var(--txt3)}
    .result-verdict{font-size:22px;font-weight:800;margin-bottom:4px}
    .result-verdict.pass{color:var(--ok)}
    .result-verdict.fail{color:var(--no)}
    .result-sub{color:var(--txt3);font-size:13px;margin-bottom:20px;max-width:400px;margin-left:auto;margin-right:auto}
    .result-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
    .result-stat{padding:10px;background:var(--tint);border-radius:var(--radius-sm);border:1px solid var(--glass-border)}
    .result-stat .num{font-size:18px;font-weight:800;color:var(--accent2);font-family:'Fira Code',monospace}
    .result-stat .lbl{font-size:9px;color:var(--txt3);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
    .result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

    .history-section{margin-top:12px}
    .history-section h3{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
    .history-item{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-radius:var(--radius-sm);background:var(--tint);border:1px solid var(--glass-border);margin-bottom:5px;font-size:12px;flex-wrap:wrap;gap:4px}
    .history-item .h-subject{font-weight:600}
    .history-item .h-score{font-weight:700;font-family:'Fira Code',monospace}
    .history-item .h-score.pass{color:var(--ok)}
    .history-item .h-score.fail{color:var(--no)}
    .history-item .h-date{font-size:10px;color:var(--txt3)}
    .history-item .h-detail{font-size:10px;color:var(--txt3)}

    .analytics-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:10px}
    .analytics-card{padding:12px;background:var(--tint);border-radius:var(--radius-sm);border:1px solid var(--glass-border);text-align:center}
    .analytics-card .subj{font-size:11px;font-weight:600;color:var(--txt2)}
    .analytics-card .score{font-size:16px;font-weight:800;color:var(--accent2);margin:2px 0}
    .analytics-card .bar{height:3px;background:var(--tint2);border-radius:2px;overflow:hidden;margin-top:4px}
    .analytics-card .bar-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent3));transition:width 1s ease}
    .analytics-card .count{font-size:9px;color:var(--txt3);margin-top:2px}

    .bookmark-item{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:var(--radius-sm);background:var(--tint);border:1px solid var(--glass-border);margin-bottom:5px;font-size:12px;cursor:pointer;transition:background .15s}
    .bookmark-item:hover{background:var(--tint2)}
    .bookmark-item .b-subject{font-weight:600;color:var(--accent3);font-size:10px;text-transform:uppercase;letter-spacing:.04em}
    .bookmark-item .b-text{flex:1;color:var(--txt2)}
    .bookmark-item .b-remove{color:var(--txt3);cursor:pointer;padding:2px 6px;border-radius:4px;border:1px solid var(--glass-border);background:var(--tint);font-size:10px;transition:all .15s}
    .bookmark-item .b-remove:hover{color:var(--no);border-color:var(--no)}

    .empty-state{text-align:center;padding:40px;color:var(--txt3)}
    .empty-state .ic{font-size:36px;color:var(--txt3);opacity:.3;display:block;margin-bottom:10px}

    .toast{position:fixed;bottom:80px;right:24px;z-index:9000;padding:10px 20px;border-radius:999px;background:var(--tint2);backdrop-filter:blur(20px);border:1px solid var(--glass-border2);transform:translateX(120%);opacity:0;transition:transform .4s cubic-bezier(.2,.9,.4,1.1),opacity .3s;font-size:12px;font-weight:500}
    .toast.show{transform:translateX(0);opacity:1}

    @media(max-width:860px){.quiz-grid{grid-template-columns:1fr}.qp-stats{grid-template-columns:1fr 1fr}.result-stats{grid-template-columns:1fr 1fr}}
    @media(max-width:700px){.topbar{padding:8px 12px;gap:6px}.brand small{display:none}.theme-switcher{gap:2px;padding:2px 3px}.theme-dot{width:10px;height:10px}.custom-color-wrap{width:14px;height:14px}.btn-back span{display:none}.wrap{padding:0 12px}.page-head h1{font-size:22px}.mode-tab{font-size:11px;padding:6px 10px}.mode-tab .ic{display:none}.qp-stats{grid-template-columns:1fr 1fr}.result-stats{grid-template-columns:1fr 1fr}.q-card{padding:16px}.q-text{font-size:16px}.stats-row{gap:10px}}
    @media(max-width:450px){.topbar{padding:6px 8px}.brand{font-size:13px}.brand-mark{width:24px;height:24px;font-size:11px}.theme-switcher{gap:1px;padding:1px 2px}.theme-dot{width:8px;height:8px}.custom-color-wrap{width:12px;height:12px}.qp-stats{grid-template-columns:1fr}}
  </style>
</head>
<body>

<div class="crt-overlay" id="crtOverlay"></div>

<div class="topbar">
  <a class="brand" href="#">
    <div class="brand-mark"><i class="ic" data-ic="clipboard"></i></div>
    EDUMOE <small>· Quizzes</small>
  </a>
  <div class="topbar-right">
    <div class="theme-switcher">
      <button class="theme-dot td-ruby active" id="td-ruby" onclick="setTheme('ruby',this)"></button>
      <button class="theme-dot td-lava" id="td-lava" onclick="setTheme('lava',this)"></button>
      <button class="theme-dot td-space" id="td-space" onclick="setTheme('space',this)"></button>
      <button class="theme-dot td-oxford" id="td-oxford" onclick="setTheme('oxford',this)"></button>
      <button class="theme-dot td-gray" id="td-gray" onclick="setTheme('gray',this)"></button>
      <button class="theme-dot td-light" id="td-light" onclick="setTheme('light',this)"></button>
      <div class="custom-color-wrap" id="customColorWrap"><input type="color" id="customColorPicker" value="#e11d48"/></div>

    </div>
    <button class="crt-toggle" id="crtToggle" onclick="toggleCRT()"><i class="ic" data-ic="tv"></i></button>
    <a href="index.html" class="btn-back"><i class="ic" data-ic="arrow-left"></i> <span>Back</span></a>
  </div>
</div>

<div class="wrap">
  <div class="page-head">
    <h1><i class="ic" data-ic="clipboard"></i> Ultimate Quizzes</h1>
    <p>350+ curriculum‑aligned questions across 8 subjects — with proper math rendering, study modes, and analytics.</p>
    <div class="kbd-hint"><kbd>1-4</kbd> answer · <kbd>Enter</kbd> next · <kbd>B</kbd> bookmark · <kbd>Esc</kbd> quit</div>
    <div class="stats-row" id="statsRow">
      <div class="stat-pill">📚 <span class="num" id="totalQuizzes">8</span> subjects</div>
      <div class="stat-pill">📝 <span class="num" id="totalQuestions">0</span> questions</div>
      <div class="stat-pill">✅ <span class="num" id="passedCount">0</span> passed</div>
      <div class="stat-pill">🔥 <span class="num" id="bestStreak">0</span> best streak</div>
      <div class="stat-pill">⭐ <span class="num" id="bookmarkCount">0</span> bookmarks</div>
    </div>
  </div>

  <div class="tabs" id="modeTabs">
    <button class="mode-tab active" data-mode="browse"><i class="ic" data-ic="list"></i> Browse</button>
    <button class="mode-tab" data-mode="quick"><i class="ic" data-ic="zap"></i> Quick</button>
    <button class="mode-tab" data-mode="exam"><i class="ic" data-ic="clock"></i> Exam <span class="badge">Timed</span></button>
    <button class="mode-tab" data-mode="bookmarks"><i class="ic" data-ic="book"></i> Bookmarks <span class="badge" id="bookmarkBadge">0</span></button>
    <button class="mode-tab" data-mode="analytics"><i class="ic" data-ic="fire"></i> Analytics</button>
    <button class="mode-tab" data-mode="history"><i class="ic" data-ic="clock"></i> History</button>
  </div>

  <div class="view active" id="browseView"><div class="quiz-grid" id="quizGrid"></div></div>
  <div class="view" id="quickView"><div class="qp-setup" id="quickSetup"></div></div>
  <div class="view" id="examView"><div class="qp-setup" id="examSetup"></div></div>
  <div class="view" id="bookmarksView"><div id="bookmarksList"></div></div>
  <div class="view" id="analyticsView"><div id="analyticsContainer"></div></div>
  <div class="view" id="historyView"><div class="history-section" id="historyList"></div></div>

  <div id="runnerContainer" style="display:none;"></div>
  <div id="resultsContainer" style="display:none;"></div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span></div>

<script>
// ============================================================
// ICONS
// ============================================================
const ICONS = {
  'clipboard': '<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12l2 2 4-4"/>',

  'clock': '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/>',

  'help': '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1 .9-1 1.7"/><circle cx="12" cy="17" r="0.5" fill="currentColor" stroke="none"/>',
  'terminal': '<polyline points="5 8 9 12 5 16"/><line x1="12" y1="16" x2="18" y2="16"/><rect x="2" y="4" width="20" height="16" rx="2"/>',

  'dice': '<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/>',
  'infinity': '<path d="M6 8a4 4 0 1 0 0 8c3 0 4-4 6-4s3 4 6 4a4 4 0 1 0 0-8c-3 0-4 4-6 4S9 8 6 8z"/>',

};
function injectIcons(r){(r||document).querySelectorAll('i.ic[data-ic]').forEach(el=>{if(el.dataset.done)return;const p=ICONS[el.dataset.ic];if(p){el.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+p+'</svg>';el.dataset.done='1';}})}

// ============================================================
// THEME SYSTEM
// ============================================================
function clearCustomInlineStyles(){const r=document.documentElement;['--custom-accent','--custom-accent2','--custom-accent3','--custom-glow','--custom-glow2','--custom-border','--custom-border2','--custom-tint','--custom-tint2','--custom-tint3'].forEach(v=>r.style.removeProperty(v));document.querySelectorAll('.td-ruby,.td-lava,.td-space,.td-oxford,.td-gray,.td-light,.td-terminal').forEach(el=>{el.style.removeProperty('background');el.style.removeProperty('box-shadow')});document.getElementById('customColorWrap')?.style.removeProperty('box-shadow')}
function setTheme(t,e){clearCustomInlineStyles();if(t==='terminal'){document.documentElement.setAttribute('data-theme','terminal');localStorage.setItem('edumoe-theme','terminal');localStorage.removeItem('edumoe-custom-color');showToast('$ mode --terminal');document.querySelectorAll('.theme-dot').forEach(d=>d.classList.remove('active'));if(e)e.classList.add('active');updateCRTButton();return}if(t==='ruby'){document.documentElement.removeAttribute('data-theme');document.getElementById('customColorPicker').value='#e11d48';document.getElementById('customColorWrap').style.background='#e11d48';localStorage.removeItem('edumoe-custom-color');localStorage.setItem('edumoe-theme','ruby');showToast('Theme: Ruby')}else{document.documentElement.setAttribute('data-theme',t);localStorage.setItem('edumoe-theme',t);localStorage.removeItem('edumoe-custom-color');const c={lava:'#ff5a1f',space:'#7c3aed',oxford:'#00d4ff',gray:'#6b7280',light:'#111111'};if(c[t]){document.getElementById('customColorPicker').value=c[t];document.getElementById('customColorWrap').style.background=c[t]}showToast('Theme: '+t.charAt(0).toUpperCase()+t.slice(1))}document.querySelectorAll('.theme-dot').forEach(d=>d.classList.remove('active'));if(e)e.classList.add('active');updateCRTButton()}
function setCustomTheme(c){clearCustomInlineStyles();const r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);document.documentElement.setAttribute('data-theme','custom');const root=document.documentElement;root.style.setProperty('--custom-accent',c);root.style.setProperty('--custom-accent2',`rgb(${Math.min(r+40,255)},${Math.min(g+40,255)},${Math.min(b+40,255)})`);root.style.setProperty('--custom-accent3',`rgb(${Math.min(r+80,255)},${Math.min(g+80,255)},${Math.min(b+80,255)})`);root.style.setProperty('--custom-glow',`rgba(${r},${g},${b},0.35)`);root.style.setProperty('--custom-glow2',`rgba(${r},${g},${b},0.14)`);root.style.setProperty('--custom-border',`rgba(${r},${g},${b},0.18)`);root.style.setProperty('--custom-border2',`rgba(${r},${g},${b},0.32)`);root.style.setProperty('--custom-tint',`rgba(${r},${g},${b},0.05)`);root.style.setProperty('--custom-tint2',`rgba(${r},${g},${b},0.10)`);root.style.setProperty('--custom-tint3',`rgba(${r},${g},${b},0.16)`);document.getElementById('customColorWrap').style.background=c;document.querySelectorAll('.theme-dot').forEach(d=>d.classList.remove('active'));localStorage.setItem('edumoe-theme','custom');localStorage.setItem('edumoe-custom-color',c);updateCRTButton();showToast('🎨 Custom color')}
function toggleCRT(){const html=document.documentElement,btn=document.getElementById('crtToggle');const off=html.classList.toggle('no-crt');localStorage.setItem('edumoe-crt',off?'off':'on');if(btn)btn.classList.toggle('off',off);showToast(off?'$ crt --off':'$ crt --on')}
function updateCRTButton(){const btn=document.getElementById('crtToggle');if(!btn)return;const isTerminal=document.documentElement.getAttribute('data-theme')==='terminal';btn.style.display=isTerminal?'inline-flex':'none';btn.classList.toggle('off',document.documentElement.classList.contains('no-crt'))}
const savedTheme=localStorage.getItem('edumoe-theme')||'ruby';const savedColor=localStorage.getItem('edumoe-custom-color');if(savedTheme==='custom'&&savedColor){setCustomTheme(savedColor);document.getElementById('customColorPicker').value=savedColor}else if(savedTheme!=='ruby'&&savedTheme!=='custom'){document.documentElement.setAttribute('data-theme',savedTheme)}

// KEYBOARD SHORTCUTS
// ============================================================
document.addEventListener('keydown',e=>{
  const tabs=['browse','quick','exam','bookmarks','analytics','history'];
  const idx=parseInt(e.key)-1;
  if(idx>=0&&idx<tabs.length&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    const target=document.querySelector(`.mode-tab[data-mode="${tabs[idx]}"]`);
    if(target){setMode(tabs[idx]);e.preventDefault()}
  }
  if(state.active&&!state.finished){
    if(!state.answered&&e.key>='1'&&e.key<='4'){
      const idx=parseInt(e.key)-1;
      const opts=document.querySelectorAll('#opts .option');
      if(opts[idx]&&!opts[idx].disabled){e.preventDefault();answer(idx)}
    }else if(e.key==='Enter'&&state.answered){e.preventDefault();next()}
    else if((e.key==='b'||e.key==='B')&&state.active&&state.active.shuffled){
      const q=state.active.shuffled[state.qi];if(q){e.preventDefault();toggleBookmark(q.qid)}}
    else if(e.key==='Escape'&&state.active){if(confirm('Quit this quiz? Progress will be lost.'))quitQuiz()}
  }
});

  active:null,qi:0,answered:false,correctCount:0,streak:0,bestStreak:0,

try{const r=localStorage.getItem('edumoe_quiz_results');if(r)results=JSON.parse(r);

  const b=localStorage.getItem('edumoe_bookmarks');if(b)bookmarks=JSON.parse(b);
  const s=localStorage.getItem('edumoe_best_streak');if(s)state.bestStreak=parseInt(s);

function saveState(){
  localStorage.setItem('edumoe_quiz_results',JSON.stringify(results));
  localStorage.setItem('edumoe_quiz_history',JSON.stringify(history));
  localStorage.setItem('edumoe_bookmarks',JSON.stringify(bookmarks));
  localStorage.setItem('edumoe_best_streak',String(state.bestStreak));
  document.getElementById('bookmarkBadge').textContent=bookmarks.length;
  document.getElementById('bookmarkCount').textContent=bookmarks.length;
}

function renderMath(element){
  if(typeof renderMathInElement === 'function'){
    try{
      renderMathInElement(element, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '\\[', right: '\\]', display: true},
          {left: '\\(', right: '\\)', display: false}
        ],
        throwOnError: false
      });
    }catch(e){}
  }
}

// RENDER FUNCTIONS
// ============================================================
function setMode(mode){
  state.mode = mode;
  document.querySelectorAll('.mode-tab').forEach(t=>t.classList.toggle('active',t.dataset.mode===mode));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  const map = {browse:'browseView',quick:'quickView',exam:'examView',bookmarks:'bookmarksView',analytics:'analyticsView',history:'historyView'};
  document.getElementById(map[mode]).classList.add('active');
  if(mode==='browse')renderBrowse();
  if(mode==='quick')renderQuick();
  if(mode==='exam')renderExamSetup();
  if(mode==='history')renderHistory();
  if(mode==='analytics')renderAnalytics();
  if(mode==='bookmarks')renderBookmarks();
  injectIcons();
}

function render(){
  const passed = Object.values(results).filter(r=>r.passed).length;
  document.getElementById('passedCount').textContent = passed;
  document.getElementById('bestStreak').textContent = state.bestStreak||0;
  document.getElementById('bookmarkCount').textContent = bookmarks.length;
  document.getElementById('bookmarkBadge').textContent = bookmarks.length;

  if(state.active&&!state.finished){
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('runnerContainer').style.display = 'block';
    document.getElementById('resultsContainer').style.display = 'none';
    renderRunner();
  }else if(state.finished){
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('runnerContainer').style.display = 'none';
    document.getElementById('resultsContainer').style.display = 'block';
    renderResults();
  }else{
    document.getElementById('runnerContainer').style.display = 'none';
    document.getElementById('resultsContainer').style.display = 'none';
    setMode(state.mode);
  }
}

// ─── BROWSE ───
function renderBrowse(){
  const grid = document.getElementById('quizGrid');
  grid.innerHTML = SUBJECTS.map(s=>{
    const r = results[s.id]; const best = r?r.best:0; const passed = r&&r.passed;
    const qCount = s.questions.length;
    return `<div class="quiz-card" onclick="startSubjectQuiz('${s.id}')">
      ${passed?'<div class="qc-badge passed"><i class="ic" data-ic="check"></i> Passed</div>':
      best>0?'<div class="qc-badge attempted"><i class="ic" data-ic="clock"></i> Attempted</div>':''}
      <div class="qc-icon"><i class="ic" data-ic="${s.icon}"></i></div>
      <h3>${s.name}</h3>
      <div class="qc-sub">${qCount} questions · ${['Easy','Medium','Hard'][Math.round(s.questions.reduce((acc,q)=>acc+({easy:1,medium:2,hard:3}[q.diff]||2),0)/qCount)-1]||'Medium'} avg</div>
      <div class="qc-meta">
        <span><i class="ic" data-ic="help"></i> ${qCount}</span>
        <span><i class="ic" data-ic="check"></i> Pass ${PASS_THRESHOLD}%</span>
        ${r?`<span style="color:var(--txt2)">Best: ${r.best}%</span>`:''}
      </div>
      ${r?`<div class="qc-progress"><div class="qc-progress-fill" style="width:${Math.min(r.best,100)}%"></div></div>`:''}
      <div class="qc-tag">${bookmarks.filter(b=>b.startsWith(s.id)).length} bookmarked</div>
    </div>`;
  }).join('');
  injectIcons(grid);
}

function startSubjectQuiz(id){
  const s = SUBJECTS.find(s=>s.id===id);
  if(!s){showToast('⚠️ Subject not found');return}
  const qs = s.questions.map((q,i)=>({...q,subjectId:s.id,subject:s.name,qid:s.id+'-'+i,diff:q.diff||'medium'}));
  if(!qs.length){showToast('⚠️ No questions');return}
  state.active = {id, subject:s.name, questions:qs, shuffled:shuffle(qs), isQuick:false, isExam:false};
  state.startTime = Date.now(); state.timer = 0; beginRun();
}

// ─── QUICK ───
function renderQuick(){
  const subjects = SUBJECTS.map(s=>s.name);
  document.getElementById('quickSetup').innerHTML = `
    <div class="field"><label>📚 Subject</label><div class="chip-row" id="topicChips">${['All subjects',...subjects].map((s,i)=>`<div class="chip ${i===0?'active':''}" onclick="setQuickTopic('${i===0?null:s}')">${s}</div>`).join('')}</div></div>
    <div class="field"><label>📝 Questions</label><div class="chip-row" id="countChips">${[3,5,10,15,20].map(n=>`<div class="chip ${n===5?'active':''}" onclick="setQuickCount(${n})">${n}</div>`).join('')}</div></div>
    <div class="field"><label>⚡ Difficulty</label><div class="chip-row" id="difficultyChips">${['mixed','easy','medium','hard'].map(d=>`<div class="chip ${d==='mixed'?'active':''}" onclick="setDifficulty('${d}')">${d.charAt(0).toUpperCase()+d.slice(1)}</div>`).join('')}</div></div>
    <div class="qp-stats" id="qpStats"></div>
    <button class="btn btn-primary" onclick="startQuick()" style="width:100%;justify-content:center;padding:12px;"><i class="ic" data-ic="zap"></i> Start Quick Practice</button>
  `;
  updateQuickStats(); injectIcons(document.getElementById('quickSetup'));
}

function updateQuickStats(){
  let pool = ALL_QUESTIONS;
  if(state.quickTopic) pool = pool.filter(q=>q.subject===state.quickTopic);
  if(state.difficulty!=='mixed') pool = pool.filter(q=>q.diff===state.difficulty);
  const avg = pool.length ? pool.reduce((s,q)=>s+({easy:1,medium:2,hard:3}[q.diff]||2),0)/pool.length : 0;
  document.getElementById('qpStats').innerHTML = `
    <div class="qp-stat"><div class="num">${pool.length}</div><div class="lbl">Available</div></div>
    <div class="qp-stat"><div class="num">${Math.min(state.quickCount,pool.length)}</div><div class="lbl">Selected</div></div>
    <div class="qp-stat"><div class="num">${avg?['Easy','Medium','Hard'][Math.round(avg)-1]||'—':'—'}</div><div class="lbl">Avg difficulty</div></div>
    <div class="qp-stat"><div class="num">${pool.filter(q=>bookmarks.includes(q.qid)).length}</div><div class="lbl">Bookmarked</div></div>
  `;
}

function setQuickTopic(t){state.quickTopic=t;updateQuickStats();}
function setQuickCount(n){state.quickCount=n;updateQuickStats();}
function setDifficulty(d){state.difficulty=d;updateQuickStats();}

function startQuick(){
  let pool = ALL_QUESTIONS;
  if(state.quickTopic) pool = pool.filter(q=>q.subject===state.quickTopic);
  if(state.difficulty!=='mixed') pool = pool.filter(q=>q.diff===state.difficulty);
  if(!pool.length){showToast('⚠️ No questions match your filters');return}
  pool = shuffle(pool).slice(0,Math.min(state.quickCount,pool.length));
  state.active = {id:'quick',subject:state.quickTopic||'Mixed',questions:pool,shuffled:pool,isQuick:true,isExam:false};
  state.startTime = Date.now(); state.timer = 0; beginRun();
}

  const subjects = SUBJECTS.map(s=>s.name);
  document.getElementById('examSetup').innerHTML = `
    <div class="field"><label>📚 Subject</label><div class="chip-row" id="examTopicChips">${['All subjects',...subjects].map((s,i)=>`<div class="chip ${i===0?'active':''}" onclick="setExamTopic('${i===0?null:s}')">${s}</div>`).join('')}</div></div>
    <div class="field"><label>⏱️ Time Limit</label><div class="chip-row" id="examTimeChips">${[300,600,900,1800].map((t,idx)=>`<div class="chip ${idx===0?'active':''}" onclick="setExamTime(${t})">${t/60} min</div>`).join('')}</div></div>
    <div class="field"><label>📝 Questions</label><div class="chip-row" id="examCountChips">${[10,15,20,30].map((n,idx)=>`<div class="chip ${idx===0?'active':''}" onclick="setExamCount(${n})">${n}</div>`).join('')}</div></div>
    <button class="btn btn-primary" onclick="startExam()" style="width:100%;justify-content:center;padding:12px;"><i class="ic" data-ic="clock"></i> Start Exam</button>
  `;
  injectIcons(document.getElementById('examSetup'));
}

let examTopic=null;
function setExamTopic(t){examTopic=t;document.querySelectorAll('#examTopicChips .chip').forEach(c=>c.classList.remove('active'));}
function setExamTime(t){state.examTime=t;document.querySelectorAll('#examTimeChips .chip').forEach(c=>c.classList.remove('active'));}
function setExamCount(n){state.examCount=n;document.querySelectorAll('#examCountChips .chip').forEach(c=>c.classList.remove('active'));}

function startExam(){
  let pool = ALL_QUESTIONS;
  if(examTopic) pool = pool.filter(q=>q.subject===examTopic);
  if(!pool.length){showToast('⚠️ No questions');return}
  pool = shuffle(pool).slice(0,Math.min(state.examCount,pool.length));
  state.active = {id:'exam',subject:examTopic||'Mixed',questions:pool,shuffled:pool,isQuick:false,isExam:true};
  state.startTime = Date.now(); state.timer = state.examTime; beginRun();
}

// ─── HISTORY ───
function renderHistory(){
  const container = document.getElementById('historyList');
  if(!history.length){container.innerHTML='<div class="empty-state"><i class="ic" data-ic="clock"></i>No attempts yet.</div>';return}
  container.innerHTML = `<h3>Your Attempts (${history.length})</h3>` +
    history.slice().reverse().map(h=>`
      <div class="history-item">
        <span class="h-subject">${h.subject}</span>
        <span class="h-score ${h.passed?'pass':'fail'}">${h.score}% ${h.passed?'✅':'❌'}</span>
        <span class="h-detail">${h.correct}/${h.total} · ${h.time}s</span>
        <span class="h-date">${h.date}</span>
      </div>
    `).join('');
  injectIcons(container);
}

// ─── ANALYTICS ───
function renderAnalytics(){
  const container = document.getElementById('analyticsContainer');
  const total = history.length; const passed = history.filter(h=>h.passed).length;
  const avgScore = total?Math.round(history.reduce((a,h)=>a+h.score,0)/total):0;
  const bySubject = {}; SUBJECTS.forEach(s=>{bySubject[s.id]={name:s.name,attempts:[],scores:[]};});
  history.forEach(h=>{const id = Object.keys(bySubject).find(k=>bySubject[k].name===h.subject); if(id){bySubject[id].attempts.push(h); bySubject[id].scores.push(h.score)}});
  let html = `<h3>Performance Analytics</h3>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;">
      <div class="result-stat"><div class="num">${total}</div><div class="lbl">Attempts</div></div>
      <div class="result-stat"><div class="num">${passed}</div><div class="lbl">Passed</div></div>
      <div class="result-stat"><div class="num">${avgScore}%</div><div class="lbl">Avg Score</div></div>
    </div>
    <div class="analytics-grid">`;
  Object.keys(bySubject).forEach(id=>{const d=bySubject[id]; const best=d.scores.length?Math.max(...d.scores):0;
    const avg=d.scores.length?Math.round(d.scores.reduce((a,b)=>a+b,0)/d.scores.length):0;
    html+=`<div class="analytics-card"><div class="subj">${d.name}</div><div class="score">${best}%</div>
      <div class="bar"><div class="bar-fill" style="width:${best}%"></div></div>
      <div class="count">${d.scores.length} attempts · avg ${avg}%</div></div>`;});
  html+=`</div>`; container.innerHTML=html; injectIcons(container);
}

// ─── BOOKMARKS ───
function renderBookmarks(){
  const container = document.getElementById('bookmarksList');
  if(!bookmarks.length){container.innerHTML='<div class="empty-state"><i class="ic" data-ic="book"></i>No bookmarks.</div>';return}
  const qs = ALL_QUESTIONS.filter(q=>bookmarks.includes(q.qid));
  if(!qs.length){container.innerHTML='<div class="empty-state"><i class="ic" data-ic="book"></i>Bookmarks not found.</div>';return}
  container.innerHTML = `<h3>Bookmarked Questions (${qs.length})</h3>` +
    qs.map(q=>`
      <div class="bookmark-item" onclick="startBookmarkedQuiz('${q.qid}')">
        <span class="b-subject">${q.subject}</span>
        <span class="b-text">${q.q.replace(/<[^>]+>/g,'').slice(0,50)}${q.q.length>50?'…':''}</span>
        <button class="b-remove" onclick="event.stopPropagation();toggleBookmark('${q.qid}')">Remove</button>
      </div>
    `).join('');
  injectIcons(container);
}

function startBookmarkedQuiz(qid){
  const qs = ALL_QUESTIONS.filter(q=>bookmarks.includes(q.qid));
  if(!qs.length){showToast('⚠️ No bookmarks');return}
  state.active = {id:'bookmarks',subject:'Bookmarks',questions:qs,shuffled:shuffle(qs),isQuick:true,isExam:false};
  state.startTime = Date.now(); state.timer = 0; beginRun();
}

function toggleBookmark(qid){
  const idx = bookmarks.indexOf(qid);
  if(idx>-1) bookmarks.splice(idx,1); else bookmarks.push(qid);
  saveState(); render(); showToast(idx>-1?'⭐ Removed':'⭐ Bookmarked!');
}
function isBookmarked(qid){return bookmarks.includes(qid)}

// ─── RUNNER ───
function beginRun(){
  state.qi=0; state.answered=false; state.correctCount=0; state.streak=0; state.finished=false;
  if(state.timerInterval){clearInterval(state.timerInterval); state.timerInterval=null}
  render();
  if(state.active&&state.active.isExam){
    state.timerInterval = setInterval(()=>{
      state.timer--;
      if(state.timer<=0){clearInterval(state.timerInterval); state.timerInterval=null; finish()}
      updateTimerDisplay();
    },1000);
  }
}

function updateTimerDisplay(){
  const el = document.getElementById('qTimer');
  if(!el) return;
  const m=Math.floor(state.timer/60), s=state.timer%60;
  el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
  el.className = 'q-timer'+(state.timer<30?' danger':state.timer<60?' warning':'');
}

function renderRunner(){
  const container = document.getElementById('runnerContainer');
  const A = state.active;
  const q = A.shuffled[state.qi];
  const pct = Math.round(state.qi/A.shuffled.length*100);
  const total = A.shuffled.length;
  const isBook = isBookmarked(q.qid);

  // Build question HTML with math delimiters preserved
  let qHtml = q.q;

  container.innerHTML = `<div class="runner">
    <div class="runner-top">
      <span class="q-count">${state.qi+1}/${total}</span>
      <div class="runner-bar"><div class="runner-fill" style="width:${pct}%"></div></div>
      <span class="q-scorechip">${state.correctCount} ✓${state.streak>1?` <span class="streak">🔥${state.streak}</span>`:''}</span>
      ${A.isExam?`<span class="q-timer" id="qTimer">${Math.floor(state.timer/60)}:${(state.timer%60).toString().padStart(2,'0')}</span>`:''}
    </div>
    <div class="q-card lg lg-card">
      <div class="lg-effect"></div><div class="lg-tint"></div><div class="lg-shine"></div>
      <div class="q-topic">
        <span>${q.subject}</span>
        <span style="opacity:.5">·</span>
        <span class="q-diff ${q.diff}">${q.diff}</span>
        <span style="opacity:.5">·</span>
        <span style="opacity:.7">${q.concept||'General'}</span>
        <button class="q-bookmark ${isBook?'bookmarked':''}" onclick="toggleBookmark('${q.qid}')" title="Bookmark">
          <i class="ic" data-ic="${isBook?'bookmark-fill':'bookmark'}"></i>
        </button>
      </div>
      <div class="q-text" id="qTextContainer">${qHtml}</div>
      <div class="options" id="opts">
        ${q.choices.map((c,i)=>`<button class="option" onclick="answer(${i})" data-idx="${i}">
          <span class="opt-letter">${String.fromCharCode(65+i)}</span>
          <span class="opt-text">${c}</span>
          <span class="opt-check"><i class="ic" data-ic="check"></i></span>
        </button>`).join('')}
      </div>
      <div class="feedback" id="fb"></div>
      <div class="runner-actions">
        <div class="left"><span class="kb-hint"><kbd>1-4</kbd> select · <kbd>Enter</kbd> next · <kbd>B</kbd> bookmark</span></div>
        <div class="right" id="ract"></div>
      </div>
    </div>
    <div style="text-align:center;margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
      <button class="btn btn-sm" onclick="quitQuiz()"><i class="ic" data-ic="list"></i> Quit</button>
      ${A.isExam?`<span style="color:var(--txt3);font-size:12px;">⏱️ ${Math.floor(state.timer/60)}:${(state.timer%60).toString().padStart(2,'0')} remaining</span>`:''}
    </div>
  </div>`;
  injectIcons(container);
  updateTimerDisplay();

  // Render KaTeX math in question and options
  setTimeout(() => {
    const containerEl = container.querySelector('.q-card');
    if(containerEl) renderMath(containerEl);
  }, 50);

  const firstOpt = container.querySelector('.option');
  if(firstOpt&&!state.answered) setTimeout(()=>firstOpt.focus(),100);
}

function answer(i){
  if(state.answered) return;
  state.answered = true;
  const A = state.active;
  const q = A.shuffled[state.qi];
  const opts = document.querySelectorAll('#opts .option');
  const right = i===q.correct;
  if(right){state.correctCount++; state.streak++}else{state.streak=0}
  if(state.streak>state.bestStreak){state.bestStreak=state.streak; saveState()}
  opts.forEach((o,idx)=>{o.disabled=true; if(idx===q.correct)o.classList.add('correct'); else if(idx===i)o.classList.add('wrong')});
  const fb = document.getElementById('fb');
  fb.className = 'feedback show '+(right?'right':'wrong');
  fb.innerHTML = `<div class="fb-title"><i class="ic" data-ic="${right?'check':'x'}"></i> ${right?'Correct!':'Not quite'}</div>
    <div class="fb-exp">${q.exp}</div>`;
  injectIcons(fb);
  const last = state.qi === A.shuffled.length-1;
  document.getElementById('ract').innerHTML = `<button class="btn btn-primary" onclick="next()" id="nextBtn">${last?'See results':'Next question'} <i class="ic" data-ic="arrow-right"></i></button>`;
  injectIcons(document.getElementById('ract'));
  document.getElementById('nextBtn')?.focus();
}

function next(){
  const A = state.active;
  if(state.qi < A.shuffled.length-1){state.qi++; state.answered=false; render()}
  else{finish()}
}

function finish(){
  if(state.timerInterval){clearInterval(state.timerInterval); state.timerInterval=null}
  const A = state.active;
  const pct = Math.round(state.correctCount/A.shuffled.length*100);
  const passed = pct >= PASS_THRESHOLD;
  const elapsed = Math.round((Date.now()-state.startTime)/1000);
  if(!A.isQuick&&A.id!=='quick'&&A.id!=='exam'&&A.id!=='bookmarks'){
    const prev = results[A.id];
    results[A.id] = {best:Math.max(pct, prev?prev.best:0), passed:passed||(prev&&prev.passed)};
    saveState();
  }
  history.push({subject:A.subject,score:pct,passed:passed,date:new Date().toLocaleDateString('en-GB')+' '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),correct:state.correctCount,total:A.shuffled.length,time:elapsed});
  saveState();
  state.finished = true;
  state.lastPct = pct;
  state.lastPassed = passed;
  state.elapsed = elapsed;
  render();
}

function renderResults(){
  const container = document.getElementById('resultsContainer');
  const pct = state.lastPct, passed = state.lastPassed, A = state.active;
  const circ = 2*Math.PI*60, off = circ*(1-pct/100);
  const total = A.shuffled.length, correct = state.correctCount, wrong = total-correct;
  const mins = Math.floor(state.elapsed/60), secs = state.elapsed%60;
  container.innerHTML = `<div class="results">
    <div class="result-ring">
      <svg width="140" height="140" viewBox="0 0 140 140">
        <circle cx="70" cy="70" r="60" stroke="var(--tint2)" stroke-width="10" fill="none" class="ring-bg"/>
        <circle cx="70" cy="70" r="60" stroke="${passed?'var(--ok)':'var(--no)'}" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${off}" class="ring-fg"/>
      </svg>
      <div class="result-pct"><div class="big">${pct}%</div><div class="lbl">${correct}/${total}</div></div>
    </div>
    <div class="result-verdict ${passed?'pass':'fail'}">${passed?'🎉 Passed!':'💪 Keep practising'}</div>
    <div class="result-sub">${passed?`You beat the ${PASS_THRESHOLD}% threshold.`:`You need ${PASS_THRESHOLD}% to pass. Review and retake.`}</div>
    <div class="result-stats">
      <div class="result-stat"><div class="num">${correct}</div><div class="lbl">Correct</div></div>
      <div class="result-stat"><div class="num">${wrong}</div><div class="lbl">Wrong</div></div>
      <div class="result-stat"><div class="num">${mins}m ${secs}s</div><div class="lbl">Time</div></div>
      <div class="result-stat"><div class="num">${state.streak}</div><div class="lbl">Streak</div></div>
    </div>
    <div class="result-actions">
      <button class="btn btn-primary" onclick="retake()"><i class="ic" data-ic="redo"></i> Retake</button>
      <button class="btn" onclick="quitQuiz()"><i class="ic" data-ic="list"></i> Back</button>
    </div>
  </div>`;
  injectIcons(container);
}

function retake(){
  if(state.active.isQuick) startQuick();
  else if(state.active.isExam) startExam();
  else if(state.active.id==='bookmarks'){const qs=ALL_QUESTIONS.filter(q=>bookmarks.includes(q.qid)); if(!qs.length){showToast('⚠️ No bookmarks');return} state.active.questions=qs; state.active.shuffled=shuffle(qs); beginRun()}
  else{const s=SUBJECTS.find(sb=>sb.id===state.active.id); if(s){const qs=s.questions.map((q,i)=>({...q,subjectId:s.id,subject:s.name,qid:s.id+'-'+i,diff:q.diff||'medium'})); state.active.questions=qs; state.active.shuffled=shuffle(qs); beginRun()}else{showToast('⚠️ Could not retake')}}
}

function quitQuiz(){
  if(state.timerInterval){clearInterval(state.timerInterval); state.timerInterval=null}
  state.active=null; state.finished=false; render();
}

// ─── TOAST ───
function showToast(msg){const t=document.getElementById('toast'),m=document.getElementById('toastMsg'); if(!t||!m)return; m.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2800)}

// ─── MODE TABS ───
document.querySelectorAll('.mode-tab').forEach(tab=>{
  tab.addEventListener('click',function(){
    if(state.timerInterval){clearInterval(state.timerInterval); state.timerInterval=null}
    state.active=null; state.finished=false; state.mode=this.dataset.mode; setMode(state.mode);
  });
});

// ─── INIT ───
document.addEventListener('DOMContentLoaded',()=>{
  setMode('browse');
  saveState();
  // Initial math render after page load
  setTimeout(()=>{renderMath(document.body);},500);
  console.log(`📝 EDUMOE Ultimate Quizzes loaded — ${ALL_QUESTIONS.length} questions across ${SUBJECTS.length} subjects.`);
});

window.startSubjectQuiz=startSubjectQuiz; window.startQuick=startQuick; window.startExam=startExam;
window.answer=answer; window.next=next; window.retake=retake; window.quitQuiz=quitQuiz;
window.toggleBookmark=toggleBookmark; window.setMode=setMode;
window.setTheme=setTheme; window.setCustomTheme=setCustomTheme; window.toggleCRT=toggleCRT;
window.showToast=showToast;
</script>
</body>
</html>
